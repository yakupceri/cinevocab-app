<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD21E">
<!-- Guvenlik: yalnizca uygulamanin kendi dosyalari calisir; baglanti yalnizca CineVocab sunucusuna acilir. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data: https:; connect-src 'self' https://cinevocab.up.railway.app wss://cinevocab.up.railway.app; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>CineVocab</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Ikon seti: butun ikonlar ayni kalin cizgiyle elde cizildi (emoji yok). Kullanim: <svg class="ic"><use href="#i-ad"/></svg> -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-clap" viewBox="0 0 24 24"><path d="M4 10h16v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM4 10L3 6l15.500-3 .800 3.700zM8 5l2.200 4.300M13 4l2.200 4.300"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.500-4 5-5 8-5s6.500 1 8 5"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 21a6.500 6.500 0 0 1-6.500-6.500c0-2.500 1.400-4.200 2.900-5.700.200 1.500.900 2.500 2 3 0-3.300.800-6.300 3.100-8.800.300 3.300 5 5.900 5 11.500A6.500 6.500 0 0 1 12 21z"/></symbol>
    <symbol id="i-puzzle" viewBox="0 0 24 24"><path d="M4 7h5.200a2.300 2.300 0 1 1 3.600 0H18v5.200a2.300 2.300 0 1 0 0 3.600V20H4v-4.200a2.300 2.300 0 1 0 0-3.600z"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.500"/><circle cx="12" cy="12" r=".6"/></symbol>
    <symbol id="i-cards" viewBox="0 0 24 24"><rect x="8" y="3" width="12" height="15" rx="2"/><path d="M5 7.500V19a2 2 0 0 0 2 2h8.500"/></symbol>
    <symbol id="i-quiz" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="8" height="6" rx="2"/><rect x="13" y="14" width="8" height="6" rx="2"/></symbol>
    <symbol id="i-swords" viewBox="0 0 24 24"><path d="M4 4l11 11M12.500 17.500l5-5M17 17l3 3M20 4L9 15M6.500 12.500l5 5M7 17l-3 3"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8M10 17h4"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8"/></symbol>
    <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4zM14 7.500v1.500M14 11.250v1.500M14 15v1.500"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9.500 17h5M10.500 20h3M12 3a6 6 0 0 0-3.500 10.900c.400.300.700.900.700 1.400V15h5.600v.300c0-.500.300-1.100.700-1.400A6 6 0 0 0 12 3z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.500l2.600 5.300 5.900.900-4.300 4.100 1 5.800-5.200-2.800-5.200 2.800 1-5.800-4.300-4.100 5.900-.900z"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.500 6.500a8 8 0 0 1 0 11"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.500-2.500h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.500"/></symbol>
    <symbol id="i-logo" viewBox="0 0 40 28"><path d="M3 1h34a2 2 0 0 1 2 2v7a4 4 0 0 0 0 8v7a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-7a4 4 0 0 0 0-8V3a2 2 0 0 1 2-2z"/></symbol>
  </svg>

  <header class="top">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 40 28"><use href="#i-logo"/></svg><b>Cv</b></span>
    <b class="brand">CineVocab</b>
    <span class="pill" id="streak" hidden><svg class="ic"><use href="#i-flame"/></svg><span id="streakN">0</span></span>
  </header>

  <main id="main">
    <!-- Giris / kayit -->
    <section id="v-auth" hidden>
      <h1 class="display" data-i="authH"></h1>
      <p class="sub" data-i="authSub"></p>
      <div class="card">
        <div class="seg" id="authSeg">
          <button type="button" id="segLogin" aria-pressed="true" data-i="login"></button>
          <button type="button" id="segReg" aria-pressed="false" data-i="register"></button>
        </div>
        <form id="authForm">
          <div class="field"><label for="aUser" data-i="username"></label>
            <input id="aUser" maxlength="40" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
          <div class="field" id="aMailRow" hidden><label for="aMail" data-i="email"></label>
            <input id="aMail" type="email" maxlength="120" autocomplete="email" autocapitalize="none"></div>
          <div class="field"><label for="aPass" data-i="password"></label>
            <input id="aPass" type="password" maxlength="200" autocomplete="current-password"></div>
          <button class="btn" id="aGo" type="submit"></button>
        </form>
        <div id="gBox" hidden>
          <div class="or" data-i="or2"></div>
          <button class="btn ghost" id="gBtn" type="button" data-i="google"></button>
        </div>
        <form id="codeForm" hidden>
          <p class="sub" id="codeSub"></p>
          <input id="aCode" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
          <button class="btn" type="submit" data-i="verify"></button>
          <button class="link" type="button" id="codeBack" data-i="back"></button>
        </form>
        <div id="recBox" hidden>
          <p class="sub" data-i="recText"></p>
          <code class="code" id="recCode"></code>
          <button class="btn" type="button" id="recOk" data-i="recOk"></button>
        </div>
        <p class="note" id="aMsg"></p>
        <button class="btn ghost" id="tryBtn" type="button"></button>
        <p class="legal"><span data-i="legal"></span> <a id="lnkPrivacy0" target="_blank" rel="noopener" data-i="privacy"></a></p>
      </div>
    </section>

    <!-- Ilk acilis: hangi dili ogreniyorsun? -->
    <section id="v-start" hidden>
      <h1 class="display" data-i="startH"></h1>
      <p class="sub" data-i="startSub"></p>
      <div class="card">
        <div class="field first"><label for="oSrc" data-i="startSrc"></label><select id="oSrc"></select></div>
        <div class="field"><label for="oDst" data-i="startDst"></label><select id="oDst"></select></div>
        <button class="btn" id="oGo" type="button" data-i="startGo"></button>
        <p class="note" id="oMsg"></p>
      </div>
    </section>

    <!-- Ilk acilis, 2. adim: nasil baslamak istersin? -->
    <section id="v-how" hidden>
      <h1 class="display" data-i="howH"></h1>
      <p class="sub" data-i="howSub"></p>
      <button class="tile hot" id="hQuick" type="button"><i><svg class="ic"><use href="#i-film"/></svg></i><span><b data-i="howQuick"></b><em data-i="howQuickS"></em></span></button>
      <button class="tile" id="hSnap" type="button" disabled><i><svg class="ic"><use href="#i-camera"/></svg></i><span><b data-i="howSnap"></b><em data-i="howSnapS"></em></span></button>
      <button class="tile" id="hPaste" type="button"><i><svg class="ic"><use href="#i-list"/></svg></i><span><b data-i="howPaste"></b><em data-i="howPasteS"></em></span></button>
      <button class="tile" id="hDuel" type="button"><i><svg class="ic"><use href="#i-swords"/></svg></i><span><b data-i="howDuel"></b><em data-i="howDuelS"></em></span></button>
      <button class="link" id="hSkip" type="button" data-i="howSkip"></button>
    </section>

    <!-- Ana sayfa: haftalik kart, siradaki is (bilet), bugunun programi, ilerleme, videolar -->
    <section id="v-home" hidden>
      <p class="hello" id="hello"></p>
      <h1 data-i="homeH"></h1>
      <div class="week" id="week"></div>
      <p class="weeknote" id="weekNote"></p>

      <div class="ticket" id="hero"><div class="ticket-in">
        <div class="t-top"><h2 id="heroT"></h2><span class="t-no" id="heroNo"></span></div>
        <p class="t-sub" id="heroS"></p>
        <div class="perf"></div>
        <div class="t-bot"><button class="btn" id="cta" type="button"></button><span class="t-xp" id="heroXp"></span></div>
      </div></div>

      <h2 class="sec" id="progH" data-i="progH"></h2>
      <ul class="prog" id="quests"></ul>

      <div class="card meter">
        <div class="m-row"><b id="goalNum"></b><span id="goalSub"></span></div>
        <div class="bar"><i id="goalFill"></i></div>
        <div class="m-row lv"><b id="lvlName"></b><span id="lvlLeft"></span></div>
        <div class="bar thin"><i id="lvlFill"></i></div>
        <div class="m-row lv know"><b id="knowNum"></b><span id="knowSub"></span></div>
      </div>
      <button class="guest" id="guestBar" type="button" hidden></button>

      <h2 class="sec" data-i="feedH"></h2>
      <div id="feed"></div>
      <p class="empty small" id="feedEmpty" hidden></p>
    </section>

    <!-- Kelimeler -->
    <section id="v-words" hidden>
      <h1 data-i="wordsH"></h1>
      <p class="sub" id="wordsSub"></p>
      <button class="filter" id="wFilter" type="button" hidden></button>
      <input id="wq" type="search" maxlength="60" data-i-ph="search" autocomplete="off">
      <ul class="wl" id="wl"></ul>
      <button class="btn ghost" id="wMore" type="button" hidden data-i="more"></button>
      <p class="empty" id="wEmpty" hidden></p>
    </section>

    <!-- Ekle: videodan kelime cikar + hazir paketler -->
    <section id="v-add" hidden>
      <div id="addPick">
        <h1 data-i="addH"></h1>
        <p class="sub" data-i="addSub"></p>
        <button class="tile hot" id="aQuick" type="button"><i><svg class="ic"><use href="#i-film"/></svg></i><span><b data-i="howQuick"></b><em data-i="howQuickS"></em></span></button>
        <button class="tile" id="aSnap" type="button" disabled><i><svg class="ic"><use href="#i-camera"/></svg></i><span><b data-i="howSnap"></b><em data-i="howSnapS"></em></span></button>
        <button class="tile" id="aPaste" type="button"><i><svg class="ic"><use href="#i-list"/></svg></i><span><b data-i="howPaste"></b><em data-i="howPasteS"></em></span></button>
        <button class="tile" id="aDuel" type="button"><i><svg class="ic"><use href="#i-swords"/></svg></i><span><b data-i="howDuel"></b><em data-i="howDuelS"></em></span></button>
      </div>
      <div id="addForm" hidden>
      <button class="link back" id="addBack" type="button" data-i="back"></button>
      <h1 data-i="videoH"></h1>
      <p class="sub" data-i="videoSub"></p>
      <div class="card">
        <div class="lang">
          <div><label for="src" data-i="srcLbl"></label><select id="src"></select></div>
          <button class="swap" id="swap" type="button" data-i-aria="swap"><svg class="ic"><use href="#i-swap"/></svg></button>
          <div><label for="dst" data-i="dstLbl"></label><select id="dst"></select></div>
        </div>
      </div>
      <div class="card">
        <label for="srcTitle" data-i="titleLbl"></label>
        <input id="srcTitle" type="text" maxlength="60" autocomplete="off">
        <div class="field">
          <label for="text" data-i="textLbl"></label>
          <textarea id="text" rows="6" maxlength="400000" autocomplete="off" autocapitalize="none" spellcheck="false"></textarea>
        </div>
        <button class="btn ghost" id="pick" type="button" data-i="pickFile"></button>
        <input id="file" type="file" accept=".srt,.vtt,.txt,text/plain" hidden>
        <div class="field">
          <label for="count" data-i="countLbl"></label>
          <select id="count"><option>25</option><option selected>50</option><option>100</option></select>
        </div>
        <button class="btn" id="go" type="button" data-i="extract"></button>
        <p class="note" id="msg"></p>
        <p class="note" data-i="textPriv"></p>
      </div>
      <div class="card" id="plan" hidden>
        <h2 id="planTitle"></h2>
        <p class="sub" id="planSum"></p>
        <div class="chips" id="planWords"></div>
        <p class="note" id="planHint" data-i="tapRemove"></p>
        <button class="btn" id="addBtn" type="button"></button>
        <div class="bar" id="addBar" hidden><i id="addFill"></i></div>
        <p class="note" id="addMsg"></p>
      </div>
      </div>
      <div id="packBox" hidden>
        <h2 class="sec" data-i="packH"></h2>
        <p class="sub" data-i="packSub"></p>
        <div id="packs"></div>
      </div>
    </section>

    <!-- Oyna -->
    <section id="v-play" hidden>
      <h1 data-i="playH"></h1>
      <p class="sub" data-i="playSub"></p>
      <button class="tile hot" id="tFlow" type="button"><i><svg class="ic"><use href="#i-film"/></svg></i><span><b data-i="flowH"></b><em data-i="flowS"></em></span></button>
      <button class="tile" id="tCloze" type="button"><i><svg class="ic"><use href="#i-film"/></svg></i><span><b data-i="clozeH"></b><em data-i="clozeS"></em></span></button>
      <button class="tile" id="tPuzzle" type="button"><i><svg class="ic"><use href="#i-puzzle"/></svg></i><span><b id="tPuzzleT"></b><em id="tPuzzleS"></em></span></button>
      <button class="tile" id="tDaily" type="button"><i><svg class="ic"><use href="#i-target"/></svg></i><span><b id="tDailyT"></b><em id="tDailyS"></em></span></button>
      <button class="tile" id="tCards" type="button"><i><svg class="ic"><use href="#i-cards"/></svg></i><span><b data-i="cardsH"></b><em id="tCardsS"></em></span></button>
      <button class="tile" id="tPractice" type="button"><i><svg class="ic"><use href="#i-quiz"/></svg></i><span><b data-i="pracH"></b><em id="tPracticeS"></em></span></button>
      <button class="tile" id="tDuel" type="button"><i><svg class="ic"><use href="#i-swords"/></svg></i><span><b data-i="dH"></b><em data-i="tDuelS"></em></span></button>
      <button class="tile" id="tLeague" type="button"><i><svg class="ic"><use href="#i-trophy"/></svg></i><span><b data-i="lH"></b><em data-i="tLeagueS"></em></span></button>
      <p class="note" id="playMsg"></p>
    </section>

    <!-- Soru ekrani (pratik ve gunluk meydan okuma ortak kullanir). Kelime, altyazi seridi gibi gorunur. -->
    <section id="v-quiz" hidden>
      <div class="bar"><i id="qFill"></i></div>
      <div class="qtop"><span id="qCount"></span><span class="combo" id="qCombo" hidden></span><span id="qScore"></span></div>
      <div class="screen"><div class="subtitle" id="qWord"></div></div>
      <div class="opts" id="qOpts"></div>
      <p class="note" id="qInfo"></p>
    </section>

    <!-- Kelime akisi: tek kelime, yukari kaydir, sonraki. Kelime + anlam + ses. -->
    <section id="v-flow" hidden>
      <div class="fl-top">
        <button class="fl-x" id="flClose" type="button" data-i-aria="back"><svg class="ic"><use href="#i-x"/></svg></button>
        <span class="fl-count" id="flCount"></span>
        <button class="fl-x" id="flVoice" type="button" aria-pressed="true" data-i-aria="voiceLbl"><svg class="ic"><use href="#i-speaker"/></svg></button>
      </div>
      <div class="fl-stage" id="flStage">
        <div class="fl-card" id="flCard">
          <span class="fl-word" id="flWord"></span>
          <button class="fl-say" id="flSay" type="button" data-i-aria="voiceLbl"><svg class="ic"><use href="#i-speaker"/></svg></button>
          <span class="fl-tr" id="flTr"></span>
        </div>
        <div class="fl-pop" id="flPop" aria-hidden="true"></div>
      </div>
      <p class="fl-hint" data-i="flowHint"></p>
      <div class="row2">
        <button class="btn no" id="flAgain" type="button"><svg class="ic"><use href="#i-x"/></svg><span data-i="cNo"></span></button>
        <button class="btn yes" id="flKnow" type="button"><svg class="ic"><use href="#i-check"/></svg><span data-i="cYes"></span></button>
      </div>
    </section>

    <!-- Kartlar: karti cevir, bildiysen saga, bilemediysen sola kaydir -->
    <section id="v-cards" hidden>
      <div class="bar"><i id="cFill"></i></div>
      <div class="qtop"><span id="cCount"></span><span class="combo" id="cCombo" hidden></span><span id="cScore"></span></div>
      <div class="deck">
        <button class="fc-say" id="fcSay" type="button" data-i-aria="voiceLbl"><svg class="ic"><use href="#i-speaker"/></svg></button>
        <div class="fcard under" aria-hidden="true"></div>
        <button class="fcard" id="fcard" type="button">
          <span class="fc-word" id="fcWord"></span>
          <span class="fc-tr" id="fcTr" hidden></span>
          <span class="fc-tip" id="fcTip"></span>
        </button>
      </div>
      <div class="row2">
        <button class="btn no" id="cNo" type="button"><svg class="ic"><use href="#i-x"/></svg><span data-i="cNo"></span></button>
        <button class="btn yes" id="cYes" type="button"><svg class="ic"><use href="#i-check"/></svg><span data-i="cYes"></span></button>
      </div>
    </section>

    <!-- Bulmaca: karisik harfleri dogru siraya diz -->
    <section id="v-puzzle" hidden>
      <div class="bar"><i id="pzFill"></i></div>
      <div class="qtop"><span id="pzCount"></span><span class="marks" id="pzMarks"></span><span class="time"><svg class="ic"><use href="#i-clock"/></svg><span id="pzTime"></span></span></div>
      <div class="screen"><div class="subtitle" id="pzHint"></div></div>
      <div class="slots" id="pzSlots"></div>
      <div class="tiles" id="pzTiles"></div>
      <div class="row2">
        <button class="btn ghost" id="pzHelp" type="button"><svg class="ic"><use href="#i-bulb"/></svg><span data-i="pzHelp"></span></button>
        <button class="btn ghost" id="pzSkip" type="button" data-i="pzSkip"></button>
      </div>
      <p class="note center" id="pzInfo"></p>
    </section>

    <!-- Sonuc ekrani: bilet kocani -->
    <section id="v-result" hidden>
      <div class="ticket result"><div class="ticket-in center">
        <div class="r-icon" id="rIconBox"><svg class="ic"><use id="rIcon" href="#i-star"/></svg></div>
        <div class="big" id="rBig"></div>
        <p class="r-line" id="rLine1"></p>
        <p class="r-line" id="rLine2"></p>
        <div class="marks big-marks" id="rGrid"></div>
        <div class="perf"></div>
        <button class="btn" id="rShare" type="button" hidden><svg class="ic"><use href="#i-share"/></svg><span data-i="share"></span></button>
        <button class="btn" id="rAgain" type="button"></button>
        <button class="btn ghost" id="rHome" type="button" data-i="toHome"></button>
        <div class="remind" id="rRemind" hidden>
          <p class="sub" data-i="remAsk"></p>
          <div class="row2">
            <button class="btn" id="remYes" type="button" data-i="remYes"></button>
            <button class="btn ghost" id="remNo" type="button" data-i="remNo"></button>
          </div>
        </div>
      </div></div>
    </section>

    <!-- Duello (canli) -->
    <section id="v-duel" hidden>
      <div id="dHome">
        <h1 data-i="dH"></h1>
        <p class="sub" data-i="dSub"></p>
        <div class="card">
          <button class="btn" id="dCreate" type="button" data-i="dQuick"></button>
          <div class="or" data-i="or2"></div>
          <label for="dCode" data-i="dCodeLbl"></label>
          <div class="row">
            <input id="dCode" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
            <button class="btn ghost" id="dJoin" type="button" data-i="dJoin"></button>
          </div>
          <p class="note" id="dMsg"></p>
        </div>
      </div>
      <div id="dRoom" hidden>
        <p class="sub center" data-i="dRoomLbl"></p>
        <div class="roomcode" id="dRoomCode"></div>
        <p class="sub center" data-i="dShare"></p>
        <button class="btn ghost" id="dInvite" type="button"><svg class="ic"><use href="#i-share"/></svg><span data-i="invite"></span></button>
        <ul class="wl" id="dPlayers"></ul>
        <button class="btn" id="dStart" type="button" data-i="dStart"></button>
        <p class="note" id="dWait" data-i="dWaitHost"></p>
        <button class="btn ghost" id="dLeave" type="button" data-i="dLeave"></button>
      </div>
      <div id="dCount" hidden>
        <p class="empty" data-i="dGetReady"></p>
        <div class="big center countdown" id="dCountN">3</div>
      </div>
      <div id="dQ" hidden>
        <div class="bar"><i id="dTime" class="timed"></i></div>
        <div class="qtop"><span id="dProg"></span><span></span></div>
        <div class="screen"><div class="subtitle" id="dWord"></div></div>
        <div class="opts" id="dOpts"></div>
        <p class="note" id="dInfo"></p>
      </div>
      <div id="dEnd" hidden>
        <h1 data-i="dEndH"></h1>
        <ul class="wl" id="dScores"></ul>
        <button class="btn" id="dAgain" type="button" data-i="dAgain"></button>
        <p class="note" id="dWait2" data-i="dWaitHost"></p>
        <button class="btn ghost" id="dLeave2" type="button" data-i="dLeave"></button>
      </div>
    </section>

    <!-- Ligler -->
    <section id="v-leagues" hidden>
      <div id="lHome">
        <h1 data-i="lH"></h1>
        <p class="sub" data-i="lSub"></p>
        <ul class="wl" id="lList"></ul>
        <p class="note" id="lEmpty"></p>
        <div class="card">
          <label for="lName" data-i="lNewLbl"></label>
          <div class="row">
            <input id="lName" maxlength="30" autocomplete="off">
            <button class="btn ghost" id="lCreate" type="button" data-i="lCreate"></button>
          </div>
          <div class="field">
            <label for="lCode" data-i="lJoinLbl"></label>
            <div class="row">
              <input id="lCode" maxlength="12" autocomplete="off" autocapitalize="characters">
              <button class="btn ghost" id="lJoin" type="button" data-i="dJoin"></button>
            </div>
          </div>
          <p class="note" id="lMsg"></p>
        </div>
      </div>
      <div id="lDetail" hidden>
        <h1 id="lTitle"></h1>
        <p class="sub" id="lInfo"></p>
        <ul class="wl" id="lBoard"></ul>
        <button class="btn" id="lShare" type="button"><svg class="ic"><use href="#i-share"/></svg><span data-i="lShareBtn"></span></button>
        <button class="btn ghost" id="lLeave" type="button" data-i="lLeave"></button>
      </div>
    </section>

    <!-- Ben (profil) -->
    <section id="v-me" hidden>
      <div class="profile">
        <div class="avatar" id="meAvatar"></div>
        <div class="who"><h1 id="meName"></h1><p class="rank" id="meLevel"></p></div>
      </div>
      <div class="counts">
        <div><b id="meWords">0</b><span data-i="wordsN"></span></div>
        <div><b id="meStreak">0</b><span data-i="streak"></span></div>
        <div><b id="meWins">0</b><span data-i="wins"></span></div>
      </div>

      <h2 class="sec" data-i="badgeH"></h2>
      <p class="sub" id="badgeSub"></p>
      <div class="badges" id="badges"></div>

      <h2 class="sec" data-i="setH"></h2>
      <div class="card">
        <label for="goalSel" data-i="goalLbl"></label>
        <select id="goalSel"><option value="30">30 XP</option><option value="50">50 XP</option><option value="100">100 XP</option></select>
        <div class="field"><label for="uiLang" data-i="appLang"></label>
          <select id="uiLang"><option value="en">English</option><option value="tr">Türkçe</option></select></div>
        <div class="field"><label class="check"><input type="checkbox" id="sndTgl"><span data-i="sndLbl"></span></label></div>
        <div class="field" id="remRow" hidden>
          <label class="check"><input type="checkbox" id="remTgl"><span data-i="remLbl"></span></label></div>
      </div>
      <div class="card">
        <h2 data-i="invH"></h2>
        <p class="sub" id="invSub"></p>
        <button class="btn" id="invBtn" type="button"><svg class="ic"><use href="#i-share"/></svg><span data-i="invBtn"></span></button>
      </div>
      <button class="btn ghost" id="logout" type="button" data-i="logout"></button>
      <a class="link" id="lnkPrivacy" target="_blank" rel="noopener" data-i="privacy"></a>
      <a class="link" id="lnkReport" hidden data-i="report"></a>
      <button class="link danger" id="delOpen" type="button" data-i="delAcc"></button>
      <div class="card" id="delBox" hidden>
        <h2 data-i="delAcc"></h2>
        <p class="sub" data-i="delText"></p>
        <div class="field"><label for="delPw" id="delLbl"></label>
          <input id="delPw" type="password" maxlength="200" autocomplete="off" autocapitalize="none"></div>
        <button class="btn danger" id="delGo" type="button" data-i="delGo"></button>
        <button class="link" id="delCancel" type="button" data-i="cancel"></button>
        <p class="note" id="delMsg"></p>
      </div>
    </section>
  </main>

  <nav id="tabs" hidden>
    <button type="button" data-view="v-home"><svg class="ic"><use href="#i-home"/></svg><span data-i="tabHome"></span></button>
    <button type="button" data-view="v-words"><svg class="ic"><use href="#i-list"/></svg><span data-i="tabWords"></span></button>
    <button type="button" data-view="v-add" class="add" data-i-aria="tabAdd"><svg class="ic"><use href="#i-plus"/></svg></button>
    <button type="button" data-view="v-play"><svg class="ic"><use href="#i-clap"/></svg><span data-i="tabPlay"></span></button>
    <button type="button" data-view="v-me"><svg class="ic"><use href="#i-user"/></svg><span data-i="tabMe"></span></button>
  </nav>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="toast" id="toast" hidden></div>
  <div class="bonus" id="bonus" hidden role="status"><b id="bonusH"></b><span class="bn" id="bonusN"></span><em id="bonusS"></em></div>

  <script src="config.js"></script>
  <script src="lang.js"></script>
  <script src="text.js"></script>
  <script src="demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
