<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<style>
  body { width: 310px; margin: 0; padding: 18px; color: #f1ead9; font: 14px "Segoe UI", Arial, sans-serif;
    background: radial-gradient(120% 70% at 80% 100%, rgba(255,138,61,.4), transparent 60%), linear-gradient(180deg, #06141a, #0f3036); }
  h1 { margin: 0; font: 800 24px Georgia, serif; text-shadow: 0 0 24px rgba(255,138,61,.4); }
  p { margin: 6px 0 0; color: #9fb0a8; line-height: 1.4; }
  input, button { width: 100%; box-sizing: border-box; margin-top: 10px; padding: 11px; font: inherit; color: inherit;
    background: rgba(4,15,18,.7); border: 1px solid rgba(233,220,192,.18); border-radius: 10px; }
  button { cursor: pointer; transition: transform .12s, border-color .12s; }
  button:hover { transform: translateY(-1px); border-color: #ff8a3d; }
  #save { background: linear-gradient(135deg, #ffb866, #ff7a2f); color: #2a1204; border: 0; font-weight: 800; }
  :focus-visible { outline: 2px solid #ff8a3d; outline-offset: 2px; }
  #st { color: #6fe0b8; min-height: 18px; }
</style></head>
<body>
  <h1>CineVocab</h1>
  <p>Panelinden aldığın eklenti anahtarını yapıştır, izlediğin kelimeler hesabına yazılsın.</p>
  <input id="key" placeholder="Eklenti anahtarı">
  <button id="save">Kaydet</button>
  <button id="open">Panelimi aç</button>
  <p id="st"></p>
  <script src="popup.js"></script>
</body></html>
