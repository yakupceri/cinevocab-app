<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family:"Big Shoulders"; src:url(fonts/bigshoulders-latin.woff2) format("woff2"); font-weight:600 800; font-display:swap;
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family:"Big Shoulders"; src:url(fonts/bigshoulders-latin-ext.woff2) format("woff2"); font-weight:600 800; font-display:swap;
    unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family:"Instrument Sans"; src:url(fonts/instrumentsans-latin.woff2) format("woff2"); font-weight:400 700; font-display:swap;
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family:"Instrument Sans"; src:url(fonts/instrumentsans-latin-ext.woff2) format("woff2"); font-weight:400 700; font-display:swap;
    unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  :root { color-scheme:dark;
    --night:#170E12; --deep:#0F080B; --panel:#25161C; --panel2:#321E26; --line:#3D3035; --line2:#5A4A50;
    --ink:#F3E9D2; --dim:#AC9C92; --ember:#FFD21E; --sun:#FFD21E; --on:#170E12; --mint:#7BD39A; --bad:#FF8A96; --sun-line:#92741D;
    --display:"Big Shoulders","Arial Narrow","Instrument Sans",system-ui,"Segoe UI",sans-serif; --text:"Instrument Sans",system-ui,"Segoe UI",Roboto,sans-serif; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { width:380px; height:584px; display:flex; flex-direction:column; overflow:hidden; background:var(--night); color:var(--ink); font:500 14px/1.45 var(--text); -webkit-font-smoothing:antialiased; }
  button, select, input { font:inherit; color:inherit; }
  button { cursor:pointer; }
  [hidden] { display:none !important; }
  :focus-visible { outline:2px solid var(--sun); outline-offset:2px; }

  /* üst çubuk */
  .top { flex:none; display:flex; align-items:center; gap:9px; padding:14px 16px 10px; }
  .top .mk { width:24px; height:28px; display:block; flex:none; }
  .top b { flex:1; font:800 19px/1 var(--display); letter-spacing:.01em; }
  .pill { display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 11px; border-radius:6px; border:1px solid var(--line); background:var(--panel); font-weight:600; font-size:13px; }
  .pill svg { width:14px; height:14px; color:var(--ember); }
  button.pill { border-color:var(--ember); color:var(--sun); background:transparent; }
  .pill.lg { position:relative; margin:0; padding:0 10px; color:var(--ink); font-size:12.5px; letter-spacing:.02em; cursor:pointer; } .pill.lg svg { color:var(--dim); } .pill.lg:hover { border-color:var(--line2); }
  .pill.lg select { position:absolute; inset:0; width:100%; height:100%; padding:0; border:0; opacity:0; cursor:pointer; }
  .pill.lg:focus-within { outline:2px solid var(--sun); outline-offset:2px; }
  .av { width:30px; height:30px; border-radius:50%; border:0; padding:0; background:var(--sun); color:var(--on); font:800 14px/30px var(--display); text-align:center; overflow:hidden; flex:none; }
  .av img { width:100%; height:100%; object-fit:cover; display:block; }

  /* görünümler */
  main { flex:1; min-height:0; position:relative; }
  .view { position:absolute; inset:0; overflow-y:auto; padding:4px 16px 16px; scrollbar-width:thin; scrollbar-color:var(--panel2) transparent; }

  /* İzle sekmesi (wt-): üstte kaymayan durum alanı, altında kayan içerik */
  #v-watch { display:flex; flex-direction:column; overflow:hidden; padding:4px 16px 0; }
  .wt-top { flex:none; padding-bottom:12px; border-bottom:1px solid var(--line); }
  .wt-scroll { flex:1; min-height:0; overflow-y:auto; margin:0 -16px; padding:12px 16px 16px; scrollbar-width:thin; scrollbar-color:var(--panel2) transparent; }
  /* film karesi: video üstü kutunun küçük bir örneği (gerçek veri değil, aria-hidden) */
  .wt-film { padding:9px 12px 11px; border-radius:10px; background:#0A0507; border:1px solid var(--line); }
  .wt-tag { display:block; font:500 10.5px/1.2 ui-monospace,Menlo,Consolas,monospace; letter-spacing:.08em; color:var(--dim); }
  .wt-line { display:flex; flex-wrap:wrap; justify-content:center; gap:2px 14px; margin-top:6px; }
  .wt-w { display:grid; justify-items:center; min-width:0; }
  .wt-w b { font:600 17px/1.2 var(--text); color:var(--ink); overflow-wrap:anywhere; }
  .wt-w i { font:normal 600 12.5px/1.3 var(--text); color:var(--line2); overflow-wrap:anywhere; transition:color .2s; }
  .wt-top[data-on="true"] .wt-w i { color:var(--sun); }
  .wt-w b.wt-ph { width:46px; height:10px; margin:5px 0; border-radius:3px; background:var(--ink); }
  .wt-w i.wt-ph { display:block; width:30px; height:6px; margin:5px 0; border-radius:3px; background:currentColor; }
  .wt-status { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px; margin:9px 2px; }
  .wt-status b { font:800 17px/1.2 var(--display); letter-spacing:.01em; color:var(--dim); }
  .wt-top[data-on="true"] .wt-status b { color:var(--sun); }
  .wt-status span { font-size:12px; line-height:1.35; color:var(--dim); } .wt-status span:empty { display:none; }
  /* tek ana düğme: kapalıyken sarı "başlat", açıkken ikincil "durdur" */
  .wt-main { display:block; width:100%; min-height:48px; padding:8px 14px; border-radius:6px; border:1px solid transparent; background:var(--sun); color:var(--on); font:800 19px/1.15 var(--display); letter-spacing:.02em; text-align:center; overflow-wrap:anywhere; }
  .wt-main:hover { filter:brightness(1.07); }
  .wt-main[aria-checked="true"] { min-height:44px; border-color:var(--line2); background:transparent; color:var(--ink); font-weight:700; font-size:16px; }
  .wt-main[aria-checked="true"]:hover { filter:none; background:var(--panel2); }
  /* dil çifti: tek sıkı satır */
  .wt-lang { display:grid; grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr); gap:8px; align-items:end; }
  .wt-lang label { margin-bottom:4px; font-size:11.5px; overflow-wrap:anywhere; }
  .wt-lang .swap { width:40px; }
  /* sıradaki adım / hazır */
  .wt-next { margin-top:12px; }
  .wt-done { list-style:none; margin:0 0 6px; padding:0; } .wt-done:empty { display:none; }
  .wt-done li { display:flex; align-items:baseline; gap:9px; padding:2px; font-size:12.5px; color:var(--dim); }
  .wt-done li::before { content:"✓"; flex:none; font-weight:700; color:var(--mint); }
  .wt-step { display:flex; align-items:baseline; gap:12px; padding:12px 14px; border-radius:10px; background:var(--panel); border:1px solid var(--line); }
  .wt-step span { flex:none; font:500 11.5px/1.2 ui-monospace,Menlo,Consolas,monospace; color:var(--dim); font-variant-numeric:tabular-nums; }
  .wt-step b { min-width:0; font:700 19px/1.2 var(--display); letter-spacing:.01em; overflow-wrap:anywhere; }
  .wt-ready { margin:0 2px; font-size:14px; font-weight:600; color:var(--mint); }
  /* bugün: cihazdaki gerçek sayılar, veri yoksa gösterilmez */
  .wt-today { margin-top:10px; }
  .wt-nums { display:flex; gap:8px; }
  .wt-num { flex:1; min-width:0; padding:9px 12px; border-radius:10px; background:var(--panel); border:1px solid var(--line); }
  .wt-num b { display:block; font:800 23px/1 var(--display); letter-spacing:.01em; font-variant-numeric:tabular-nums; }
  .wt-num span { display:block; margin-top:4px; font-size:11.5px; line-height:1.3; color:var(--dim); overflow-wrap:anywhere; }
  .wt-num.hot b { color:var(--sun); }
  .wt-match { display:flex; align-items:center; gap:10px; width:100%; min-height:40px; margin-top:8px; padding:8px 12px; border-radius:6px; border:1px solid var(--line2); background:transparent; font-weight:600; text-align:start; }
  .wt-match:hover { background:var(--panel2); } .wt-match svg { flex:none; width:18px; height:18px; color:var(--dim); }
  .wt-site { margin-top:12px; } .wt-site .note { margin-top:8px; }
  /* kutu ayarları: varsayılan kapalı */
  .wt-box { margin-top:12px; border-top:1px solid var(--line); }
  .wt-box summary { display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:40px; padding:0 2px; border-radius:6px; cursor:pointer; list-style:none; font-size:13.5px; font-weight:600; color:var(--dim); }
  .wt-box summary::-webkit-details-marker { display:none; }
  .wt-box summary::after { content:""; flex:none; width:7px; height:7px; margin-inline-end:5px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:translateY(-2px) rotate(45deg); transition:transform .15s; }
  .wt-box[open] summary::after { transform:translateY(2px) rotate(-135deg); }
  .wt-box summary:hover, .wt-box[open] summary { color:var(--ink); }
  .wt-box-in { padding:6px 2px 2px; }
  .wt-box-in .row + .row { margin-top:10px; }
  .wt-box-in .toggle::before { content:""; position:absolute; inset:-8px -4px; } /* dokunma hedefi 40px */
  .wt-box-in .btn.sm { min-height:40px; border-radius:6px; }
  .wt-box-in .wt-q { color:var(--dim); font-size:12.5px; }
  .wt-box-in .tip { margin-top:12px; }
  .note { margin:10px 2px 0; font-size:12.5px; color:var(--dim); } .note:empty { display:none; }
  .note.bad { color:var(--bad); } .note.ok { color:var(--mint); }
  .note button { margin-top:7px; }

  .card { margin-top:10px; padding:13px 14px; border-radius:10px; background:var(--panel); border:1px solid var(--line); }
  .lang { display:grid; grid-template-columns:1fr 36px 1fr; gap:8px; align-items:end; }
  label, .lbl { display:block; margin-bottom:5px; font-size:12px; color:var(--dim); }
  select, input[type=text], input[type=password], input[type=search] { width:100%; height:40px; padding:0 12px; border-radius:6px; border:1px solid var(--line2); background:var(--night); outline-offset:0; }
  select { appearance:none; padding-right:28px; background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%); background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  input::placeholder { color:var(--dim); }
  .swap { width:36px; height:40px; border-radius:6px; border:1px solid var(--line); background:transparent; display:grid; place-items:center; color:var(--dim); }
  .swap:hover { color:var(--ink); border-color:var(--line2); } .swap svg { width:16px; height:16px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:42px; padding:9px 14px; border-radius:6px; border:1px solid var(--line2); background:transparent; font-weight:600; text-align:center; }
  .btn:hover { background:var(--panel2); }
  .btn.p { border-color:transparent; background:var(--sun); color:var(--on); font-weight:700; } .btn.p:hover { filter:brightness(1.07); background:var(--sun); }
  .btn.sm { width:auto; min-height:34px; padding:6px 12px; font-size:13px; border-radius:10px; }
  .btn[disabled] { opacity:.55; cursor:default; }
  .link { display:block; width:100%; margin-top:10px; padding:4px; border:0; background:none; color:var(--dim); font-size:13px; text-align:center; } .link:hover { color:var(--ink); }
  .row { display:flex; align-items:center; gap:10px; } .row > .grow { flex:1; min-width:0; } .row > select { width:96px; flex:none; }
  .tip { display:flex; gap:10px; align-items:flex-start; font-size:12.5px; color:var(--dim); } .tip svg { flex:none; width:18px; height:18px; margin-top:1px; color:var(--ember); }
  .toggle { box-shadow:inset 0 0 0 1px var(--line2); position:relative; flex:none; width:42px; height:24px; border-radius:99px; border:0; padding:0; background:var(--panel2); transition:background .15s; }
  .toggle::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:var(--ink); transition:transform .15s; }
  .toggle[aria-checked="true"] { background:var(--sun); } .toggle[aria-checked="true"]::after { transform:translateX(18px); background:var(--on); }
  .sep { height:1px; margin:12px 0; background:var(--line); }

  /* giriş */
  #auth { z-index:5; background:var(--night); padding-top:6px; }
  h1 { margin:8px 0 6px; font:800 25px/1.12 var(--display); letter-spacing:.01em; }
  h2 { margin:0; font:700 16px/1.25 var(--display); letter-spacing:.01em; }
  .sub { margin:0 0 16px; color:var(--dim); }
  .field { margin-top:10px; position:relative; }
  .field .eye { position:absolute; right:4px; top:4px; width:32px; height:32px; border:0; border-radius:6px; background:none; color:var(--dim); display:grid; place-items:center; } .field .eye svg { width:17px; height:17px; }
  .or { display:flex; align-items:center; gap:10px; margin:14px 0 4px; color:var(--dim); font-size:12px; } .or::before, .or::after { content:""; flex:1; height:1px; background:var(--line); }
  .code { display:block; margin:14px 0; padding:14px; border-radius:10px; border:1px dashed var(--line2); background:var(--panel); font:700 19px/1 ui-monospace,Menlo,Consolas,monospace; letter-spacing:.1em; text-align:center; user-select:all; }

  /* kelimeler */
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat { padding:11px 12px; border-radius:10px; background:var(--panel); border:1px solid var(--line); }
  .stat b { display:block; font:800 23px/1 var(--display); letter-spacing:.01em; font-variant-numeric:tabular-nums; } .stat span { display:block; margin-top:5px; font-size:11.5px; color:var(--dim); }
  .stat.hot b { color:var(--sun); }
  .wl { list-style:none; margin:10px 0 0; padding:0; }
  .wl li { display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line); }
  .wl .w { flex:1; min-width:0; } .wl .w b { display:block; font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wl .w span { display:block; color:var(--sun); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wl .k { flex:none; width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--dim); display:grid; place-items:center; } .wl .k:hover { color:var(--ink); border-color:var(--line2); } .wl .k svg { width:16px; height:16px; }
  .wl .tc { flex:none; width:38px; font:400 11.5px ui-monospace,Menlo,Consolas,monospace; color:var(--dim); }
  .wl .k.on { color:var(--sun); border-color:var(--sun-line); font-size:16px; }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:10px; padding:4px; border-radius:10px; background:var(--panel); border:1px solid var(--line); }
  .seg button { height:32px; border:0; border-radius:6px; background:none; color:var(--dim); font-weight:600; font-size:13px; } .seg button[aria-pressed="true"] { background:var(--panel2); color:var(--ink); }
  .empty { margin:26px 8px; text-align:center; color:var(--dim); }
  /* yerel tekrar */
  .lp-lab { font:500 11px ui-monospace,Menlo,Consolas,monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  .lp-num { margin:4px 0 2px; font:800 56px/1 var(--display); letter-spacing:.01em; color:var(--sun); font-variant-numeric:tabular-nums; }
  .lp-line { margin:4px 0 14px; color:var(--dim); font-size:13px; }
  .lw { display:inline-block; margin:4px 8px 4px 0; padding:.06em .32em; border-radius:.25em; background:var(--sun); color:var(--on); font:800 24px/1.2 var(--display); overflow-wrap:anywhere; }
  .fb-center { margin:34px 0 8px; text-align:center; }
  .fb-center .lp-line { margin:10px 0 0; }
  .lw.lw-xl { font-size:40px; margin:12px 0 0; padding:.06em .3em; animation:pop .5s cubic-bezier(.2,1.4,.4,1) both; }
  .fb-center { position:relative; }
  .fb-center::before { content:""; position:absolute; left:50%; top:62px; width:110px; height:110px; margin:-55px 0 0 -55px; border-radius:50%; border:2px solid var(--sun); opacity:0; animation:ring .9s ease-out .12s; pointer-events:none; }
  .dots { display:flex; justify-content:center; gap:7px; margin:14px 0 0; } .dots i { width:9px; height:9px; border-radius:50%; background:var(--sun); animation:pop .4s cubic-bezier(.2,1.4,.4,1) both; } .dots i:nth-child(2) { animation-delay:.12s; } .dots i:nth-child(3) { animation-delay:.24s; }
  @keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  @keyframes ring { from { transform:scale(.4); opacity:.9; } to { transform:scale(2); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .lw.lw-xl, .fb-center::before, .dots i { animation:none; } }
  .fb-ok { margin:18px 0 4px; text-align:center; color:var(--mint); font-weight:700; }
  .fb-is { margin:10px 0; text-align:center; font:800 30px/1.15 var(--display); color:var(--sun); overflow-wrap:anywhere; }
  .src { margin:10px 0 16px; text-align:center; font:400 12px ui-monospace,Menlo,Consolas,monospace; color:var(--dim); overflow-wrap:anywhere; }
  .stack { display:flex; gap:3px; height:10px; margin:12px 0 4px; } .stack i { display:block; border-radius:99px; min-width:8px; }
  .stack .l { background:var(--sun); } .stack .m { background:#92741D; } .stack .n { background:var(--panel2); box-shadow:inset 0 0 0 1px var(--line2); }
  .upnext { margin:2px 0 16px; } .upnext .lp-lab { display:block; margin-bottom:6px; }
  .lw.lw-sm { font-size:15px; margin:3px 6px 3px 0; padding:.1em .4em; }
  .fb-no { margin:18px 0 4px; text-align:center; color:var(--bad); font-weight:700; }
  .lp-c { text-align:center; margin-top:18px; }
  .cl { margin:12px 0 8px; font:600 19px/1.6 var(--text); text-align:center; overflow-wrap:anywhere; }
  .cl-gap { display:inline-block; min-width:4.4em; margin:0 .1em; border-bottom:2px solid var(--sun); text-align:center; }
  .cl-gap.on { min-width:0; padding:0 .3em; border-bottom:0; background:var(--sun); color:var(--on); border-radius:.25em; font-weight:800; }
  .cl-tr { margin:0 0 6px; text-align:center; color:var(--dim); font-size:13px; } .cl-tr.mono { font:500 12.5px ui-monospace,Menlo,Consolas,monospace; margin-bottom:14px; }
  .cl-tr.big-tr { font-size:15px; color:var(--ink); margin:10px 0 4px; }
  .ord-ans { display:flex; flex-wrap:wrap; align-content:flex-start; gap:6px; min-height:96px; margin:12px 0; padding:10px; border-radius:10px; border:1px dashed var(--line2); }
  .ord-pool { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:12px 0 14px; }
  .tk { padding:8px 11px; border-radius:10px; border:1px solid var(--line2); background:var(--panel); font:600 15px var(--text); }
  .tk:hover { background:var(--panel2); } .tk.used { visibility:hidden; } .ord-ans .tk { background:var(--panel2); }
  .sec { display:flex; align-items:baseline; justify-content:space-between; margin:6px 2px 2px; }
  .sec b { font:700 15px/1.2 var(--display); letter-spacing:.01em; }
  .sec span { font:400 11.5px ui-monospace,Menlo,Consolas,monospace; color:var(--dim); }

  /* pratik */
  .go { position:relative; overflow:hidden; padding:16px; border-radius:10px; background:var(--panel); border:1px solid var(--line); }
  .go p { margin:4px 0 14px; color:var(--dim); font-size:13px; }
  .opt2 { display:flex; align-items:center; gap:12px; width:100%; margin-top:10px; padding:12px 14px; border-radius:10px; background:var(--panel); border:1px solid var(--line); text-align:left; }
  .opt2:hover { border-color:var(--line2); background:var(--panel2); } .opt2 svg { flex:none; width:22px; height:22px; color:var(--ember); }
  .opt2 b { display:block; font-weight:600; } .opt2 span { display:block; font-size:12.5px; color:var(--dim); }
  .bar { height:8px; border-radius:99px; background:var(--panel2); overflow:hidden; } .bar i { display:block; height:100%; border-radius:99px; background:var(--sun); transition:width .3s; }
  .qw { margin:22px 0 4px; text-align:center; font:800 34px/1.1 var(--display); letter-spacing:.01em; overflow-wrap:anywhere; }
  .qh { text-align:center; color:var(--dim); font-size:12.5px; margin-bottom:16px; }
  .ans { display:block; width:100%; margin-top:8px; padding:12px 14px; border-radius:10px; border:1px solid var(--line2); background:var(--panel); font-weight:600; font-size:15px; text-align:left; }
  .ans:hover { background:var(--panel2); } .ans.ok { background:#1F3A2B; border-color:var(--mint); color:var(--mint); } .ans.no { background:#3A1F26; border-color:var(--bad); color:var(--bad); }
  .ans[disabled] { cursor:default; } .ans.fade { opacity:.45; }
  .xp { position:absolute; right:22px; top:92px; font:800 18px var(--display); color:var(--sun); animation:xp .9s ease-out forwards; pointer-events:none; }
  @keyframes xp { from { opacity:0; transform:translateY(8px); } 25% { opacity:1; } to { opacity:0; transform:translateY(-26px); } }
  .big { margin:26px 0 2px; text-align:center; font:800 56px/1 var(--display); letter-spacing:.01em; color:var(--sun); } .bigs { text-align:center; color:var(--dim); margin-bottom:20px; }

  /* ben */
  .me { display:flex; align-items:center; gap:13px; } .me .av { width:54px; height:54px; font-size:24px; line-height:54px; }
  .me b { display:block; font:800 20px/1.1 var(--display); letter-spacing:.01em; overflow:hidden; text-overflow:ellipsis; } .me span { color:var(--dim); font-size:13px; }

  /* alt sekmeler */
  nav { flex:none; display:grid; grid-template-columns:repeat(4,1fr); padding:6px 8px 8px; border-top:1px solid var(--line); background:var(--deep); }
  nav button { display:grid; justify-items:center; gap:3px; padding:7px 2px 5px; border:0; border-radius:6px; background:none; color:var(--dim); font-size:11.5px; font-weight:600; }
  nav button svg { width:22px; height:22px; } nav button:hover { color:var(--ink); }
  nav button[aria-selected="true"] { color:var(--sun); }
  .wl .w .nt { display:block; width:100%; margin-top:3px; padding:0; border:0; background:none; text-align:left; font-size:12.5px; color:var(--ink); white-space:normal; overflow-wrap:anywhere; } .wl .w .nt.blank { color:var(--dim); } .wl .w button.nt:hover { color:var(--sun); }
  .nt-in { height:30px; margin-top:4px; font-size:13px; }
  /* kelime eşleştirme oyunu */
  .mg-hud { display:grid; grid-template-columns:1fr 1fr 1fr 32px; gap:6px; align-items:center; margin:4px 0 8px; }
  .mg-hud div { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:5px 6px; text-align:center; }
  .mg-hud small { display:block; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--dim); } .mg-hud b { font:800 20px/1.1 var(--display); font-variant-numeric:tabular-nums; }
  .mg-hud #mgCombo { color:var(--sun); }
  .mg-hud .x { width:32px; height:32px; border-radius:6px; border:1px solid var(--line2); background:transparent; color:var(--dim); font-size:18px; line-height:1; } .mg-hud .x:hover { color:var(--ink); }
  .mg-board { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; height:316px; margin-top:8px; padding:6px; background:var(--deep); border:1px solid var(--line); border-radius:10px; }
  .mg-col { display:flex; flex-direction:column; justify-content:flex-end; gap:5px; min-width:0; }
  .mg-tile { flex:0 0 calc((100% - 15px) / 4); display:grid; place-items:center; padding:2px 3px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:600 13px/1.15 var(--text); text-align:center; overflow-wrap:anywhere; }
  .mg-tile.mg-w { background:var(--panel2); font:800 16px/1.1 var(--display); letter-spacing:.01em; } .mg-tile.long { font-size:11.5px; } .mg-tile.mg-w.long { font-size:13px; }
  .mg-tile:hover { border-color:var(--line2); } .mg-tile.sel { background:var(--sun); border-color:var(--sun); color:var(--on); }
  .mg-tile.drop { animation:mgdrop .26s ease-out; } .mg-tile.bad { animation:mgbad .3s; border-color:var(--bad); }
  @keyframes mgdrop { from { transform:translateY(-130%); opacity:.2; } to { transform:none; opacity:1; } }
  @keyframes mgbad { 25% { transform:translateX(-4px); } 75% { transform:translateX(4px); } }
  .mg-miss { display:flex; flex-wrap:wrap; justify-content:space-between; gap:3px 10px; padding:6px 0; border-top:1px solid var(--line); font-size:13.5px; } .mg-miss span { color:var(--dim); }
  /* kelimenin notu: yerel pratikte cevaptan sonra ve eşleştirme sonucunda (.pn öneki; .src gibi genel sınıflarla çakışmaz) */
  .pn { margin:6px 8px 14px; text-align:center; font-size:12.5px; line-height:1.4; color:var(--dim); overflow-wrap:anywhere; }
  .pn-l { display:block; margin-bottom:2px; font:500 10.5px ui-monospace,Menlo,Consolas,monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  .pn-t { color:var(--ink); font-size:13px; }
  .mg-miss .pn { flex-basis:100%; margin:0; text-align:start; } .mg-miss .pn-l { display:inline; margin:0 7px 0 0; } .mg-miss .pn-t { color:var(--ink); font-size:12.5px; }
  .toast { position:absolute; left:16px; right:16px; bottom:10px; z-index:6; display:flex; align-items:center; gap:10px; padding:10px 12px 10px 14px; border-radius:10px; background:var(--panel2); border:1px solid var(--line2); box-shadow:0 8px 24px rgba(0,0,0,.45); font-size:13px; }
  .toast span { flex:1; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; animation:none !important; } }
