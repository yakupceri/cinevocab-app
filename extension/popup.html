<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<style>
  body { width: 330px; margin: 0; padding: 20px; color: #f1ead9; font: 14px "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(130% 70% at 90% -10%, rgba(255,122,69,.35), transparent 60%), #0c0b0a; }
  h1 { margin: 0 0 14px; font: 800 24px Georgia, serif; letter-spacing: -.02em; } h1 b { color: #ff7a45; }
  label { display: block; margin: 12px 0 5px; color: #a39b8d; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input, select, button { width: 100%; box-sizing: border-box; padding: 11px 14px; font: inherit; color: inherit; background: rgba(255,255,255,.06); border: 1px solid rgba(239,230,214,.14); border-radius: 12px; }
  select option { color: #111; }
  button { margin-top: 10px; cursor: pointer; border-radius: 999px; transition: transform .15s; } button:hover { transform: translateY(-1px); }
  #save { background: linear-gradient(135deg, #ffc766, #ff7a45); color: #1a0d08; border: 0; font-weight: 800; margin-top: 14px; }
  :focus-visible { outline: 2px solid #ff7a45; outline-offset: 2px; }
  #st { color: #7be0a6; min-height: 18px; margin: 10px 0 0; }
</style></head>
<body>
  <h1>Cine<b>Vocab</b></h1>
  <div class="two"><div><label for="src">Altyazı dili</label><select id="src"><option value="tr">Türkçe</option><option value="en">English</option><option value="fr">Français</option><option value="it">Italiano</option><option value="de">Deutsch</option><option value="es">Español</option><option value="pt">Português</option><option value="ru">Русский</option><option value="ar">العربية</option></select></div>
  <div><label for="dst">Çeviri dili</label><select id="dst"><option value="tr">Türkçe</option><option value="en">English</option><option value="fr">Français</option><option value="it">Italiano</option><option value="de">Deutsch</option><option value="es">Español</option><option value="pt">Português</option><option value="ru">Русский</option><option value="ar">العربية</option></select></div></div>
  <label for="key">Eklenti anahtarı</label>
  <input id="key" placeholder="Panelinden al, buraya yapıştır">
  <button id="save">Kaydet</button>
  <button id="open">Panelimi aç</button>
  <p id="st"></p>
  <script src="popup.js"></script>
</body></html>
