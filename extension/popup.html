<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family:"CV Display"; font-weight:800; src:url(fonts/d800.woff) format("woff"); }
  @font-face { font-family:"CV Display"; font-weight:700; src:url(fonts/d700.woff) format("woff"); }
  @font-face { font-family:"CV Text"; font-weight:500; src:url(fonts/t500.woff) format("woff"); }
  @font-face { font-family:"CV Text"; font-weight:600 700; src:url(fonts/t600.woff) format("woff"); }
  :root { color-scheme:dark;
    --night:#06141a; --deep:#0a242c; --panel:#0f2a31; --panel2:#143740; --line:rgba(246,239,223,.12); --line2:rgba(246,239,223,.22);
    --ink:#f6efdf; --dim:#9fb3ae; --ember:#ff8a3d; --sun:#ffc56b; --on:#2a1204; --mint:#7ee0a8; --bad:#ff8f80;
    --display:"CV Display","CV Text",system-ui,"Segoe UI",sans-serif; --text:"CV Text",system-ui,"Segoe UI",Roboto,sans-serif; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { width:380px; height:584px; display:flex; flex-direction:column; overflow:hidden; background:var(--night); color:var(--ink); font:500 14px/1.45 var(--text); -webkit-font-smoothing:antialiased; }
  button, select, input { font:inherit; color:inherit; }
  button { cursor:pointer; }
  [hidden] { display:none !important; }
  :focus-visible { outline:2px solid var(--sun); outline-offset:2px; }

  /* üst çubuk */
  .top { flex:none; display:flex; align-items:center; gap:9px; padding:14px 16px 10px; }
  .top img { width:28px; height:28px; display:block; }
  .top b { flex:1; font:800 19px/1 var(--display); letter-spacing:-.02em; }
  .pill { display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 11px; border-radius:99px; border:1px solid var(--line); background:var(--panel); font-weight:600; font-size:13px; }
  .pill svg { width:14px; height:14px; color:var(--ember); }
  button.pill { border-color:var(--ember); color:var(--sun); background:transparent; }
  .pill.lg { position:relative; margin:0; padding:0 10px; color:var(--ink); font-size:12.5px; letter-spacing:.02em; cursor:pointer; } .pill.lg svg { color:var(--dim); } .pill.lg:hover { border-color:var(--line2); }
  .pill.lg select { position:absolute; inset:0; width:100%; height:100%; padding:0; border:0; opacity:0; cursor:pointer; }
  .pill.lg:focus-within { outline:2px solid var(--sun); outline-offset:2px; }
  .av { width:30px; height:30px; border-radius:50%; border:0; padding:0; background:linear-gradient(180deg,var(--sun),var(--ember)); color:var(--on); font:800 14px/30px var(--display); text-align:center; overflow:hidden; flex:none; }
  .av img { width:100%; height:100%; object-fit:cover; display:block; }

  /* görünümler */
  main { flex:1; min-height:0; position:relative; }
  .view { position:absolute; inset:0; overflow-y:auto; padding:4px 16px 16px; scrollbar-width:thin; scrollbar-color:var(--panel2) transparent; }

  /* sahne: güneş düğmesi */
  .scene { position:relative; display:block; width:100%; height:176px; padding:0; border:0; border-radius:22px; overflow:hidden; background:linear-gradient(180deg,#0b2228 0%,#081a20 60%,var(--night) 100%); text-align:center; isolation:isolate; }
  .scene .sky { position:absolute; inset:0; background:linear-gradient(180deg,#1b5a5c 0%,#123f45 40%,#0a242c 78%); opacity:0; transition:opacity .7s; }
  .scene .glow { position:absolute; left:50%; top:58px; width:260px; height:260px; margin:-130px 0 0 -130px; border-radius:50%; background:radial-gradient(closest-side,rgba(255,138,61,.5),rgba(255,138,61,.16) 55%,transparent); opacity:0; transition:opacity .7s; }
  .scene .sun { position:absolute; left:50%; top:20px; width:76px; height:76px; margin-left:-38px; border-radius:50%; background:linear-gradient(180deg,var(--sun),#ff7a2e); transform:translateY(50px); filter:saturate(.4) brightness(.6); transition:transform .7s cubic-bezier(.2,.9,.25,1.1), filter .7s; }
  .scene .hill { position:absolute; left:-12%; right:-12%; bottom:-62px; height:150px; border-radius:50%; background:#04101a; }
  .scene .lab { position:absolute; left:0; right:0; bottom:13px; z-index:1; }
  .scene .lab b { display:block; font:800 21px/1.15 var(--display); letter-spacing:-.02em; }
  .scene .lab span { display:block; margin-top:3px; font-size:12.5px; color:var(--dim); }
  .scene[aria-checked="true"] .sky, .scene[aria-checked="true"] .glow { opacity:1; }
  .scene[aria-checked="true"] .sun { transform:none; filter:none; }
  .scene:hover .sun { filter:saturate(.6) brightness(.75); } .scene[aria-checked="true"]:hover .sun { filter:brightness(1.06); }
  .scene:active .sun { scale:.96; }

  .note { margin:10px 2px 0; font-size:12.5px; color:var(--dim); } .note:empty { display:none; }
  .note.bad { color:var(--bad); } .note.ok { color:var(--mint); }
  .note button { margin-top:7px; }

  .card { margin-top:10px; padding:13px 14px; border-radius:16px; background:var(--panel); border:1px solid var(--line); }
  .lang { display:grid; grid-template-columns:1fr 36px 1fr; gap:8px; align-items:end; }
  label, .lbl { display:block; margin-bottom:5px; font-size:12px; color:var(--dim); }
  select, input[type=text], input[type=password], input[type=search] { width:100%; height:40px; padding:0 12px; border-radius:11px; border:1px solid var(--line2); background:var(--night); outline-offset:0; }
  select { appearance:none; padding-right:28px; background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%); background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  input::placeholder { color:#6f8782; }
  .swap { width:36px; height:40px; border-radius:11px; border:1px solid var(--line); background:transparent; display:grid; place-items:center; color:var(--dim); }
  .swap:hover { color:var(--ink); border-color:var(--line2); } .swap svg { width:16px; height:16px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:42px; padding:9px 14px; border-radius:12px; border:1px solid var(--line2); background:transparent; font-weight:600; text-align:center; }
  .btn:hover { background:var(--panel2); }
  .btn.p { border-color:transparent; background:linear-gradient(180deg,var(--sun),var(--ember)); color:var(--on); font-weight:700; } .btn.p:hover { filter:brightness(1.07); background:linear-gradient(180deg,var(--sun),var(--ember)); }
  .btn.sm { width:auto; min-height:34px; padding:6px 12px; font-size:13px; border-radius:10px; }
  .btn[disabled] { opacity:.55; cursor:default; }
  .link { display:block; width:100%; margin-top:10px; padding:4px; border:0; background:none; color:var(--dim); font-size:13px; text-align:center; } .link:hover { color:var(--ink); }
  .row { display:flex; align-items:center; gap:10px; } .row > .grow { flex:1; min-width:0; }
  .tip { display:flex; gap:10px; align-items:flex-start; font-size:12.5px; color:var(--dim); } .tip svg { flex:none; width:18px; height:18px; margin-top:1px; color:var(--ember); }
  .toggle { position:relative; flex:none; width:42px; height:24px; border-radius:99px; border:0; padding:0; background:var(--panel2); transition:background .15s; }
  .toggle::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:var(--ink); transition:transform .15s; }
  .toggle[aria-checked="true"] { background:var(--mint); } .toggle[aria-checked="true"]::after { transform:translateX(18px); background:#04101a; }
  .sep { height:1px; margin:12px 0; background:var(--line); }

  /* giriş */
  #auth { z-index:5; background:var(--night); padding-top:6px; }
  h1 { margin:8px 0 6px; font:800 25px/1.12 var(--display); letter-spacing:-.025em; }
  h2 { margin:0; font:700 16px/1.25 var(--display); letter-spacing:-.01em; }
  .sub { margin:0 0 16px; color:var(--dim); }
  .field { margin-top:10px; position:relative; }
  .field .eye { position:absolute; right:4px; top:4px; width:32px; height:32px; border:0; border-radius:8px; background:none; color:var(--dim); display:grid; place-items:center; } .field .eye svg { width:17px; height:17px; }
  .or { display:flex; align-items:center; gap:10px; margin:14px 0 4px; color:var(--dim); font-size:12px; } .or::before, .or::after { content:""; flex:1; height:1px; background:var(--line); }
  .code { display:block; margin:14px 0; padding:14px; border-radius:12px; border:1px dashed var(--line2); background:var(--panel); font:700 19px/1 ui-monospace,Menlo,Consolas,monospace; letter-spacing:.1em; text-align:center; user-select:all; }

  /* kelimeler */
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat { padding:11px 12px; border-radius:14px; background:var(--panel); border:1px solid var(--line); }
  .stat b { display:block; font:800 23px/1 var(--display); letter-spacing:-.02em; font-variant-numeric:tabular-nums; } .stat span { display:block; margin-top:5px; font-size:11.5px; color:var(--dim); }
  .stat.hot b { color:var(--sun); }
  .wl { list-style:none; margin:10px 0 0; padding:0; }
  .wl li { display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line); }
  .wl .w { flex:1; min-width:0; } .wl .w b { display:block; font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wl .w span { display:block; color:var(--mint); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wl .k { flex:none; width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--dim); display:grid; place-items:center; } .wl .k:hover { color:var(--mint); border-color:var(--mint); } .wl .k svg { width:16px; height:16px; }
  .wl .k.on { color:var(--sun); border-color:rgba(255,197,107,.5); font-size:16px; }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:10px; padding:4px; border-radius:13px; background:var(--panel); border:1px solid var(--line); }
  .seg button { height:32px; border:0; border-radius:9px; background:none; color:var(--dim); font-weight:600; font-size:13px; } .seg button[aria-pressed="true"] { background:var(--panel2); color:var(--ink); }
  .empty { margin:26px 8px; text-align:center; color:var(--dim); }

  /* pratik */
  .go { position:relative; overflow:hidden; padding:16px; border-radius:18px; background:linear-gradient(160deg,#17494b,#0f2a31 70%); border:1px solid var(--line); }
  .go p { margin:4px 0 14px; color:var(--dim); font-size:13px; }
  .go::after { content:""; position:absolute; right:-34px; top:-34px; width:120px; height:120px; border-radius:50%; background:radial-gradient(closest-side,rgba(255,138,61,.55),transparent); pointer-events:none; }
  .opt2 { display:flex; align-items:center; gap:12px; width:100%; margin-top:10px; padding:12px 14px; border-radius:16px; background:var(--panel); border:1px solid var(--line); text-align:left; }
  .opt2:hover { border-color:var(--line2); background:var(--panel2); } .opt2 svg { flex:none; width:22px; height:22px; color:var(--ember); }
  .opt2 b { display:block; font-weight:600; } .opt2 span { display:block; font-size:12.5px; color:var(--dim); }
  .bar { height:8px; border-radius:99px; background:var(--panel2); overflow:hidden; } .bar i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--ember),var(--sun)); transition:width .3s; }
  .qw { margin:22px 0 4px; text-align:center; font:800 34px/1.1 var(--display); letter-spacing:-.03em; overflow-wrap:anywhere; }
  .qh { text-align:center; color:var(--dim); font-size:12.5px; margin-bottom:16px; }
  .ans { display:block; width:100%; margin-top:8px; padding:12px 14px; border-radius:13px; border:1px solid var(--line2); background:var(--panel); font-weight:600; font-size:15px; text-align:left; }
  .ans:hover { background:var(--panel2); } .ans.ok { background:rgba(126,224,168,.16); border-color:var(--mint); color:var(--mint); } .ans.no { background:rgba(255,143,128,.12); border-color:var(--bad); color:var(--bad); }
  .ans[disabled] { cursor:default; } .ans.fade { opacity:.45; }
  .xp { position:absolute; right:22px; top:92px; font:800 18px var(--display); color:var(--sun); animation:xp .9s ease-out forwards; pointer-events:none; }
  @keyframes xp { from { opacity:0; transform:translateY(8px); } 25% { opacity:1; } to { opacity:0; transform:translateY(-26px); } }
  .big { margin:26px 0 2px; text-align:center; font:800 56px/1 var(--display); letter-spacing:-.04em; color:var(--sun); } .bigs { text-align:center; color:var(--dim); margin-bottom:20px; }

  /* ben */
  .me { display:flex; align-items:center; gap:13px; } .me .av { width:54px; height:54px; font-size:24px; line-height:54px; }
  .me b { display:block; font:800 20px/1.1 var(--display); letter-spacing:-.02em; overflow:hidden; text-overflow:ellipsis; } .me span { color:var(--dim); font-size:13px; }

  /* alt sekmeler */
  nav { flex:none; display:grid; grid-template-columns:repeat(4,1fr); padding:6px 8px 8px; border-top:1px solid var(--line); background:var(--deep); }
  nav button { display:grid; justify-items:center; gap:3px; padding:7px 2px 5px; border:0; border-radius:12px; background:none; color:var(--dim); font-size:11.5px; font-weight:600; }
  nav button svg { width:22px; height:22px; } nav button:hover { color:var(--ink); }
  nav button[aria-selected="true"] { color:var(--sun); }
  .toast { position:absolute; left:16px; right:16px; bottom:10px; z-index:6; display:flex; align-items:center; gap:10px; padding:10px 12px 10px 14px; border-radius:13px; background:var(--panel2); border:1px solid var(--line2); box-shadow:0 8px 24px rgba(0,0,0,.45); font-size:13px; }
  .toast span { flex:1; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style></head>
<body>
  <header class="top">
    <img src="icons/icon128.png" alt=""><b>CineVocab</b>
    <label class="pill lg" id="lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.200 3 14.800 0 18M12 3c-3 3.200-3 14.800 0 18"/></svg><span id="lgCode"></span><select id="lgSel"></select></label>
    <span class="pill" id="streak" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2s1 3-2 6-5 5-5 9a6 6 0 0 0 12 0c0-3-2-5-2-5s-1 2-2 2c0-4 1-7-1-12z"/></svg><span id="streakN"></span></span>
    <button class="pill" id="signin" hidden></button>
    <button class="av" id="avatar" hidden></button>
  </header>

  <main>
    <!-- İzle -->
    <section class="view" id="v-watch">
      <button class="scene" id="sw" role="switch" aria-checked="false">
        <span class="sky"></span><span class="glow"></span><span class="sun"></span><span class="hill"></span>
        <span class="lab"><b id="state"></b><span id="hint"></span></span>
      </button>
      <p class="note" id="site" hidden></p>
      <p class="note" id="det"></p>

      <div class="card" id="siteCard" hidden>
        <button class="btn p" id="siteEnable"></button>
        <p class="note" id="siteEnableNote"></p>
      </div>

      <div class="card" id="ytCard" hidden>
        <b id="ytT"></b>
        <p class="note" id="ytS"></p>
        <div class="row" style="margin:10px 0"><span class="grow" id="lYtN"></span><select id="ytN"><option value="25">25</option><option value="50" selected>50</option><option value="100">100</option></select></div>
        <button class="btn p" id="ytGo"></button>
        <p class="note" id="ytMsg"></p>
      </div>

      <div class="card">
        <div class="lang">
          <div><label for="src" id="lSrc"></label><select id="src"></select></div>
          <button class="swap" id="swap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13l-3-3M17 17H4l3 3"/></svg></button>
          <div><label for="dst" id="lDst"></label><select id="dst"></select></div>
        </div>
      </div>

      <div class="card">
        <div class="tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span id="boxHint"></span></div>
        <div class="sep"></div>
        <div class="row"><span class="grow" id="lHide"></span><button class="toggle" id="hide" role="switch" aria-checked="true" aria-labelledby="lHide"></button></div>
        <div class="row" style="margin-top:12px"><span class="grow" id="lReset" style="color:var(--dim);font-size:12.5px"></span><button class="btn sm" id="boxReset"></button></div>
      </div>
    </section>

    <section class="view" id="v-words" hidden></section>
    <section class="view" id="v-practice" hidden></section>
    <section class="view" id="v-me" hidden></section>
    <section class="view" id="auth" hidden></section>
    <div class="toast" id="toast" hidden><span id="toastT"></span><button class="btn sm" id="toastB" hidden></button></div>
  </main>

  <nav id="tabs" role="tablist">
    <button role="tab" data-tab="watch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M10 8.5v4l3.5-2zM8 21h8"/></svg><span></span></button>
    <button role="tab" data-tab="words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="13" height="16" rx="2.5"/><path d="M8 8h5M8 12h5M20 7v12a2 2 0 0 1-2 2H8"/></svg><span></span></button>
    <button role="tab" data-tab="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 5 14h6l-1 8 8-12h-6z"/></svg><span></span></button>
    <button role="tab" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.500 2 8 6"/></svg><span></span></button>
  </nav>

  <script src="lang.js"></script>
  <script src="popup-i18n.js"></script>
  <script src="popup.js"></script>
</body></html>
