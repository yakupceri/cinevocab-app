  /* Gece Seansı: zemin sıcak siyah, tek vurgu altyazı sarısı */
  :root { color-scheme:dark light; --bg:#170E12; --panel:#25161C; --line:#3D3035; --ink:#F3E9D2; --dim:#AC9C92; --acc:#FFD21E; --fill:#FFD21E; --on-fill:#170E12;
    --display:"Big Shoulders","Arial Narrow","Instrument Sans",system-ui,sans-serif; --text:"Instrument Sans",system-ui,"Segoe UI",sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace; }
  @media (prefers-color-scheme: light) { :root { --bg:#F1E8D6; --panel:#FBF6EA; --line:#CBC1B3; --ink:#1B0F14; --dim:#66564C; --acc:#8E1B2B; } } /* sarı açık zeminde yalnız dolgu; yazı vurgusu bordo */
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font:500 17px/1.55 var(--text); display:flex; justify-content:center; padding:48px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left)); }
  main { width:100%; max-width:600px; }
  .brand { display:flex; align-items:center; gap:10px; font:800 18px var(--display); letter-spacing:.01em; }
  .brand .mk { width:26px; height:30px; display:block; flex:none; } .mk .mc { fill:#F3E9D2; } .mk .mv { fill:#FFD21E; }
  @media (prefers-color-scheme: light) { .mk .mc { fill:#1B0F14; } .mk .mv { fill:#8E1B2B; } }
  h1 { font:800 44px/1.04 var(--display); letter-spacing:.01em; margin:30px 0 12px; text-wrap:balance; }
  .sub { color:var(--dim); margin:0 0 26px; max-width:46ch; }
  ol { list-style:none; margin:0 0 26px; padding:0; }
  li { display:grid; grid-template-columns:52px 1fr; gap:10px; padding:11px 0; border-top:1px solid var(--line); }
  li:last-child { border-bottom:1px solid var(--line); }
  li .tc { font:500 13px var(--mono); color:var(--acc); padding-top:3px; }
  .pair { display:grid; grid-template-columns:1fr 40px 1fr; gap:10px; align-items:end; margin-bottom:16px; }
  label { display:block; margin-bottom:6px; font:500 11px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  select { width:100%; height:44px; padding:0 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:600 16px var(--text); }
  .swap { width:40px; height:44px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--dim); cursor:pointer; display:grid; place-items:center; }
  .swap:hover { color:var(--ink); } .swap svg { width:18px; height:18px; }
  .go { display:block; width:100%; min-height:52px; padding:12px 18px; border:0; border-radius:6px; background:var(--fill); color:var(--on-fill); font:800 18px var(--display); cursor:pointer; }
  .go:hover { filter:brightness(1.06); }
  :focus-visible { outline:2px solid var(--acc); outline-offset:3px; }
  .fine { margin:18px 0 0; font-size:13.5px; line-height:1.5; color:var(--dim); max-width:62ch; }
  .fine a { color:inherit; text-underline-offset:3px; }
  @media (max-width:560px) { h1 { font-size:34px; } .pair { grid-template-columns:1fr; } .swap { width:100%; height:36px; } }
</style></head>
