<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineVocab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/i18n.js"></script>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="/"><i></i>CineVocab</a>
  <div id="pairbox" class="pairsel"></div>
  <div class="grow"></div>
  <div id="tools" class="row" style="gap:6px"></div>
</div></header>
<main class="wrap" id="app"></main>
<script src="/static/common.js"></script>
<script src="/static/fx.js"></script>
<script>
const app = document.getElementById("app");
let me = null, pairs = [], PAIR = loadPair(), V = { words: [], known: [] }, VIDS = [];
let tab = "words", Q = "", EP = "", SHOW = 240, LBP = "all", LBS = "people";
const SELW = new Set(), SELV = new Set(), SELK = new Set();

function loadPair() {
  try { const [s, d] = (localStorage.getItem("cv-pair") || "").split(":"); if (s && d && s !== d) return { src: s, dst: d }; } catch (e) {}
  return { src: "tr", dst: "en" };
}
function setPair(src, dst) {
  if (src === dst) dst = PAIR_LANGS.find((l) => l !== src);
  PAIR = { src, dst };
  try { localStorage.setItem("cv-pair", src + ":" + dst); } catch (e) {}
  EP = ""; Q = ""; SHOW = 240; clearSel();
  reload();
}
function clearSel() { SELW.clear(); SELV.clear(); SELK.clear(); }
const pairKey = () => PAIR.src + ">" + PAIR.dst;

/* ---------- giriş ---------- */
let authMode = "login", PENDING_REC = null;
function pwField(ph, ac) {
  const wrap = el("div", "pw"), inp = el("input"), tg = el("button", "", t("show"));
  inp.type = "password"; inp.placeholder = ph; inp.autocomplete = ac; tg.type = "button";
  tg.onclick = () => { const h = inp.type === "password"; inp.type = h ? "text" : "password"; tg.textContent = h ? t("hide") : t("show"); };
  wrap.append(inp, tg);
  return { wrap, inp };
}
function strengthOf(p) {
  if (!p) return 0;
  let s = p.length >= 6 ? 1 : 0;
  if (p.length >= 10 && /[A-Za-z]/.test(p) && /\d/.test(p)) s = 2;
  if (p.length >= 12 && ((/[a-z]/.test(p) && /[A-Z]/.test(p)) || /[^A-Za-z0-9]/.test(p)) && /\d/.test(p)) s = 3;
  return Math.max(1, s);
}
function meterFor(inp) {
  const box = el("div"), m = el("div", "meter"), lab = el("div", "hint");
  m.append(el("i"), el("i"), el("i")); box.append(m, lab);
  const upd = () => { const l = strengthOf(inp.value); m.dataset.l = l; lab.textContent = l ? [t("pwWeak"), t("pwOk"), t("pwStrong")][l - 1] : ""; };
  inp.addEventListener("input", upd); upd();
  return box;
}
function recoveryBox(code) {
  const b = el("div", "rec", code), cp = el("button", "", t("copy"));
  cp.onclick = () => { navigator.clipboard.writeText(code).then(() => toast(t("copied"))); };
  return { box: b, copy: cp };
}
function recoveryView(code) {
  PENDING_REC = code;
  const card = el("div", "card"), { box, copy } = recoveryBox(code), go = el("button", "primary", t("recSaved")), row = el("div", "row");
  go.onclick = () => { PENDING_REC = null; boot(); };
  row.append(copy, go);
  card.append(el("h1", "", t("recTitle")), el("p", "dim", t("recSub")), box, row);
  card.firstChild.style.marginBottom = "10px";
  const w = el("div", "auth"); w.append(card); app.replaceChildren(w);
}
function authView() {
  document.getElementById("pairbox").replaceChildren();
  document.querySelectorAll(".tabbar,.bulk").forEach((n) => n.remove());
  if (PENDING_REC) return recoveryView(PENDING_REC);
  const card = el("div", "card"), err = el("p", "err"), form = el("div");
  form.style.cssText = "display:grid;gap:12px;margin-top:16px";
  const user = el("input"); user.placeholder = t("username"); user.autocomplete = "username"; user.maxLength = 16; user.setAttribute("aria-label", t("username"));
  const go = el("button", "primary");
  const guard = async (fn) => { go.disabled = true; err.textContent = ""; try { await fn(); } catch (e) { err.textContent = e.message; } finally { go.disabled = false; } };

  if (authMode === "forgot") {
    const code = el("input"), np = pwField(t("newPassword"), "new-password"), np2 = pwField(t("password2"), "new-password");
    code.placeholder = "XXXX-XXXX-XXXX"; code.autocomplete = "off"; code.spellcheck = false; code.style.cssText = "letter-spacing:.1em;font-family:ui-monospace,Menlo,monospace";
    go.textContent = t("resetPassword");
    go.onclick = () => guard(async () => {
      if (np.inp.value !== np2.inp.value) throw new Error(t("pwMismatch"));
      const r = await api("/api/forgot", { username: user.value.trim(), recovery: code.value.trim(), password: np.inp.value });
      recoveryView(r.recovery);
    });
    const back = el("button", "link", t("backToLogin")); back.onclick = () => { authMode = "login"; authView(); };
    form.append(user, code, np.wrap, meterFor(np.inp), np2.wrap, go, err, back);
    card.append(el("h1", "", t("forgotTitle")), el("p", "dim", t("forgotSub")), form);
    [user, code, np.inp, np2.inp].forEach((i) => (i.onkeydown = (e) => { if (e.key === "Enter") go.click(); }));
  } else {
    const seg = el("div", "seg"), bl = el("button", authMode === "login" ? "on" : "", t("login")), br = el("button", authMode === "register" ? "on" : "", t("register"));
    bl.onclick = () => { authMode = "login"; authView(); }; br.onclick = () => { authMode = "register"; authView(); };
    seg.append(bl, br); seg.style.marginTop = "18px";
    const pw = pwField(authMode === "login" ? t("password") : t("pwHint"), authMode === "login" ? "current-password" : "new-password");
    if (authMode === "login") {
      go.textContent = t("login");
      go.onclick = () => guard(async () => { await api("/api/login", { username: user.value.trim(), password: pw.inp.value }); await boot(); });
      const fg = el("button", "link", t("forgot")); fg.onclick = () => { authMode = "forgot"; authView(); }; fg.style.justifySelf = "start";
      form.append(user, pw.wrap, go, err, fg);
      card.append(el("h1", "", t("authTitle")), el("p", "dim", t("authSub")), seg, form);
      [user, pw.inp].forEach((i) => (i.onkeydown = (e) => { if (e.key === "Enter") go.click(); }));
    } else {
      const pw2 = pwField(t("password2"), "new-password"), uh = el("p", "hint", t("userHint"));
      go.textContent = t("createAccount");
      go.onclick = () => guard(async () => {
        if (pw.inp.value !== pw2.inp.value) throw new Error(t("pwMismatch"));
        const r = await api("/api/register", { username: user.value.trim(), password: pw.inp.value });
        recoveryView(r.recovery);
      });
      const ub = el("div"); ub.append(user, uh);
      form.append(ub, pw.wrap, meterFor(pw.inp), pw2.wrap, go, err);
      card.append(el("h1", "", t("regTitle")), el("p", "dim", t("regSub")), seg, form);
      [user, pw.inp, pw2.inp].forEach((i) => (i.onkeydown = (e) => { if (e.key === "Enter") go.click(); }));
    }
  }
  const demo = el("div", "subs"), ws = el("div", "ws");
  [["Je", "I"], ["ne", ""], ["sais", "know"], ["pas", "not"], ["pourquoi", "why"]].forEach(([a, b], i) => {
    const sp = el("span", i === 1 ? "k" : ""); sp.append(el("b", "", a), el("small", "", b)); ws.append(sp);
  });
  demo.append(ws); demo.style.marginTop = "22px";
  const cap = el("p", "dim small", t("authDemo")); cap.style.cssText = "text-align:center;margin-top:10px";
  const wrap = el("div", "auth"); wrap.append(card, demo, cap);
  app.replaceChildren(wrap);
}

/* ---------- ana akış ---------- */
async function boot() {
  try { me = await api("/api/me"); } catch (e) { me = null; return authView(); }
  loadG(); await syncG();
  try { pairs = await api("/api/pairs"); } catch (e) { pairs = []; }
  let saved = false; try { saved = !!localStorage.getItem("cv-pair"); } catch (e) {}
  if (!saved && pairs.length) PAIR = { src: pairs[0].src, dst: pairs[0].dst };
  await reload();
}
async function reload() {
  const qs = "?src=" + PAIR.src + "&dst=" + PAIR.dst;
  try { [V, VIDS] = await Promise.all([api("/api/vocab" + qs), api("/api/videos" + qs)]); }
  catch (e) { if (e.status === 401) return authView(); toast(e.message); V = { words: [], known: [] }; VIDS = []; }
  try { pairs = await api("/api/pairs"); } catch (e) {}
  render();
}

function renderPair() {
  const box = document.getElementById("pairbox"); box.className = "pairsel";
  const sel = el("select"), list = pairs.slice();
  if (!list.some((p) => p.src === PAIR.src && p.dst === PAIR.dst)) list.unshift({ src: PAIR.src, dst: PAIR.dst, count: 0 });
  list.forEach((p) => sel.append(new Option(langName(p.src) + " → " + langName(p.dst) + " · " + p.count, p.src + ">" + p.dst)));
  sel.append(new Option("＋ " + t("newPair"), "+"));
  sel.value = pairKey(); sel.setAttribute("aria-label", t("listLabel"));
  sel.onchange = () => { if (sel.value === "+") { sel.value = pairKey(); newPairModal(); } else { const [a, b] = sel.value.split(">"); setPair(a, b); } };
  const help = el("div", "help"), hb = el("button", "icon", "?");
  hb.setAttribute("aria-label", t("listHelp"));
  hb.onclick = (e) => { e.stopPropagation(); const old = help.querySelector(".pop"); if (old) return old.remove(); help.append(el("div", "pop", t("listHelp"))); };
  help.append(hb);
  box.replaceChildren(el("span", "", t("listLabel")), sel, help);
}
document.addEventListener("click", () => document.querySelectorAll(".pop").forEach((p) => p.remove()));
function newPairModal() {
  const m = el("div", "modal"), c = el("div", "card"), a = el("select"), b = el("select"), go = el("button", "primary", t("open")), no = el("button", "", t("cancel"));
  PAIR_LANGS.forEach((l) => { a.append(new Option(langName(l), l)); b.append(new Option(langName(l), l)); });
  a.value = PAIR.src; b.value = PAIR.dst === PAIR.src ? "en" : PAIR.dst;
  const f = (l, x) => { const w = el("label", "f"); w.append(el("span", "", l), x); return w; };
  go.onclick = () => { if (a.value === b.value) return toast(t("ePair")); m.remove(); setPair(a.value, b.value); };
  no.onclick = () => m.remove(); m.onclick = (e) => { if (e.target === m) m.remove(); };
  const r = el("div", "row"); r.append(go, no);
  const h = el("h2", "", t("newPairTitle")); h.style.marginBottom = "6px";
  c.append(h, el("p", "dim", t("newPairSub")), f(t("learning"), a), f(t("translateTo"), b), r);
  c.children[1].style.marginBottom = "14px"; m.append(c); document.body.append(m);
}

const TABS = [["words", "words"], ["videos", "videos"], ["known", "known"], ["practice", "practice"], ["duel", "duel"], ["settings", "settings"]];
const uniqWords = () => { const m = new Map(); V.words.forEach((w) => { if (!m.has(w.tr)) m.set(w.tr, w); }); return [...m.values()]; };
const counts = () => ({ words: uniqWords().length, videos: VIDS.length, known: V.known.length });

function render() {
  document.querySelectorAll(".tabbar,.bulk").forEach((n) => n.remove());
  mountTools(document.getElementById("tools"));
  mountGameChip();
  renderPair();
  const c = counts(), nav = el("nav", "nav"), bar = el("nav", "tabbar");
  TABS.forEach(([k, ic]) => {
    const mkb = (cls) => { const b = el("button", tab === k ? "on" : ""); b.append(svg(ICONS[ic]), el("span", "", t("nav_" + k))); if (cls && c[k] !== undefined) b.append(el("span", "n", c[k])); b.onclick = () => { tab = k; render(); window.scrollTo(0, 0); }; return b; };
    nav.append(mkb(true)); bar.append(mkb(false));
  });
  const main = el("div");
  main.append({ words: tWords, videos: tVideos, known: tKnown, practice: tPractice, duel: tDuel, settings: tSettings }[tab]());
  const lay = el("div", "layout"); lay.append(nav, main);
  app.replaceChildren(lay);
  document.body.append(bar);
}

function head(title, sub, extra) {
  const h = el("div", "head"), l = el("div"); l.append(el("h1", "", title)); if (sub) l.append(el("p", "", sub));
  h.append(l); if (extra) h.append(extra); return h;
}
function bulkBar(set, buttons) {
  document.querySelectorAll(".bulk").forEach((n) => n.remove());
  if (!set.size) return;
  const b = el("div", "bulk"); b.append(el("b", "", t("selected", set.size)));
  buttons.forEach(([label, cls, fn]) => { const x = el("button", cls, label); x.onclick = fn; b.append(x); });
  const cl = el("button", "ghost", t("clear")); cl.onclick = () => { set.clear(); render(); }; b.append(cl);
  document.body.append(b);
}
function empty(title, text, extra) { const e = el("div", "empty"); e.append(el("b", "", title), el("span", "", text)); if (extra) e.append(extra); return e; }
function otherPairs() {
  const list = pairs.filter((p) => p.src + ">" + p.dst !== pairKey());
  if (!list.length) return null;
  const r = el("div", "row"); r.style.cssText = "justify-content:center;margin-top:16px";
  list.forEach((p) => { const b = el("button", "", langName(p.src) + " → " + langName(p.dst) + " · " + p.count); b.onclick = () => setPair(p.src, p.dst); r.append(b); });
  return r;
}

/* ---------- Kelimeler ---------- */
function tWords() {
  const box = el("div"), c = counts();
  box.append(head(t("nav_words"), t("wordsSub", c.words, langName(PAIR.src))));
  const st = el("div", "stats");
  [[c.words, t("statWords")], [c.videos, t("statVideos")], [c.known, t("statKnown")], [me.wins || 0, t("statWins")]].forEach(([n, l]) => {
    const s = el("div", "stat"); s.append(el("b", "", n), el("span", "", l)); st.append(s); });
  box.append(st);
  if (!V.words.length) { box.append(empty(t("emptyWords"), t("emptyWordsText", langName(PAIR.src), langName(PAIR.dst)), otherPairs())); return box; }

  const q = el("input"), ep = el("select"), all = el("button", "", t("selectShown"));
  q.type = "search"; q.placeholder = t("search"); q.value = Q;
  ep.append(new Option(t("allVideos"), ""));
  VIDS.forEach((v) => ep.append(new Option((v.episode || t("noVideo")) + " · " + v.count, v.episode || "\u0000")));
  if (EP.startsWith("series:")) ep.append(new Option(EP.slice(7), EP));
  ep.value = EP;
  const grid = el("div", "words"), more = el("button", "");
  const rows = () => {
    const ql = Q.trim().toLowerCase(), seen = new Set(), out = [];
    V.words.forEach((w) => {
      if (EP.startsWith("series:") ? (platOf(w.episode || "") !== "pv" || seriesOf(w.episode) !== EP.slice(7)) : (EP !== "" && (w.episode || "\u0000") !== EP)) return;
      if (ql && !w.tr.toLowerCase().includes(ql) && !w.eng.toLowerCase().includes(ql)) return;
      if (seen.has(w.tr)) return; seen.add(w.tr); out.push(w);
    });
    return out;
  };
  const paint = () => {
    const list = rows(); grid.replaceChildren();
    list.slice(0, SHOW).forEach((w) => {
      const b = el("button", "w" + (SELW.has(w.tr) ? " sel" : ""));
      b.setAttribute("aria-pressed", SELW.has(w.tr));
      b.append(el("span", "src", w.tr), el("span", "dst", w.eng), el("span", "ep", w.episode || t("noVideo")), el("span", "ck"));
      b.onclick = () => { SELW.has(w.tr) ? SELW.delete(w.tr) : SELW.add(w.tr); b.classList.toggle("sel"); b.setAttribute("aria-pressed", SELW.has(w.tr)); wbar(); };
      grid.append(b);
    });
    if (!list.length) grid.replaceChildren(empty(t("noMatch"), ""));
    more.className = list.length > SHOW ? "" : "hide"; more.textContent = t("showMore", list.length - SHOW);
    all.onclick = () => { list.slice(0, SHOW).forEach((w) => SELW.add(w.tr)); paint(); wbar(); };
  };
  const wbar = () => bulkBar(SELW, [
    [t("iKnow"), "primary", async () => { const ws = [...SELW]; await api("/api/known", { src: PAIR.src, words: ws, known: true }); toast(t("markedKnown", ws.length)); SELW.clear(); reload(); }],
    [t("del"), "danger", async () => { const ws = [...SELW]; if (!(await ask(t("confirmDelWords", ws.length), t("confirmDelWordsText")))) return;
      const r = await api("/api/delete-words", { src: PAIR.src, dst: PAIR.dst, words: ws }); toast(t("deleted", r.deleted)); SELW.clear(); reload(); }],
  ]);
  q.oninput = () => { Q = q.value; SHOW = 240; paint(); };
  ep.onchange = () => { EP = ep.value; SHOW = 240; paint(); };
  more.onclick = () => { SHOW += 240; paint(); };
  const bar = el("div", "row"); q.style.cssText = "flex:1 1 200px"; ep.style.cssText = "flex:0 1 260px;width:auto"; bar.append(q, ep, all);
  bar.style.marginBottom = "14px";
  box.append(bar, grid, more); more.style.cssText = "display:block;margin:16px auto 0";
  paint(); wbar();
  return box;
}

/* ---------- Videolar ---------- */
let PLAT = "all";
const PNAME = { pv: "Prime Video", yt: "YouTube", ud: "Udemy", ot: "" };
const platOf = (ep) => (!ep ? "ot" : /^YouTube\s*·/.test(ep) ? "yt" : /^Udemy\s*·/.test(ep) ? "ud" : "pv");
const cleanTitle = (ep) => ep.replace(/^(YouTube|Udemy)\s*·\s*/, "");
const seriesOf = (ep) => (ep.replace(/\s*S\d+\s*E\d+\s*$/i, "").replace(/\s*\((?:\d+\.\s*)?(?:Sezon|Season)[^)]*\)\s*$/i, "").trim() || ep);
const hueOf = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
function videoItems() {
  const items = [], series = new Map();
  VIDS.forEach((v) => {
    const ep = v.episode || "", p = platOf(ep);
    if (p === "pv") {
      const name = seriesOf(ep);
      let it = series.get(name);
      if (!it) { it = { key: "s:" + name, plat: "pv", title: name, series: name, eps: [], count: 0, last: "", thumb: "" }; series.set(name, it); items.push(it); }
      it.eps.push(v); it.count += v.count; if (v.last > it.last) it.last = v.last; if (!it.thumb && v.thumb) it.thumb = v.thumb;
    } else items.push({ key: "v:" + ep, plat: p, title: ep ? cleanTitle(ep) : t("noVideo"), eps: [v], count: v.count, last: v.last, thumb: v.thumb || "" });
  });
  return items.sort((a, b) => (a.last < b.last ? 1 : -1));
}
function loadPoster(name, img) {
  let key = "cv-poster:" + name, c = null;
  try { c = localStorage.getItem(key); } catch (e) {}
  const set = (u) => { if (u && u !== "-") { img.src = u; } };
  if (c !== null) return set(c);
  fetch("https://api.tvmaze.com/singlesearch/shows?q=" + encodeURIComponent(name.replace(/\s*\(.*?\)\s*/g, " ").trim()))
    .then((r) => (r.ok ? r.json() : null)).then((d) => {
      const u = d && d.image ? (d.image.medium || "").replace("http://", "https://") : "";
      try { localStorage.setItem(key, u || "-"); } catch (e) {} set(u);
    }).catch(() => {});
}
function tVideos() {
  const box = el("div");
  box.append(head(t("nav_videos"), t("videosSub")));
  if (!VIDS.length) { box.append(empty(t("emptyVideos"), t("emptyVideosText"), otherPairs())); return box; }
  const items = videoItems(), cnt = { all: items.length };
  items.forEach((i) => (cnt[i.plat] = (cnt[i.plat] || 0) + 1));
  if (PLAT !== "all" && !cnt[PLAT]) PLAT = "all";
  const bar = el("div", "plats");
  [["all", t("allPlatforms")], ["pv", "Prime Video"], ["yt", "YouTube"], ["ud", "Udemy"], ["ot", t("noVideo")]].forEach(([k, l]) => {
    if (k !== "all" && !cnt[k]) return;
    const b = el("button", PLAT === k ? "on" : "", l); b.append(el("span", "n", cnt[k])); b.onclick = () => { PLAT = k; render(); }; bar.append(b);
  });
  const shown = items.filter((i) => PLAT === "all" || i.plat === PLAT);
  const all = el("button", "", t("selectAll")); all.onclick = () => { shown.forEach((i) => i.eps.forEach((v) => SELV.add(v.episode || ""))); render(); };
  const top = el("div", "row"); all.style.marginLeft = "auto"; top.append(bar, all); top.style.cssText = "margin-bottom:6px;align-items:flex-start";
  bar.style.marginBottom = "0";
  const note = el("p", "dim small", t("autoNote")); note.style.marginBottom = "14px";
  const grid = el("div", "vgrid");
  const vbar = () => bulkBar(SELV, [[t("del"), "danger", async () => {
    const eps = [...SELV]; if (!(await ask(t("confirmDelVideos", eps.length), t("confirmDelVideosText")))) return;
    const r = await api("/api/delete-videos", { src: PAIR.src, dst: PAIR.dst, episodes: eps }); toast(t("deleted", r.deleted)); SELV.clear(); reload(); }]]);
  shown.forEach((it) => {
    const keys = it.eps.map((v) => v.episode || ""), picked = () => keys.every((k) => SELV.has(k));
    const card = el("div", "vc" + (picked() ? " sel" : "")), th = el("div", "th"), bd = el("div", "bd");
    th.style.setProperty("--h", hueOf(it.title));
    th.append(el("span", "ph", (it.title || "?").trim().charAt(0).toUpperCase()));
    let img = null;
    if (it.thumb || it.plat === "pv") {
      img = el("img"); img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer"; img.style.opacity = "0"; img.onload = () => (img.style.opacity = "1"); img.onerror = () => img.remove();
      if (it.thumb) img.src = it.thumb; else loadPoster(it.series, img);
      th.append(img);
    }
    if (PNAME[it.plat]) th.append(el("span", "plat", PNAME[it.plat]));
    const cb = el("input", "chk pick"); cb.type = "checkbox"; cb.checked = picked(); cb.setAttribute("aria-label", it.title);
    cb.onchange = () => { keys.forEach((k) => (cb.checked ? SELV.add(k) : SELV.delete(k))); card.classList.toggle("sel", cb.checked); vbar(); };
    th.append(cb);

function runQuiz(area, intro, qs, mode) {
  intro.classList.add("hide");
  const SPEED = 8;
  let i = 0, score = 0, combo = 0, bestCombo = 0, lives = 3, correct = 0, answered = 0, cur = null, advance = null, tmo = [];
  const wrongs = [], engs = [...new Set(V.words.map((x) => x.eng))];
  const clearT = () => { tmo.forEach(clearTimeout); tmo = []; };
  const onKey = (e) => {
    if (!cur || !document.body.contains(cur.card)) { document.removeEventListener("keydown", onKey); return; }
    if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && !cur.locked) cur.btns[n - 1] && cur.btns[n - 1].click();
    else if ((e.key === "Enter" || e.key === " ") && cur.locked && advance) { e.preventDefault(); advance(); }
  };
  document.addEventListener("keydown", onKey);

  function step() {
    if (i >= qs.length) return end("done");
    const { w, opts } = qs[i], card = el("div", "card qcard in"), hud = el("div", "hud");
    const hearts = el("div", "hearts"), comboEl = el("span", "combo"), scEl = el("span", "sc", String(score)), snd = el("button", "ghost icon-sm");
    comboEl.append(svg(ICO.flame), el("span", "", ""));
    const paintCombo = () => { comboEl.lastChild.textContent = combo >= 2 ? t("combo", combo) : "×" + Math.max(combo, 1); comboEl.className = "combo" + (combo >= 3 ? " hot" : "") + (combo >= 6 ? " fire" : ""); };
    const paintHearts = () => { hearts.replaceChildren(...[0, 1, 2].map((k) => { const h = svg(ICO.heart); if (k >= lives) h.classList.add("lost"); return h; })); };
    const paintSnd = () => { snd.replaceChildren(svg(FX.isMuted() ? ICO.mute : ICO.sound)); snd.setAttribute("aria-label", t("sound")); };
    snd.onclick = () => { FX.setMuted(!FX.isMuted()); paintSnd(); }; paintSnd(); paintCombo(); paintHearts();
    if (mode === "survival") hud.append(hearts);
    hud.append(comboEl, el("span", "dim small", t("qOf", i + 1, qs.length)), scEl, snd);
    const bar = el("div", mode === "speed" ? "tbar" : "bar"), fill = el("i"); bar.append(fill);
    if (mode !== "speed") fill.style.width = (i / qs.length * 100) + "%";
    const og = el("div", "opts"), btns = [];
    opts.forEach((o, k) => {
      const b = el("button"); b.append(el("span", "k", k + 1), el("span", "", o));
      b.onclick = () => answer(b, o); og.append(b); btns.push(b);
    });
    card.append(hud, bar, el("div", "qword", w.tr), og);
    area.replaceChildren(card);
    cur = { card, btns, locked: false };
    const t0 = performance.now();

    if (mode === "speed") {
      fill.style.transition = "none"; fill.style.transform = "scaleX(1)";
      requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.transition = "transform " + SPEED + "s linear"; fill.style.transform = "scaleX(0)"; }));
      tmo.push(setTimeout(() => { bar.classList.add("low"); FX.play("tick"); }, (SPEED - 3) * 1000));
      tmo.push(setTimeout(() => FX.play("tick"), (SPEED - 2) * 1000), setTimeout(() => FX.play("tick"), (SPEED - 1) * 1000));
      tmo.push(setTimeout(() => answer(null, null), SPEED * 1000));
    }

    function answer(btn, choice) {
      if (cur.locked) return; cur.locked = true; clearT();
      const el_ = (performance.now() - t0) / 1000, ok = choice === w.eng; answered++;
      btns.forEach((x) => { if (x.lastChild.textContent === w.eng) x.classList.add("ok"); else if (x === btn) x.classList.add("no"); });
      fill.style.transition = "none";
      if (ok) {
        combo++; correct++; bestCombo = Math.max(bestCombo, combo);
        const lim = mode === "speed" ? SPEED : 10, bonus = Math.round(50 * Math.max(0, 1 - el_ / lim)), pts = 100 + bonus + Math.min(50, 10 * (combo - 1));
        score += pts; scEl.textContent = score; FX.bump(scEl);
        card.classList.add("ok"); FX.play("correct", combo); FX.vibrate(14); FX.float(btn, "+" + pts, combo >= 3 ? "hot" : "");
        if (combo > 0 && combo % 5 === 0) { FX.confetti(0.55); FX.play("combo"); }
      } else {
        combo = 0; wrongs.push(w); if (mode === "survival") lives--;
        card.classList.add("no"); FX.shake(card); FX.play("wrong"); FX.vibrate([50, 40, 50]);
        if (!btn) FX.float(card.querySelector(".qword"), t("timeUp"), "bad");
      }
      paintCombo(); FX.bump(comboEl); paintHearts();
      let done = false;
      advance = () => { if (done) return; done = true; advance = null; i++; if (mode === "survival" && lives <= 0) end("lives"); else step(); };
      tmo.push(setTimeout(() => advance && advance(), ok ? 800 : 1500));
    }
  }

  function end(reason) {
    clearT(); document.removeEventListener("keydown", onKey); cur = null;
    const pct = answered ? Math.round(correct / answered * 100) : 0;
    const xpGain = correct * 10 + bestCombo * 2 + (pct === 100 && answered >= 5 ? 20 : 0);
    const lvBefore = levelOf(G.xp), fracBefore = (G.xp % XP_LEVEL) / XP_LEVEL;
    G.xp += xpGain; const lvAfter = levelOf(G.xp), leveled = lvAfter > lvBefore, newBest = score > G.best;
    if (newBest) G.best = score; G.bestCombo = Math.max(G.bestCombo || 0, bestCombo);
    const td = todayStr(); if (G.day !== td) { G.day = td; G.n = 0; } G.n += answered;
    if (G.last !== td) { G.streak = G.last === yesterdayStr() ? G.streak + 1 : 1; G.last = td; }
    saveG(); mountGameChip();

    const card = el("div", "card result in"), stars = el("div", "stars"), big = el("div", "big", "0");
    const title = reason === "lives" ? t("outOfLives") : pct === 100 ? t("rPerfect") : pct >= 80 ? t("rGreat") : pct >= 50 ? t("rGood") : t("rKeep");
    const n = pct >= 90 ? 3 : pct >= 65 ? 2 : pct >= 35 ? 1 : 0;
    for (let k = 0; k < 3; k++) stars.append(svg(ICO.star));
    const info = el("div", "chips"); info.style.justifyContent = "center";
    info.append(chip(ICO.star, t("accuracyN", pct)), chip(ICO.flame, t("bestCombo", bestCombo), bestCombo >= 3 ? "fire" : ""), chip(null, t("result", correct, answered)));
    const xpb = el("div", "xpbar"), xpi = el("i"); xpb.append(xpi); xpi.style.width = (fracBefore * 100) + "%";
    const xpl = el("p", "dim small", t("xpGain", xpGain) + " · " + t("lvl", lvAfter));
    const banners = el("div");
    if (newBest) banners.append(el("span", "banner", t("newBest")));
    if (leveled) banners.append(el("span", "banner", t("levelUp", lvAfter)));
    const r = el("div", "row"); r.style.marginTop = "16px";
    if (wrongs.length) { const b = el("button", "primary", t("retryWrong", wrongs.length)); b.onclick = () => runQuiz(area, intro, shuf(wrongs).map((w) => mkQ(w, engs)), mode); r.append(b); }
    const again = el("button", wrongs.length ? "" : "primary", t("again")); again.onclick = () => { area.replaceChildren(); render(); }; r.append(again);
    card.append(el("h2", "", title), stars, big, el("p", "dim small", t("ptsN", "")), info, xpb, xpl, banners, r);
    if (wrongs.length) {
      const l = el("div", "list"); l.style.cssText = "margin-top:16px;text-align:left";
      wrongs.forEach((w) => { const li = el("div", "li"); li.append(el("span", "t", w.tr), el("span", "grow dim", w.eng)); l.append(li); });
      card.append(l);
    }
    area.replaceChildren(card);
    FX.count(big, score, 1000);
    requestAnimationFrame(() => requestAnimationFrame(() => { xpi.style.width = (leveled ? 100 : (G.xp % XP_LEVEL) / XP_LEVEL * 100) + "%"; }));
    [...stars.children].forEach((sv, k) => { if (k < n) setTimeout(() => { sv.classList.add("on"); FX.play("correct", k * 2 + 1); }, 500 + k * 380); });
    setTimeout(() => {
      if (leveled) { FX.play("level"); FX.confetti(1.2); } else if (pct >= 80) { FX.play("win"); FX.confetti(0.9); } else if (n === 0) FX.play("lose");
    }, 500 + n * 380);
  }
  step();
}

    rows.forEach((r, i) => {
      const li = el("li"), nm = el("span", "nm", LBS === "country" ? flag(r.country) + countryName(r.country) : flag(r.country) + r.username);
      if (LBS !== "country" && r.username === me.username) nm.append(el("span", "tag", t("you")));
      li.append(el("span", "rk", i + 1), nm, el("span", "dim small", LBS === "country" ? t("playersN", r.players) : t("winsN", r.wins)), el("b", "", r.score));
      ul.append(li);
    });
    list.replaceChildren(ul);
  }).catch(() => {});
  return card;
}

/* ---------- Ayarlar ---------- */
function askPassword(title) {
  return new Promise((res) => {
    const m = el("div", "modal"), c = el("div", "card"), pw = pwField(t("password"), "current-password"), ok = el("button", "primary", title), no = el("button", "", t("cancel")), r = el("div", "row"), err = el("p", "err");
    const done = (v) => { m.remove(); res(v); };
    ok.onclick = () => done(pw.inp.value); no.onclick = () => done(null); m.onclick = (e) => { if (e.target === m) done(null); };
    pw.inp.onkeydown = (e) => { if (e.key === "Enter") ok.click(); };
    r.append(ok, no); r.style.marginTop = "14px"; pw.wrap.style.marginTop = "14px";
    c.append(el("h2", "", title), pw.wrap, err, r); m.append(c); document.body.append(m); pw.inp.focus();
  });
}
function recoveryModal(code) {
  const m = el("div", "modal"), c = el("div", "card"), { box, copy } = recoveryBox(code), ok = el("button", "primary", t("recSaved")), r = el("div", "row");
  ok.onclick = () => m.remove(); r.append(copy, ok);
  const h = el("h2", "", t("recTitle")); h.style.marginBottom = "8px";
  c.append(h, el("p", "dim", t("recSub")), box, r); m.append(c); document.body.append(m);
}
function tSettings() {
  const box = el("div");
  box.append(head(t("nav_settings"), me.username));
  const g = el("div", "grid2"), f = (l, x) => { const w = el("label", "f"); w.append(el("span", "", l), x); return w; };
  // profil
  const p = el("div", "card"), name = el("input"), cc = el("select"), save = el("button", "primary", t("save")), err = el("p", "err");
  name.value = me.username; name.maxLength = 16;
  cc.append(new Option("—", ""));
  COUNTRY_CODES.map((c) => [c, countryName(c)]).sort((a, b) => a[1].localeCompare(b[1], I18N.lang)).forEach(([c, n]) => cc.append(new Option(flag(c) + n, c)));
  cc.value = me.country || "";
  save.onclick = async () => { try { await api("/api/settings", { username: name.value.trim(), country: cc.value, avatar: "" }); me = await api("/api/me"); toast(t("saved")); render(); } catch (e) { err.textContent = e.message; } };
  const h = el("h2", "", t("profile")); h.style.marginBottom = "14px";
  p.append(h, f(t("username"), name), f(t("country"), cc), save, err);
  // eklenti
  const x = el("div", "card"), key = el("code"), gen = el("button", "primary", t("genKey")), cp = el("button", "hide", t("copy"));
  key.style.cssText = "display:block;word-break:break-all;padding:10px;background:var(--bg2);border-radius:8px;margin:12px 0;font-size:13px";
  key.textContent = t("keyHint");
  gen.onclick = async () => { const k = (await api("/api/ext-key", {})).key; key.textContent = k; cp.classList.remove("hide"); cp.onclick = () => { navigator.clipboard.writeText(k).then(() => toast(t("copied"))); }; };
  const steps = el("ol", "dim small"); steps.style.cssText = "margin:14px 0 0;padding-left:18px;line-height:1.7";
  ["ext1", "ext2", "ext3"].forEach((k) => steps.append(el("li", "", t(k))));
  const r = el("div", "row"); r.append(gen, cp);
  x.append(el("h2", "", t("extension")), el("p", "dim", t("extSub")), key, r, steps);
  // hesap
  const a = el("div", "card"), out = el("button", "", t("logout")), del = el("button", "danger", t("deleteAccount"));
  out.onclick = async () => { await api("/api/logout", {}); me = null; authView(); };
  del.onclick = () => {
    const m = el("div", "modal"), c = el("div", "card"), pw = el("input"), e = el("p", "err"), ok = el("button", "danger", t("deleteAccount")), no = el("button", "", t("cancel"));
    pw.type = "password"; pw.placeholder = t("password");
    ok.onclick = async () => { try { await api("/api/delete-account", { password: pw.value }); m.remove(); me = null; toast(t("accountDeleted")); authView(); } catch (er) { e.textContent = er.message; } };
    no.onclick = () => m.remove(); const rr = el("div", "row"); rr.append(ok, no);
    pw.style.marginTop = "14px"; c.append(el("h2", "", t("deleteAccount")), el("p", "dim", t("deleteAccountSub")), pw, e, rr); m.append(c); document.body.append(m); pw.focus();
  };
  const rr = el("div", "row"); rr.style.marginTop = "14px"; rr.append(out, del);
  a.append(el("h2", "", t("account")), el("p", "dim", t("accountSub")), rr); a.style.marginTop = "16px";
  // güvenlik: parola değiştir + kurtarma kodu
  const sec = el("div", "card"), cur = pwField(t("currentPw"), "current-password"), n1 = pwField(t("newPassword"), "new-password"), n2 = pwField(t("password2"), "new-password");
  const sb = el("button", "primary", t("changePassword")), serr = el("p", "err"), sf = el("div"); sf.style.cssText = "display:grid;gap:10px;margin-top:14px";
  sb.onclick = async () => {
    serr.textContent = "";
    if (n1.inp.value !== n2.inp.value) { serr.textContent = t("pwMismatch"); return; }
    try { await api("/api/change-password", { current: cur.inp.value, password: n1.inp.value }); [cur, n1, n2].forEach((f) => (f.inp.value = "")); toast(t("pwChanged")); }
    catch (e) { serr.textContent = e.message; }
  };
  sf.append(cur.wrap, n1.wrap, meterFor(n1.inp), n2.wrap, sb, serr); sec.append(el("h2", "", t("security")), sf);
  const rc = el("div", "card"), rb = el("button", me.has_recovery ? "" : "primary", t("newRecovery")), rr2 = el("div"); rr2.style.marginTop = "14px";
  rb.onclick = async () => {
    const pw = await askPassword(t("newRecovery"));
    if (pw === null) return;
    try { const r = await api("/api/new-recovery", { password: pw }); me.has_recovery = true; recoveryModal(r.recovery); } catch (e) { toast(e.message); }
  };
  rr2.append(rb); rc.append(el("h2", "", t("recoveryCode")), el("p", "dim", me.has_recovery ? t("recoveryHas") : t("recoveryNone")), rr2); rc.firstChild.style.marginBottom = "8px";
  const g2 = el("div", "grid2"); g2.style.marginTop = "16px"; g2.append(sec, rc);
  g.append(p, x); box.append(g, g2, a);
  return box;
}

mountTools(document.getElementById("tools"));
boot();
