<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineVocab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0c0b0a; --ink:#efe6d6; --dim:#a39b8d; --line:rgba(239,230,214,.12); --soft:rgba(239,230,214,.045); --ember:#e8613c; --gold:#e9b44c; --ok:#86c79a; --bad:#c9503f;
          --serif:"Fraunces", Georgia, "Times New Roman", serif; --sans:"Manrope", "Avenir Next", "Helvetica Neue", "Segoe UI", sans-serif; }
  html[data-theme="light"] { --bg:#f6f1e7; --ink:#1d1a16; --dim:#6d655a; --line:rgba(29,26,22,.14); --soft:rgba(29,26,22,.05); }
  html[data-theme="light"] #bdo { background: linear-gradient(180deg, rgba(246,241,231,.5), var(--bg) 78%); }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--ink); font: 400 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; }
  #bd { position: fixed; inset: -60px; z-index: -2; filter: blur(34px) saturate(.85); opacity: .5; transition: background .6s; }
  #bdo { position: fixed; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(12,11,10,.35), var(--bg) 78%); }
  body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }
  main { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 22px 22px 70px; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 800; margin: 0; letter-spacing: -.01em; }
  .cap { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .dim { color: var(--dim); font-size: 14px; }
  button, input, a.btn { font: inherit; color: var(--ink); }
  button { cursor: pointer; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 10px 18px; font-weight: 600; transition: border-color .15s, background .15s, transform .15s; }
  button:hover:not(:disabled) { border-color: rgba(239,230,214,.45); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  .solid { background: var(--ember); border-color: var(--ember); color: #1a0d08; font-weight: 800; }
  .solid:hover:not(:disabled) { background: #f0734f; border-color: #f0734f; }
  .lnk { border: 0; padding: 4px 0; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgba(239,230,214,.3); }
  .track { height: 8px; border-radius: 4px; background: rgba(239,230,214,.12); overflow: hidden; } .track i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--ember), #f0884f); transition: width .6s; }
  .track.lg { height: 12px; border-radius: 6px; } .track.ok i { background: linear-gradient(90deg, #6fb98a, var(--ok)); }
  /* üst */
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .brand { font: 800 21px var(--serif); } .brand b { color: var(--ember); }
  .bar .who { display: flex; gap: 16px; align-items: center; color: var(--dim); font-size: 14px; font-weight: 600; } .bar button { padding: 6px 14px; font-size: 13px; }
  /* hero */
  .hero { position: relative; border-radius: 14px; overflow: hidden; min-height: 300px; display: flex; flex-direction: column; justify-content: flex-end; padding: 36px; border: 1px solid var(--line); }
  .hero::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, rgba(12,11,10,.9) 0%, rgba(12,11,10,.4) 70%, rgba(12,11,10,.12) 100%), linear-gradient(0deg, rgba(12,11,10,.85), transparent 55%); }
  .hero > * { position: relative; z-index: 2; }
  .hero > .hbg { position: absolute; inset: -20px; z-index: 0; filter: blur(16px) saturate(.9); }
  .hero > .pcard { position: absolute; right: 36px; bottom: 36px; width: 150px; aspect-ratio: 2 / 3; border-radius: 8px; border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(0,0,0,.5); }
  .hero h1 { font-size: 54px; line-height: 1.02; margin: 8px 0 10px; }
  .hero .next { font-size: 17px; font-weight: 500; margin-bottom: 14px; }
  .hero .track { max-width: 380px; margin-bottom: 4px; } .hero .pl { font-size: 13px; color: var(--dim); margin-bottom: 20px; }
  .hero .acts { display: flex; gap: 20px; align-items: center; } .hero .acts a { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgba(239,230,214,.3); }
  .hero .acts button { padding: 13px 26px; font-size: 16px; }
  /* özet kutuları */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 16px 0 20px; }
  .st { border: 1px solid var(--line); background: var(--soft); border-radius: 12px; padding: 16px 18px; }
  .st .v { font: 800 24px/1.15 var(--serif); margin: 6px 0 10px; } .st .s { font-size: 13px; color: var(--dim); margin-top: 8px; }
  /* dizi şeridi */
  .strip { display: flex; gap: 12px; overflow-x: auto; padding: 2px 0 22px; }
  .tile { flex: none; width: 96px; height: 134px; border-radius: 8px; border: 1px solid var(--line); position: relative; overflow: hidden; cursor: pointer; padding: 0; opacity: .55; transition: opacity .2s, transform .2s; }
  .tile:hover { opacity: .9; transform: translateY(-2px); } .tile.on { opacity: 1; border-color: var(--ember); }
  .tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.82), transparent 60%); }
  .tile span { position: absolute; left: 9px; right: 9px; bottom: 9px; z-index: 1; font: 800 13px/1.15 var(--serif); text-align: left; }
  /* gövde */
  .cols { display: grid; grid-template-columns: 1fr 300px; gap: 40px; align-items: start; }
  .tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
  .tabs button { border: 0; border-radius: 0; padding: 12px 0; color: var(--dim); border-bottom: 3px solid transparent; white-space: nowrap; font-size: 16px; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--ember); }
  .sh { font: 800 22px var(--serif); } .row { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row em { font-style: normal; color: var(--dim); } .row.m span:first-child { color: var(--ink); font-weight: 600; } .me { color: var(--ember); font-weight: 700; }
  .search { width: 100%; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 11px 14px; margin: 10px 0 4px; }
  .empty { padding: 40px 0; color: var(--dim); }
  /* bölümler listesi */
  .ep { display: grid; grid-template-columns: 1.1fr 1.6fr 52px 100px; gap: 18px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .ep .en { font: 800 18px var(--serif); } .ep .en small { display: block; font: 500 13px var(--sans); color: var(--dim); margin-top: 2px; } .ep .pc { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; } .ep .ac { text-align: right; }
  .badge { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ok); border: 1px solid rgba(134,199,154,.4); border-radius: 999px; padding: 2px 9px; margin-left: 8px; vertical-align: middle; }
  /* harita */
  .eppick { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 20px; }
  .eppick button { padding: 8px 16px; border-radius: 999px; font-size: 14px; } .eppick button.on { border-color: var(--ember); color: var(--ember); } .eppick button.fin::after { content: " ✓"; color: var(--ok); }
  .mhead { border: 1px solid var(--line); background: var(--soft); border-radius: 12px; padding: 20px 22px; margin-bottom: 8px; }
  .mhead h3 { font-size: 26px; } .mhead .l { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin: 14px 0 8px; } .mhead .rw { margin-top: 12px; font-size: 13px; color: var(--dim); }
  .banner { border: 1px solid rgba(134,199,154,.4); background: rgba(134,199,154,.08); border-radius: 12px; padding: 16px 20px; margin: 12px 0; } .banner b { font: 800 18px var(--serif); display: block; margin-bottom: 2px; }
  .path { position: relative; max-width: 420px; margin: 18px auto 30px; }
  .path svg { position: absolute; inset: 0; width: 100%; height: 100%; } .path svg path { vector-effect: non-scaling-stroke; }
  .node { position: absolute; transform: translate(-50%, -50%); width: 66px; height: 66px; border-radius: 50%; padding: 0; border: 0; display: grid; place-items: center; background: conic-gradient(var(--ember) var(--p), rgba(239,230,214,.16) 0); transition: transform .15s; }
  .node:hover:not(.lock) { transform: translate(-50%, -50%) scale(1.07); border: 0; }
  .node .in { width: 54px; height: 54px; border-radius: 50%; background: #15120f; display: grid; place-items: center; font: 800 21px var(--serif); }
  .node.done { background: conic-gradient(var(--ok) 100%, var(--ok) 0); } .node.done .in { background: var(--ok); color: #0f1a13; }
  .node.cur { animation: pulse 1.8s infinite; } .node.cur .in { color: var(--ember); }
  .node.lock { opacity: .4; cursor: not-allowed; } .node.lock .in { color: var(--dim); }
  .node.chest { border-radius: 16px; background: rgba(233,180,76,.35); } .node.chest .in { border-radius: 12px; color: var(--gold); background: #1c1710; }
  .node.chest.done { background: rgba(239,230,214,.16); } .node.chest.done .in { background: #1c1710; color: var(--dim); }
  .node.boss { width: 86px; height: 86px; background: conic-gradient(var(--gold) var(--p), rgba(239,230,214,.16) 0); } .node.boss .in { width: 72px; height: 72px; font-size: 32px; color: var(--gold); }
  .node.boss.done .in { background: var(--gold); color: #1c1305; } .node.boss.done { background: var(--gold); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(232,97,60,.5); } 70% { box-shadow: 0 0 0 16px rgba(232,97,60,0); } 100% { box-shadow: 0 0 0 0 rgba(232,97,60,0); } }
  .nl { position: absolute; transform: translateY(-50%); width: 120px; font-size: 13px; line-height: 1.35; color: var(--dim); } .nl b { display: block; color: var(--ink); font-size: 14px; }
  /* başarım */
  .ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; padding-top: 14px; }
  .a { border: 1px solid var(--line); border-radius: 12px; padding: 18px; opacity: .45; } .a.on { opacity: 1; border-color: rgba(232,97,60,.55); background: var(--soft); }
  .a i { font-style: normal; font-size: 26px; color: var(--ember); display: block; margin-bottom: 10px; } .a b { display: block; font: 800 16px var(--serif); margin-bottom: 3px; } .a span { font-size: 13px; color: var(--dim); }
  /* yan */
  .side section { padding: 0 0 28px; } .side .cap { margin-bottom: 12px; }
  .quest { padding: 10px 0; } .quest .t { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 600; margin-bottom: 8px; } .quest.ok .t { color: var(--dim); text-decoration: line-through; }
  .extc { border: 1px solid rgba(232,97,60,.45); border-radius: 12px; padding: 18px; background: linear-gradient(160deg, rgba(232,97,60,.14), transparent); }
  .extc h3 { font-size: 20px; margin-bottom: 8px; } .extc p { margin: 0 0 12px; font-size: 14px; color: rgba(239,230,214,.8); } .extc .big { font: 800 30px var(--serif); color: var(--ember); } .extc button { width: 100%; }
  .key { word-break: break-all; font-size: 12px; color: var(--ok); margin: 10px 0 0; }
  /* giriş */
  .auth { max-width: 360px; margin: 90px auto; } .auth h1 { font-size: 42px; margin-bottom: 6px; }
  .auth input { display: block; width: 100%; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 13px 14px; margin-top: 10px; }
  .auth button.solid { width: 100%; margin-top: 14px; padding: 13px; } .auth .tabs { margin: 20px 0 6px; } .err { color: var(--bad); min-height: 22px; margin: 10px 0 0; font-size: 14px; }
  /* quiz */
  .ov { position: fixed; inset: 0; background: rgba(8,7,6,.88); display: grid; place-items: center; padding: 16px; z-index: 9; backdrop-filter: blur(6px); }
  .q { width: min(520px, 100%); background: #14110f; border: 1px solid var(--line); border-radius: 16px; padding: 26px; }
  .qh { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; font-size: 14px; font-weight: 600; color: var(--dim); } .qh button { padding: 4px 12px; }
  .q .w { font: 800 40px var(--serif); text-align: center; margin: 30px 0 6px; word-break: break-word; } .q .hint { text-align: center; color: var(--dim); margin-bottom: 20px; }
  .opts { display: grid; gap: 9px; } .opts button { text-align: left; padding: 15px 16px; font-size: 17px; font-weight: 500; }
  .opts .okk { border-color: var(--ok); background: rgba(134,199,154,.12); } .opts .no { border-color: var(--bad); background: rgba(201,80,63,.14); }
  .combo { color: var(--ember); min-height: 22px; text-align: center; margin-top: 16px; font-weight: 700; }
  .res { text-align: center; } .res .big { font: 800 68px var(--serif); margin: 6px 0; } .res button { width: 100%; margin-top: 10px; padding: 13px; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #1b1714; border: 1px solid rgba(232,97,60,.5); padding: 12px 22px; border-radius: 999px; z-index: 20; max-width: 90vw; font-weight: 600; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; gap: 10px; } .stats { grid-template-columns: 1fr 1fr; } .hero { padding: 24px; min-height: 270px; } .hero h1 { font-size: 38px; } .hero > .pcard { display: none; }
    .ep { grid-template-columns: 1fr 52px 90px; } .ep .tr { display: none; } }
  @media (prefers-reduced-motion: reduce) { .node.cur { animation: none; } }
</style>
</head>
<body>
<div id="bd"></div><div id="bdo"></div>
<main id="app"></main>
<script>
const app = document.getElementById("app");
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || "Bir hata oluştu.");
  return d;
}
try { document.documentElement.dataset.theme = localStorage.getItem("cv-theme") || "dark"; } catch (e) {}
const COUNTRIES = "TR:Türkiye;DE:Almanya;GB:Birleşik Krallık;US:ABD;NL:Hollanda;FR:Fransa;AZ:Azerbaycan;RU:Rusya;UA:Ukrayna;KZ:Kazakistan;SA:Suudi Arabistan;AE:BAE;EG:Mısır;IQ:Irak;IR:İran;ES:İspanya;IT:İtalya;SE:İsveç;BE:Belçika;AT:Avusturya;CH:İsviçre;CA:Kanada;AU:Avustralya;BR:Brezilya;IN:Hindistan;PK:Pakistan;JP:Japonya;KR:Güney Kore;CN:Çin;ID:Endonezya;MX:Meksika;AR:Arjantin;PL:Polonya;GR:Yunanistan;BG:Bulgaristan;RO:Romanya".split(";").map((s) => s.split(":"));
const flag = (cc) => (cc && /^[A-Z]{2}$/.test(cc) ? String.fromCodePoint(...[...cc].map((c) => 127397 + c.charCodeAt(0))) + " " : "");
const cname = (cc) => (COUNTRIES.find((c) => c[0] === cc) || [cc, cc])[1];
function toggleTheme() { const t = document.documentElement.dataset.theme === "light" ? "dark" : "light"; document.documentElement.dataset.theme = t; try { localStorage.setItem("cv-theme", t); } catch (e) {} }
async function delEps(list, label) {
  const eps = [...new Set(list)];
  if (!confirm(label + " için " + eps.length + " kayıt grubundaki kelimeler listenden silinecek. Emin misin?")) return;
  try { const r = await api("/api/delete-episodes", { episodes: eps }); toast(r.deleted + " kelime silindi."); panelView(); } catch (e) { toast(e.message); }
}
function openSettings(me) {
  const ov = el("div"); ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:16px";
  const bx = el("div"); bx.style.cssText = "background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(380px,100%);display:grid;gap:10px";
  const name = el("input", "search"); name.value = me.username; name.maxLength = 16;
  const sel = el("select", "search"); sel.append(new Option("Ülke seç (isteğe bağlı)", ""));
  COUNTRIES.forEach(([c, n]) => sel.append(new Option(flag(c) + n, c))); sel.value = me.country || "";
  const file = el("input"); file.type = "file"; file.accept = "image/*"; let avatar = "";
  file.onchange = () => { const f = file.files[0]; if (!f) return; const img = new Image();
    img.onload = () => { const c = document.createElement("canvas"); c.width = c.height = 96; const s = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 96, 96); avatar = c.toDataURL("image/jpeg", 0.8); };
    img.src = URL.createObjectURL(f); };
  const save = el("button", "solid", "Kaydet"), cancel = el("button", "", "Kapat"), err = el("div", "dim", "");
  save.onclick = async () => { try { await api("/api/settings", { username: name.value.trim(), country: sel.value, avatar }); ov.remove(); panelView(); } catch (e) { err.textContent = e.message; } };
  cancel.onclick = () => ov.remove();
  bx.append(el("h3", "", "Ayarlar"), el("div", "dim", "Kullanıcı adı"), name, el("div", "dim", "Ülke"), sel, el("div", "dim", "Profil fotoğrafı"), file, err, save, cancel);
  ov.append(bx); document.body.append(ov);
}
function toast(msg) { const t = el("div", "toast", msg); document.body.append(t); setTimeout(() => t.remove(), 2800); }
const track = (p, cls) => { const t = el("div", "track " + (cls || "")), i = el("i"); i.style.width = Math.max(0, Math.min(100, p)) + "%"; t.append(i); return t; };
const shuf = (a) => [...a].sort(() => Math.random() - .5);

/* ---- dizi görselleri: static/posters/<dizi-adi>.jpg varsa o, yoksa TVmaze'den otomatik, yoksa renk geçişi ---- */
const slug = (s) => s.toLowerCase().replace(/ı/g, "i").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
function posterBg(show, custom) {
  const h = hue(show), clean = (u) => u.replace(/["')\\]/g, "");
  let layers = `url("/static/posters/${slug(show)}.jpg") center/cover`;
  if (custom) layers += `, url("${clean(custom)}") center/cover`;
  return layers + `, radial-gradient(120% 90% at 20% 0%, hsl(${h} 40% 30%), transparent 60%), linear-gradient(160deg, hsl(${(h + 30) % 360} 36% 17%), hsl(${h} 28% 7%))`;
}
let PO = {}; try { PO = JSON.parse(localStorage.cv_posters || "{}"); } catch (e) {}
const POPEN = {};
function loadPosters(names, redraw) {
  const todo = names.filter((n) => n !== "Kelimelerim" && !POPEN[n] && (!PO[n] || (!PO[n].u && Date.now() - PO[n].t > 6048e5)));
  if (!todo.length) return;
  todo.forEach((n) => (POPEN[n] = 1));
  Promise.all(todo.map((n) => fetch("https://api.tvmaze.com/singlesearch/shows?q=" + encodeURIComponent(n))
    .then((r) => (r.ok ? r.json() : null))
    .then((d) => { PO[n] = { u: (d && d.image && (d.image.original || d.image.medium)) || "", t: Date.now() }; })
    .catch(() => { delete POPEN[n]; })))
    .then(() => { try { localStorage.cv_posters = JSON.stringify(PO); } catch (e) {} if (todo.some((n) => PO[n] && PO[n].u)) redraw(); });
}

function authView() {
  document.getElementById("bd").style.background = posterBg("CineVocab");
  let mode = "login";
  const card = el("div", "auth"), tabs = el("div", "tabs");
  const tl = el("button", "on", "Giriş yap"), tr = el("button", "", "Kayıt ol");
  const user = el("input"); user.placeholder = "Kullanıcı adı"; user.autocomplete = "username"; user.maxLength = 16;
  const pass = el("input"); pass.type = "password"; pass.placeholder = "Parola (en az 6 karakter)";
  const err = el("p", "err"), go = el("button", "solid", "Giriş yap");
  const set = (m) => { mode = m; tl.className = m === "login" ? "on" : ""; tr.className = m === "login" ? "" : "on";
    go.textContent = m === "login" ? "Giriş yap" : "Hesap oluştur"; pass.autocomplete = m === "login" ? "current-password" : "new-password"; err.textContent = ""; };
  tl.onclick = () => set("login"); tr.onclick = () => set("register");
  go.onclick = async () => {
    try { await api(mode === "login" ? "/api/login" : "/api/register", { username: user.value, password: pass.value }); panelView(); }
    catch (e) { err.textContent = e.message; }
  };
  pass.onkeydown = (e) => { if (e.key === "Enter") go.click(); };
  tabs.append(tl, tr);
  card.append(el("h1", "", "CineVocab"), el("p", "dim", "Dizi izlerken kelime topla, bölüm bölüm öğren."), tabs, user, pass, err, go);
  app.replaceChildren(card);
}

/* ---------- ilerleme (tarayıcı + sunucu) ---------- */
const RANKS = ["Çaylak", "Meraklı", "Replik Avcısı", "Altyazı Ustası", "Sinefil", "Efsane"];
const lvlOf = (xp) => Math.floor(xp / 200) + 1;
const wkey = (w) => (w.episode || "") + "|" + w.tr;
const today = () => new Date().toLocaleDateString("sv");
let SRV = {}, saveT = null;
const loadP = (u) => { let l = {}; try { l = JSON.parse(localStorage["cv_" + u]) || {}; } catch (e) {} return (SRV && (SRV.upd || 0) > (l.upd || 0)) ? SRV : l; };

/* Eklenti bölümü "Lost - Season 1 S1 E16" gibi gönderir: dizi = "Lost", bölüm = "S1 E16". */
const PACK = 25;
const cleanShow = (s) => (s || "").replace(/[\s,.:\-–—]*S(?:eason|ezon)?\s*\d+\s*$/i, "").replace(/[\s,.:\-–—]+$/, "").trim();
const EP_RE = /^(.*?)[\s,.:\-]*S(\d+)\s*E(\d+)\s*$/i;
function splitEp(e) {
  const m = EP_RE.exec((e || "").trim());
  return m ? { show: cleanShow(m[1]) || "Kelimelerim", name: "S" + m[2] + " E" + m[3], order: (+m[2]) * 1000 + (+m[3]) } : null;
}
function buildBuckets(words) {
  const shows = new Map();
  words.forEach((w) => {
    const p = splitEp(w.episode);
    const show = p ? p.show : (cleanShow((w.episode || "").trim()) || "Kelimelerim");
    const name = p ? p.name : "Kelimeler", order = p ? p.order : 1e9;
    if (!shows.has(show)) shows.set(show, new Map());
    const m = shows.get(show);
    if (!m.has(name)) m.set(name, { order, words: [], poster: "" });
    const e = m.get(name); e.words.push(w); if (!e.poster) e.poster = w.poster || w.image || "";
  });
  const out = [];
  shows.forEach((eps, show) => {
    const list = [...eps.entries()].sort((a, b) => a[1].order - b[1].order || a[0].localeCompare(b[0], "tr", { numeric: true }));
    const poster = (list.find(([, e]) => e.poster) || [, {}])[1].poster || "";
    list.forEach(([name, e]) => {
      if (e.order === 1e9 && e.words.length > PACK) for (let i = 0; i < e.words.length; i += PACK) out.push({ show, poster, name: "Paket " + (i / PACK + 1), words: e.words.slice(i, i + PACK) });
      else out.push({ show, poster, name, words: e.words });
    });
  });
  return out;
}

/* ---------- harita: bölüm = basamaklar + sandıklar + bölüm sınavı ---------- */
const STAGE = 10, STAGE_XP = 20, CHEST_XP = 40, BOSS_XP = 100, BOSS_N = 20, BOSS_PASS = 80, CHEST_EVERY = 5;
const bkey = (b) => b.show + "|" + b.name;
function stagesOf(b, P) {
  const ws = b.words.slice().reverse(), out = []; // en eski kelime önce: yeni kelimeler sona basamak ekler
  for (let i = 0; i < ws.length; i += STAGE) {
    const w = ws.slice(i, i + STAGE), m = w.filter((x) => P.mastered[wkey(x)]).length;
    out.push({ i: out.length, words: w, m, pct: Math.round(m / w.length * 100), done: m === w.length });
  }
  return out;
}
function nextStep(mine, P) {
  for (const b of mine) {
    if (P.boss[bkey(b)]) continue;
    const st = stagesOf(b, P), idx = st.findIndex((s) => !s.done);
    return idx >= 0 ? { b, st, idx, kind: "stage" } : { b, st, kind: "boss" };
  }
  return null;
}

    api("/api/leaderboard?period=" + lbp + "&by=" + lbs).then((rows) => {
      if (!rows.length) lb.append(el("div", "empty", "Henüz oynanmış oyun yok."));
      rows.forEach((r, i) => { const row = el("div", "row" + (r.username === me.username ? " me" : ""));
        const medal = ["🥇", "🥈", "🥉"][i] || (i + 1) + ".";
        const nm = lbs === "country" ? flag(r.country) + cname(r.country) + " · " + r.players + " oyuncu" : flag(r.country) + r.username;
        row.append(el("span", "", medal + " " + nm), el("span", "", r.score + " puan · " + r.wins + " galibiyet")); lb.append(row); }); });
    body.append(sw, lb);
  }

  /* ---- yan: görevler + eklenti ---- */
  const side = el("div", "side"), s1 = el("section"), s2 = el("section");
  s1.append(el("div", "cap", "Günlük görevler"));
  QUESTS.forEach((q) => { const v = Math.min(q[1], q[2]), ok = v >= q[2], d = el("div", "quest" + (ok ? " ok" : "")), r = el("div", "t");
    r.append(el("span", "", q[0]), el("span", "dim", v + "/" + q[2] + " · +" + q[3])); d.append(r, track(v / q[2] * 100, ok ? "ok" : "")); s1.append(d); });
  const ec = el("div", "extc"), ext = el("button", "solid", "Eklenti anahtarı oluştur"), key = el("p", "key"); ext.id = "keybtn";
  ext.onclick = async () => { key.textContent = (await api("/api/ext-key", {})).key; };
  ec.append(el("div", "cap", "Eklenti"), el("h3", "", "Haritanı eklentiyle uzat"), el("div", "big", "+5 XP"),
    el("p", "", "İzlerken yakaladığın her yeni kelime haritaya basamak ekler. Daha çok izle, daha uzun harita, daha çok ödül."),
    el("p", "dim", "Bu cihazda eklentiyle yakalanan: " + P.capTotal + " kelime"), ext, key, el("p", "dim", "Anahtarı eklentinin penceresine yapıştır."));
  s2.append(ec); side.append(s1, s2);

  const cols = el("div", "cols"), main = el("div"); main.append(tabs, body); cols.append(main, side);
  const credit = el("div", "dim", "Dizi görselleri: TVmaze"); credit.style.cssText = "margin-top:40px;font-size:12px";
  app.replaceChildren(bar, hero, stats, strip, cols, credit);
}

/* ---------- tek kişilik oyun ---------- */
function play(me, words, list, P, save, opts = {}) {
  if (words.length < 2) return toast("Oynamak için en az 2 kelime lazım.");
  const ov = el("div", "ov"), q = el("div", "q"); ov.append(q); document.body.append(ov);
  const items = shuf(list), wrongs = [];
  let i = 0, ok = 0, combo = 0, xp = 0, locked = false;
  const close = () => { save(); ov.remove(); draw(me, words); };
  function ask() {
    locked = false;
    const it = items[i];
    const pool = shuf([...new Set(words.filter((w) => w.eng !== it.eng).map((w) => w.eng))]).slice(0, 3);
    const optsL = shuf([it.eng, ...pool]);
    const h = el("div", "qh"), x = el("button", "", "✕"); x.onclick = close;
    h.append(x, el("span", "", (i + 1) + " / " + items.length), el("span", "", xp + " XP"));
    const o = el("div", "opts");
    optsL.forEach((txt) => {
      const b = el("button", "", txt);
      b.onclick = () => {
        if (locked) return; locked = true;
        const right = txt === it.eng;
        [...o.children].forEach((c) => { if (c.textContent === it.eng) c.classList.add("okk"); });
        P.today = (P.today || 0) + 1;
        if (right) { ok++; combo++; P.maxCombo = Math.max(P.maxCombo || 0, combo); xp += 10 + Math.min(combo, 5) * 2; P.mastered[wkey(it)] = 1; }
        else { b.classList.add("no"); combo = 0; wrongs.push(it); }
        setTimeout(() => { i++; i < items.length ? ask() : finish(); }, right ? 650 : 1100);
      };
      o.append(b);
    });
    q.replaceChildren(el("div", "cap", opts.title || ""), h, track(i / items.length * 100), el("div", "w", it.tr), el("div", "hint", "İngilizcesi nedir?"), o, el("div", "combo", combo > 1 ? combo + "'li kombo" : ""));
  }
  function finish() {
    const p = Math.round(ok / items.length * 100), lv0 = lvlOf(P.xp);
    P.xp += xp; if (opts.onDone) opts.onDone(p);
    save(); if (lvlOf(P.xp) > lv0) toast("Seviye atladın: " + lvlOf(P.xp));
    const r = el("div", "res");
    const msg = opts.boss ? (p >= BOSS_PASS ? "Bölüm sınavını geçtin." : "Geçmek için %" + BOSS_PASS + " gerekli, tekrar dene.") : (p === 100 ? "Basamak tamam!" : wrongs.length ? "Yanlışları tekrar çalış, basamak tamamlansın." : "Güzel gidiyorsun.");
    r.append(el("div", "cap", "Sonuç"), el("div", "big", "%" + p), el("div", "dim", ok + "/" + items.length + " doğru · +" + xp + " XP"), el("p", "", msg));
    if (opts.boss && p < BOSS_PASS) { const rb = el("button", "", "Tekrar dene"); rb.onclick = () => { ov.remove(); play(me, words, opts.make(), P, save, opts); }; r.append(rb); }
    else if (!opts.boss && wrongs.length) { const rb = el("button", "", "Yanlışları tekrar çalış (" + wrongs.length + ")"); rb.onclick = () => { ov.remove(); play(me, words, wrongs, P, save, { title: opts.title }); }; r.append(rb); }
    const back = el("button", "solid", "Haritaya dön"); back.onclick = close; r.append(back);
    q.replaceChildren(r);
  }
  ask();
}
panelView();
</script>
