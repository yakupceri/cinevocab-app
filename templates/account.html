<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineVocab</title>
<link rel="stylesheet" href="/static/app.css?v={{ ASSET_V }}">
<script src="/static/i18n.js?v={{ ASSET_V }}"></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#170E12">
<link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})})</script>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="/"><i></i>CineVocab</a>
  <div class="grow"></div>
  <div id="pairbox"></div>
  <div id="tools"></div>
</div></header>
<main class="wrap" id="app"></main>
<script src="/static/common.js?v={{ ASSET_V }}"></script>
<script src="/static/fx.js?v={{ ASSET_V }}"></script>
<script>
const app = document.getElementById("app");
let me = null, pairs = [], PAIR = loadPair(), V = { words: [], known: [] }, VIDS = [];
let LG = { open: null, period: "week" };
let tab = "words", Q = "", EP = "", SHOW = 240, LBP = "all", LBS = "people";
const SELW = new Set(), SELV = new Set(), SELK = new Set();

function loadPair() {
  try { const [s, d] = (localStorage.getItem("cv-pair") || "").split(":"); if (s && d && s !== d) return { src: s, dst: d }; } catch (e) {}
  return { src: "tr", dst: "en" };
}
function setPair(src, dst) {
  if (src === dst) dst = PAIR_LANGS.find((l) => l !== src);
  PAIR = { src, dst };
  try { localStorage.setItem("cv-pair", src + ":" + dst); } catch (e) {}
  EP = ""; Q = ""; SHOW = 240; clearSel();
  reload();
}
function clearSel() { SELW.clear(); SELV.clear(); SELK.clear(); }
const pairKey = () => PAIR.src + ">" + PAIR.dst;

/* ---------- giriş ---------- */
let authMode = "login", PENDING_REC = null;
function pwField(ph, ac) {
  const wrap = el("div", "pw"), inp = el("input"), tg = el("button", "", t("show"));
  inp.type = "password"; inp.placeholder = ph; inp.autocomplete = ac; tg.type = "button";
  tg.onclick = () => { const h = inp.type === "password"; inp.type = h ? "text" : "password"; tg.textContent = h ? t("hide") : t("show"); };
  wrap.append(inp, tg);
  return { wrap, inp };
}
function strengthOf(p) {
  if (!p) return 0;
  let s = p.length >= 6 ? 1 : 0;
  if (p.length >= 10 && /[A-Za-z]/.test(p) && /\d/.test(p)) s = 2;
  if (p.length >= 12 && ((/[a-z]/.test(p) && /[A-Z]/.test(p)) || /[^A-Za-z0-9]/.test(p)) && /\d/.test(p)) s = 3;
  return Math.max(1, s);
}
function meterFor(inp) {
  const box = el("div"), m = el("div", "meter"), lab = el("div", "hint");
  m.append(el("i"), el("i"), el("i")); box.append(m, lab);
  const upd = () => { const l = strengthOf(inp.value); m.dataset.l = l; lab.textContent = l ? [t("pwWeak"), t("pwOk"), t("pwStrong")][l - 1] : ""; };
  inp.addEventListener("input", upd); upd();
  return box;
}
function recoveryBox(code) {
  const b = el("div", "rec", code), cp = el("button", "", t("copy"));
  cp.onclick = () => { navigator.clipboard.writeText(code).then(() => toast(t("copied"))); };
  return { box: b, copy: cp };
}
function recoveryView(code) {
  PENDING_REC = code;
  const card = el("div", "card"), { box, copy } = recoveryBox(code), go = el("button", "primary", t("recSaved")), row = el("div", "row");
  go.onclick = () => { PENDING_REC = null; boot(); };
  row.append(copy, go);
  card.append(el("h1", "", t("recTitle")), el("p", "dim", t("recSub")), box, row);
  card.firstChild.style.marginBottom = "10px";
  const w = el("div", "auth"); w.append(card); app.replaceChildren(w);
}
// Sunucu ayarı: Google ile giriş ve e-posta doğrulaması açık mı
let CFG = null;
async function loadCfg() { if (!CFG) { try { CFG = await (await fetch("/api/ext/config")).json(); } catch (e) { CFG = { google: "", mail: false }; } } return CFG; }
function simpleCard(title, sub, ...kids) {
  const card = el("div", "card"), form = el("div"); form.style.cssText = "display:grid;gap:12px;margin-top:16px"; form.append(...kids);
  card.append(el("h1", "", title), el("p", "dim", sub), form); card.firstChild.style.marginBottom = "10px";
  const w = el("div", "auth"); w.append(card); app.replaceChildren(w);
}
// E-postaya gelen 6 haneli kod: hesap ancak doğrulanınca açılır
function codeView(email, again) {
  const code = el("input"), go = el("button", "primary", t("verify")), err = el("p", "err"), re = el("button", "link", t("resend")), back = el("button", "link", t("backToLogin"));
  code.placeholder = t("codePh"); code.inputMode = "numeric"; code.autocomplete = "one-time-code"; code.maxLength = 6; code.style.cssText = "letter-spacing:.3em;text-align:center;font-size:20px";
  go.onclick = async () => { go.disabled = true; err.textContent = ""; try { const r = await api("/api/signup/verify", { email, code: code.value.trim() }); recoveryView(r.recovery); } catch (e) { err.textContent = e.message; go.disabled = false; } };
  re.onclick = async () => { err.textContent = ""; try { await again(); toast(t("codeSent")); } catch (e) { err.textContent = e.message; } };
  back.onclick = () => { authMode = "login"; authView(); };
  code.onkeydown = (e) => { if (e.key === "Enter") go.click(); };
  simpleCard(t("codeTitle"), t("codeSub", email), code, go, err, re, back); code.focus();
}
// Google ile açılan hesap ilk girişte kullanıcı adını seçer
function nameView(suggest) {
  const name = el("input"), go = el("button", "primary", t("continue2")), err = el("p", "err");
  name.value = suggest || ""; name.maxLength = 16; name.autocomplete = "off"; name.setAttribute("aria-label", t("username"));
  go.onclick = async () => { go.disabled = true; err.textContent = ""; try { await api("/api/ext/username", { username: name.value.trim() }); await boot(); } catch (e) { err.textContent = e.message; go.disabled = false; } };
  name.onkeydown = (e) => { if (e.key === "Enter") go.click(); };
  simpleCard(t("nameTitle"), t("nameSub"), name, el("p", "hint", t("userHint")), go, err); name.focus(); name.select();
}
function authView() {
  if (!CFG) { loadCfg().then(() => { if (!me) authView(); }); }
  document.getElementById("pairbox").replaceChildren();
  document.querySelectorAll(".tabbar,.bulk").forEach((n) => n.remove());
  if (PENDING_REC) return recoveryView(PENDING_REC);
  const card = el("div", "card"), err = el("p", "err"), form = el("div");
  form.style.cssText = "display:grid;gap:12px;margin-top:16px";
  const user = el("input"); user.placeholder = t("username"); user.autocomplete = "username"; user.maxLength = 16; user.setAttribute("aria-label", t("username"));
  const go = el("button", "primary");
  const guard = async (fn) => { go.disabled = true; err.textContent = ""; try { await fn(); } catch (e) { err.textContent = e.message; } finally { go.disabled = false; } };

  if (authMode === "forgot") {
    const code = el("input"), np = pwField(t("newPassword"), "new-password"), np2 = pwField(t("password2"), "new-password");
    code.placeholder = "XXXX-XXXX-XXXX"; code.autocomplete = "off"; code.spellcheck = false; code.style.cssText = "letter-spacing:.1em;font-family:ui-monospace,Menlo,monospace";
    go.textContent = t("resetPassword");
    go.onclick = () => guard(async () => {
      if (np.inp.value !== np2.inp.value) throw new Error(t("pwMismatch"));
      const r = await api("/api/forgot", { username: user.value.trim(), recovery: code.value.trim(), password: np.inp.value });
      recoveryView(r.recovery);
    });
    const back = el("button", "link", t("backToLogin")); back.onclick = () => { authMode = "login"; authView(); };
    form.append(user, code, np.wrap, meterFor(np.inp), np2.wrap, go, err, back);
    card.append(el("h1", "", t("forgotTitle")), el("p", "dim", t("forgotSub")), form);
    [user, code, np.inp, np2.inp].forEach((i) => (i.onkeydown = (e) => { if (e.key === "Enter") go.click(); }));
  } else {
    const seg = el("div", "seg authseg"), bl = el("button", authMode === "login" ? "on" : "", t("login")), br = el("button", authMode === "register" ? "on" : "", t("register"));
    bl.onclick = () => { authMode = "login"; authView(); }; br.onclick = () => { authMode = "register"; authView(); };
    seg.append(bl, br); seg.style.marginTop = "18px";
    const pw = pwField(authMode === "login" ? t("password") : t("pwHint"), authMode === "login" ? "current-password" : "new-password");
    if (authMode === "login") {
      go.textContent = t("login");
      go.onclick = () => guard(async () => { await api("/api/login", { username: user.value.trim(), password: pw.inp.value }); await boot(); });
      const fg = el("button", "link", t("forgot")); fg.onclick = () => { authMode = "forgot"; authView(); }; fg.style.justifySelf = "start";
      form.append(user, pw.wrap, go, err, fg);
      card.append(el("h1", "", t("authTitle")), el("p", "dim", t("authSub")), seg, form);
      [user, pw.inp].forEach((i) => (i.onkeydown = (e) => { if (e.key === "Enter") go.click(); }));
    } else {
      const pw2 = pwField(t("password2"), "new-password"), uh = el("p", "hint", t("userHint"));
      const mail = el("input"), needMail = !!(CFG && CFG.mail); mail.type = "email"; mail.placeholder = t("email"); mail.autocomplete = "email"; mail.setAttribute("aria-label", t("email"));
      go.textContent = t("createAccount");
      go.onclick = () => guard(async () => {
        if (pw.inp.value !== pw2.inp.value) throw new Error(t("pwMismatch"));
        const body = { username: user.value.trim(), password: pw.inp.value, ref: (() => { try { return localStorage.getItem("cv-ref") || ""; } catch (e) { return ""; } })() };
        if (needMail) {
          const start = () => api("/api/signup/start", { ...body, email: mail.value.trim(), lang: document.documentElement.lang || "en" });
          await start(); return codeView(mail.value.trim(), start);
        }
        const r = await api("/api/register", body);
        recoveryView(r.recovery);
      });
      const ub = el("div"); ub.append(user, uh);
      form.append(ub, ...(needMail ? [mail] : []), pw.wrap, meterFor(pw.inp), pw2.wrap, go, err);
      card.append(el("h1", "", t("regTitle")), el("p", "dim", t("regSub")), seg, form);
      [user, mail, pw.inp, pw2.inp].forEach((i) => (i.onkeydown = (e) => { if (e.key === "Enter") go.click(); }));
    }
  }
  const demo = el("div", "subs"), ws = el("div", "ws");
  [["Je", "I"], ["ne", ""], ["sais", "know"], ["pas", "not"], ["pourquoi", "why"]].forEach(([a, b], i) => {
    const sp = el("span", i === 1 ? "k" : ""); sp.append(el("b", "", a), el("small", "", b)); ws.append(sp);
  });
  demo.append(ws); demo.style.marginTop = "22px";
  const cap = el("p", "dim small", t("authDemo")); cap.style.cssText = "text-align:center;margin-top:10px";
  const wrap = el("div", "auth"); wrap.append(card, demo, cap);
  app.replaceChildren(wrap);
  if (authMode !== "forgot") googleButton(card);
}
// Google ile giriş: yalnızca sunucuda istemci kimliği ayarlıysa görünür. Düğmeyi Google'ın kendi betiği çizer.
let GCID = null;
async function googleButton(card) {
  try {
    if (GCID === null) GCID = (await loadCfg()).google || "";
    if (!GCID || !card.isConnected) return;
    if (!window.google || !google.accounts) await new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "https://accounts.google.com/gsi/client"; sc.async = true; sc.onload = ok; sc.onerror = no; document.head.append(sc); });
    if (!card.isConnected) return;
    google.accounts.id.initialize({ client_id: GCID, callback: async (r) => {
      try { const g = await api("/api/google", { credential: r.credential, ref: (() => { try { return localStorage.getItem("cv-ref") || ""; } catch (e) { return ""; } })() }); if (g.new) nameView(g.username); else await boot(); } catch (e) { toast(e.message); }
    } });
    const or = el("p", "dim small", t("or2")), box = el("div"); or.style.cssText = "text-align:center;margin:16px 0 10px"; box.style.cssText = "display:flex;justify-content:center";
    card.append(or, box);
    google.accounts.id.renderButton(box, { theme: "filled_black", size: "large", shape: "pill", text: "continue_with", width: Math.min(320, card.clientWidth - 40) });
  } catch (e) {}
}

/* ---------- ana akış ---------- */
const TAB_KEYS = ["words", "videos", "known", "practice", "duel", "leagues", "settings"];
const tabFromHash = () => { const h = location.hash.slice(1); return TAB_KEYS.includes(h) ? h : null; };
// Sekme değiştirir; adres #words, #videos, #known, #practice, #duel, #leagues, #settings olur (eski bağlantılar ve eklenti aynı adreslerle açar)
function go(k) {
  tab = k; try { history.replaceState(null, "", "#" + k); } catch (e) {}
  render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { const h = tabFromHash(); if (me && h && h !== tab) { tab = h; render(); window.scrollTo(0, 0); } });

async function boot() {
  try { me = await api("/api/me"); } catch (e) { me = null; return authView(); }
  try { window.dispatchEvent(new Event("cv-login")); } catch (e) {} // eklenti bu hesaba kendiliğinden bağlanır
  { const h = tabFromHash(); if (h) tab = h; }
  loadG(); await syncG();
  let joined = null;
  try { const jc = localStorage.getItem("cv-join"); if (jc) { localStorage.removeItem("cv-join"); joined = await api("/api/leagues/join", { code: jc }); tab = "leagues"; LG.open = joined.id; } } catch (e) { if (e && e.message) setTimeout(() => toast(e.message), 700); }
  try { pairs = await api("/api/pairs"); } catch (e) { pairs = []; }
  let saved = false; try { saved = !!localStorage.getItem("cv-pair"); } catch (e) {}
  if (!saved && pairs.length) PAIR = { src: pairs[0].src, dst: pairs[0].dst };
  await reload();
  if (joined && joined.joined) toast(t("lgJoined", joined.name));
}
async function reload() {
  const qs = "?src=" + PAIR.src + "&dst=" + PAIR.dst;
  try { [V, VIDS] = await Promise.all([api("/api/vocab" + qs), api("/api/videos" + qs)]); }
  catch (e) { if (e.status === 401) return authView(); toast(e.message); V = { words: [], known: [] }; VIDS = []; }
  try { pairs = await api("/api/pairs"); } catch (e) {}
  render();
}

// Üst çubukta kelime listesi seçici: hap biçimli etiket, altında görünmez gerçek <select> (klavye ve ekran okuyucu bunu kullanır)
function pairOptions() {
  const list = pairs.slice();
  if (!list.some((p) => p.src === PAIR.src && p.dst === PAIR.dst)) list.unshift({ src: PAIR.src, dst: PAIR.dst, count: 0 });
  return list;
}
function pairSelect() {
  const sel = el("select"), list = pairOptions();
  list.forEach((p) => sel.append(new Option(langName(p.src) + " → " + langName(p.dst) + " · " + p.count, p.src + ">" + p.dst)));
  sel.append(new Option("+ " + t("newPair"), "+"));
  sel.value = pairKey(); sel.setAttribute("aria-label", t("listLabel"));
  sel.onchange = () => { if (sel.value === "+") { sel.value = pairKey(); newPairModal(); } else { const [a, b] = sel.value.split(">"); setPair(a, b); } };
  return sel;
}
function renderPair() {
  const box = document.getElementById("pairbox"), cur = pairOptions().find((p) => p.src === PAIR.src && p.dst === PAIR.dst);
  const lp = el("label", "psel"), sel = pairSelect();
  lp.title = t("listLabel") + ": " + langName(PAIR.src) + " → " + langName(PAIR.dst);
  lp.append(svg(ICONS.words), el("span", "full", langName(PAIR.src) + " → " + langName(PAIR.dst)), el("span", "cnt", cur ? "· " + cur.count : ""),
    el("span", "short", PAIR.src.toUpperCase() + " → " + PAIR.dst.toUpperCase()), sel);
  box.replaceChildren(lp);
}
function newPairModal() {
  const m = el("div", "modal"), c = el("div", "card"), a = el("select"), b = el("select"), go = el("button", "primary", t("open")), no = el("button", "", t("cancel"));
  PAIR_LANGS.forEach((l) => { a.append(new Option(langName(l), l)); b.append(new Option(langName(l), l)); });
  a.value = PAIR.src; b.value = PAIR.dst === PAIR.src ? "en" : PAIR.dst;
  const f = (l, x) => { const w = el("label", "f"); w.append(el("span", "", l), x); return w; };
  go.onclick = () => { if (a.value === b.value) return toast(t("ePair")); m.remove(); setPair(a.value, b.value); };
  no.onclick = () => m.remove(); m.onclick = (e) => { if (e.target === m) m.remove(); };
  const r = el("div", "row"); r.append(go, no);
  const h = el("h2", "", t("newPairTitle")); h.style.marginBottom = "6px";
  c.append(h, el("p", "dim", t("newPairSub")), f(t("learning"), a), f(t("translateTo"), b), r);
  c.children[1].style.marginBottom = "14px"; m.append(c); document.body.append(m); a.focus();
}

const uniqWords = () => { const m = new Map(); V.words.forEach((w) => { if (!m.has(w.tr)) m.set(w.tr, w); }); return [...m.values()]; };
const counts = () => ({ words: uniqWords().length, videos: VIDS.length, known: V.known.length });

// Gezinme: 4 ana grup (hem sol menü hem telefonda alt çubuk). Aynı gruptaki sekmeler sayfa başlığının altında görünür.
// Videolar ve Bildiklerim "Kelimeler" altında, Ligler "Düello" altında; yedi adresin hepsi çalışır.
const GROUPS = [["words", "words", ["words", "videos", "known"]], ["practice", "practice", ["practice"]], ["duel", "duel", ["duel", "leagues"]], ["settings", "user", ["settings"]]];
let SUB = null;
function render() {
  document.querySelectorAll(".tabbar,.bulk").forEach((n) => n.remove());
  mountTools(document.getElementById("tools"));
  mountGameChip();
  renderPair();
  document.title = t("nav_" + tab) + " · CineVocab";
  const c = counts(), nav = el("nav", "nav"), bar = el("nav", "tabbar");
  nav.setAttribute("aria-label", t("menuLabel")); bar.setAttribute("aria-label", t("menuLabel"));
  const grp = GROUPS.find(([, , g]) => g.includes(tab)) || GROUPS[0];
  GROUPS.forEach(([k, ic, g]) => {
    const mk = () => { const b = el("button", g.includes(tab) ? "on" : ""); b.append(svg(ICONS[ic]), el("span", "", t("nav_" + k))); if (g.includes(tab)) b.setAttribute("aria-current", "page"); b.onclick = () => go(k); return b; };
    const nb = mk(); if (k === "words" && c.words) nb.append(el("span", "n", c.words));
    nav.append(nb); bar.append(mk());
  });
  const more = el("a", "more"); more.href = "/explore"; more.append(svg(ICONS.search), document.createTextNode(t("expNav")));
  nav.append(el("div", "sep"), more);
  SUB = null;
  if (grp[2].length > 1) {
    SUB = el("nav", "subtabs"); SUB.setAttribute("aria-label", t("nav_" + grp[0]));
    grp[2].forEach((k) => {
      const b = el("button", tab === k ? "on" : "", t("nav_" + k)); if (tab === k) b.setAttribute("aria-current", "page");
      if (c[k] !== undefined) b.append(el("span", "n", c[k]));
      b.onclick = () => go(k); SUB.append(b);
    });
  }
  const main = el("div");
  main.append({ words: tWords, videos: tVideos, known: tKnown, practice: tPractice, duel: tDuel, leagues: tLeagues, settings: tSettings }[tab]());
  const lay = el("div", "layout"); lay.append(nav, main);
  app.replaceChildren(lay);
  document.body.append(bar);
}

// Sayfa başlığı (+ varsa sağda tek ana eylem). Aynı gruptaki sekmeler başlığın hemen altına gelir.
function head(title, sub, extra) {
  const f = document.createDocumentFragment(), h = el("div", "head"), l = el("div");
  l.append(el("h1", "", title)); if (sub) l.append(el("p", "", sub));
  h.append(l); if (extra) { const a = el("div", "acts"); a.append(extra); h.append(a); }
  f.append(h); if (SUB) f.append(SUB);
  return f;
}
function bulkBar(set, buttons) {
  document.querySelectorAll(".bulk").forEach((n) => n.remove());
  if (!set.size) return;
  const b = el("div", "bulk"); b.append(el("b", "", t("selected", set.size)));
  buttons.forEach(([label, cls, fn]) => { const x = el("button", cls, label); x.onclick = fn; b.append(x); });
  const cl = el("button", "ghost", t("clear")); cl.onclick = () => { set.clear(); render(); }; b.append(cl);
  document.body.append(b);
}
function empty(title, text, extra) { const e = el("div", "empty"); e.append(el("b", "", title), el("span", "", text)); if (extra) e.append(extra); return e; }
function otherPairs() {
  const list = pairs.filter((p) => p.src + ">" + p.dst !== pairKey());
  if (!list.length) return null;
  const r = el("div", "row"); r.style.cssText = "justify-content:center;margin-top:16px";
  list.forEach((p) => { const b = el("button", "", langName(p.src) + " → " + langName(p.dst) + " · " + p.count); b.onclick = () => setPair(p.src, p.dst); r.append(b); });
  return r;
}
// Açılır panel: görünür düğme (başlık + tek satır özet + ok). Metin gibi duran gizli bağlantı yerine.
function disclosure(icon, title, summary, body, open, onToggle) {
  const root = el("div", "disc" + (open ? " open" : "")), btn = el("button", "dtog"), tx = el("span", "dt"), sm = el("span", "", summary || ""), bd = el("div", "dbody");
  btn.type = "button"; tx.append(el("b", "", title), sm); btn.append(svg(ICONS[icon]), tx, svg(ICONS.chevD, "chev"));
  bd.append(body); bd.hidden = !open; btn.setAttribute("aria-expanded", String(!!open));
  const set = (o) => { root.classList.toggle("open", o); bd.hidden = !o; btn.setAttribute("aria-expanded", String(o)); if (onToggle) onToggle(o); };
  btn.onclick = () => set(bd.hidden);
  root.append(btn, bd);
  return { root, set, summary: (s) => { sm.textContent = s; } };
}

const STORE_URL = "https://chromewebstore.google.com/detail/glhogfbfbjifiihgffjpjgijkjplebkl";
function startGuide() {
  const g = el("div", "card guide"), ol = el("ol", "gsteps");

let PLAT = "all";

const platOf = (ep) => (!ep ? "ot" : /^YouTube\s*·/.test(ep) ? "yt" : /^Udemy\s*·/.test(ep) ? "ud" : "pv");

  const a = String(w.tr || "").trim().toLowerCase(), toks = (String(w.eng || "").toLowerCase().match(/[a-z']+/g) || []);
  const cjk = /[぀-ヿ㐀-鿿]/.test(a), latinAns = /[a-z]/i.test(String(w.eng || ""));
  if ((a.length < 2 && !cjk) || QSTOP.has(a)) return false;
  // "the/a/and" ve olumsuzluk denetimi yalnızca Latin yazılı çevirilerde anlamlı (ja/ru/ar çevirileri atlanmasın)
  if (latinAns && (!toks.length || toks.every((x) => QSTOP.has(x)))) return false;
  if (/m[ıiuü]yor(um|sun|uz|sunuz|lar)?$/.test(a) && !toks.some((x) => QNEG.has(x) || /n't$/.test(x))) return false;
  return true;
};
/* LF(): öğrenilen dilin kelimesi hangi alanda (tr = kaynak sütunu, eng = çeviri sütunu); OF(): diğeri */
const LF = () => (learnLang(PAIR.src, PAIR.dst) === PAIR.src ? "tr" : "eng");

  if (kind === "listen") {
    const f = OF(), ans = w[f], pool = [...new Set(V.words.filter(quizOk).map((x) => x[f]))].filter((e) => e !== ans);
    return { w, ans, say: w[LF()], listen: true, opts: shuf([ans, ...shuf(pool).slice(0, 3)]) };

};

async function startSrs(hard, area, intro, engs) {

function runQuiz(area, intro, qs, mode) {
  intro.classList.add("hide");
  const SPEED = 8;
  let i = 0, score = 0, combo = 0, bestCombo = 0, lives = 3, correct = 0, answered = 0, cur = null, advance = null, tmo = [];
  const log = []; // akıllı tekrar için: {w, ok}
  const wrongs = [], engs = [...new Set(V.words.map((x) => x.eng))];
  let recr = null;
  const stopRec = () => { if (recr) { try { recr.abort(); } catch (e) {} recr = null; } };
  const clearT = () => { tmo.forEach(clearTimeout); tmo = []; stopRec(); };
  const onKey = (e) => {
    if (!cur || !document.body.contains(cur.card)) { document.removeEventListener("keydown", onKey); return; }
    if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && !cur.locked) cur.btns[n - 1] && cur.btns[n - 1].click();
    else if ((e.key === "Enter" || e.key === " ") && cur.locked && advance) { e.preventDefault(); advance(); }
  };
  document.addEventListener("keydown", onKey);

  function step() {
    if (i >= qs.length) return end("done");
    const Q = qs[i], { w, opts } = Q, ans = Q.ans, card = el("div", "card qcard in"), hud = el("div", "hud");
    const hearts = el("div", "hearts"), comboEl = el("span", "combo"), scEl = el("span", "sc", String(score)), snd = el("button", "ghost icon-sm");
    comboEl.append(svg(ICO.flame), el("span", "", ""));
    const paintCombo = () => { comboEl.lastChild.textContent = combo >= 2 ? t("combo", combo) : "×" + Math.max(combo, 1); comboEl.className = "combo" + (combo >= 3 ? " hot" : "") + (combo >= 6 ? " fire" : ""); };
    const paintHearts = () => { hearts.replaceChildren(...[0, 1, 2].map((k) => { const h = svg(ICO.heart); if (k >= lives) h.classList.add("lost"); return h; })); };
    const paintSnd = () => { snd.replaceChildren(svg(FX.isMuted() ? ICO.mute : ICO.sound)); snd.setAttribute("aria-label", t("sound")); };
    snd.onclick = () => { FX.setMuted(!FX.isMuted()); paintSnd(); }; paintSnd(); paintCombo(); paintHearts();
    if (mode === "survival") hud.append(hearts);
    hud.append(comboEl, el("span", "dim small", t("qOf", i + 1, qs.length)), scEl, snd);
    const bar = el("div", mode === "speed" ? "tbar" : "bar"), fill = el("i"); bar.append(fill);
    if (mode !== "speed") fill.style.width = (i / qs.length * 100) + "%";
    const og = el("div", "opts"), btns = [];
    opts.forEach((o, k) => {
      const b = el("button"); b.append(el("span", "k", k + 1), el("span", "", o));
      b.onclick = () => answer(b, o); og.append(b); btns.push(b);
    });
    let prompt, sayBox = null;
    if (Q.speak) {
      // Konuşma modu: ekranda anlam, öğrenilen dildeki kelimeyi söylersin (mikrofon) ya da yazarsın. Kontrol tarayıcıda yapılır.
      const lang = learnLang(PAIR.src, PAIR.dst);
      prompt = el("div"); sayBox = { tries: 0 };
      const heard = el("div", "heard"), status = el("p", "dim small"), row = el("div", "sayrow"), inp = el("input"), go = el("button", "", t("sayGo")), skip = el("button", "ghost", t("saySkip"));
      status.style.textAlign = "center"; inp.placeholder = t("sayType"); inp.maxLength = 60; inp.autocomplete = "off"; inp.setAttribute("autocapitalize", "off"); inp.spellcheck = false;
      const tryText = (alts) => {
        if (cur.locked) return;
        const hit = alts.find((a) => sayMatch(a, Q.ans));
        if (hit !== undefined) { heard.textContent = "✓ " + hit; heard.style.color = "var(--ok)"; return answer(null, Q.ans); }
        sayBox.tries++; heard.textContent = "✗ " + t("sayHeard", alts[0]); heard.style.color = "var(--bad)"; FX.play("wrong"); FX.shake(card);
        if (sayBox.tries >= 3) answer(null, "");
      };
      go.onclick = () => { if (inp.value.trim()) { tryText([inp.value.trim()]); inp.value = ""; } };
      inp.onkeydown = (e) => { if (e.key === "Enter") go.click(); };
      skip.onclick = () => answer(null, "");
      row.append(inp, go, skip);
      prompt.append(el("div", "qword", w[OF()]), el("p", "dim small center", t("sayWord", langName(lang))));
      if (SpeechRec) {
        const micb = el("button", "mic"), wrap = el("div", "center"); micb.append(svg(ICONS.mic)); micb.setAttribute("aria-label", t("sayStart")); micb.title = t("sayStart"); wrap.append(micb); prompt.append(wrap);
        micb.onclick = () => {
          if (recr) { stopRec(); micb.classList.remove("on"); return; }
          const r = new SpeechRec(); recr = r; r.lang = SPEECH_LANG[lang] || lang; r.interimResults = false; r.maxAlternatives = 3; r.continuous = false;
          r.onstart = () => { micb.classList.add("on"); status.textContent = t("sayListening"); };
          r.onresult = (e) => { const res = e.results[e.results.length - 1], alts = []; for (let k = 0; k < res.length; k++) alts.push(res[k].transcript); tryText(alts); };
          r.onerror = (e) => { status.textContent = (e.error === "not-allowed" || e.error === "service-not-allowed") ? t("sayDenied") : e.error === "network" ? t("sayNoMic") : ""; };
          r.onend = () => { micb.classList.remove("on"); if (recr === r) recr = null; if (status.textContent === t("sayListening")) status.textContent = ""; };
          try { r.start(); } catch (e) { recr = null; }

      }

      prompt.append(sb, el("span", "dim small", t("listenQ")));

    } else prompt = el("div", "qword", w.tr);
    card.append(hud, bar, prompt, og);

    cur = { card, btns, locked: false };
    const t0 = performance.now();

    if (mode === "speed") {
      fill.style.transition = "none"; fill.style.transform = "scaleX(1)";
      requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.transition = "transform " + SPEED + "s linear"; fill.style.transform = "scaleX(0)"; }));
      tmo.push(setTimeout(() => { bar.classList.add("low"); FX.play("tick"); }, (SPEED - 3) * 1000));
      tmo.push(setTimeout(() => FX.play("tick"), (SPEED - 2) * 1000), setTimeout(() => FX.play("tick"), (SPEED - 1) * 1000));
      tmo.push(setTimeout(() => answer(null, null), SPEED * 1000));
    }

    function answer(btn, choice) {
      if (cur.locked) return; cur.locked = true; clearT();
      const el_ = (performance.now() - t0) / 1000, ok = choice === ans; answered++; log.push({ w: w.tr, ok });
      btns.forEach((x) => { if (x.lastChild.textContent === ans) x.classList.add("ok"); else if (x === btn) x.classList.add("no"); });
      if (Q.speak) { stopRec(); prompt.querySelectorAll("input,button").forEach((x) => (x.disabled = true)); const h = prompt.querySelector(".heard"); if (h) { h.textContent = (ok ? "✓ " : "✗ ") + ans; h.style.color = ok ? "var(--ok)" : "var(--bad)"; } if (canSpeak()) setTimeout(() => speak(ans, learnLang(PAIR.src, PAIR.dst)), 200); }
      else if (Q.listen) { const q = prompt.querySelector(".dim"); if (q) q.textContent = Q.say + " = " + ans; }
      else if (canSpeak()) { const sp = speakBtn(w[LF()], learnLang(PAIR.src, PAIR.dst)); sp.style.cssText = "display:grid;margin:-8px auto 12px"; prompt.after(sp); }
      fill.style.transition = "none";
      if (ok) {
        combo++; correct++; bestCombo = Math.max(bestCombo, combo);
        const lim = mode === "speed" ? SPEED : 10, bonus = Math.round(50 * Math.max(0, 1 - el_ / lim)), pts = 100 + bonus + Math.min(50, 10 * (combo - 1));
        score += pts; scEl.textContent = score; FX.bump(scEl);
        card.classList.add("ok"); FX.play("correct", combo); FX.vibrate(14); FX.float(btn || card, "+" + pts, combo >= 3 ? "hot" : "");
        if (combo > 0 && combo % 5 === 0) { FX.confetti(0.55); FX.play("combo"); }
      } else {
        combo = 0; wrongs.push(w); if (mode === "survival") lives--;
        card.classList.add("no"); FX.shake(card); FX.play("wrong"); FX.vibrate([50, 40, 50]);
        if (!btn) FX.float(card.querySelector(".qword, .listen-q"), t("timeUp"), "bad");
      }
      paintCombo(); FX.bump(comboEl); paintHearts();
      let done = false;
      advance = () => { if (done) return; done = true; advance = null; i++; if (mode === "survival" && lives <= 0) end("lives"); else step(); };
      tmo.push(setTimeout(() => advance && advance(), ok ? 800 : 1500));
    }
  }

  function end(reason) {
    clearT(); document.removeEventListener("keydown", onKey); cur = null;
    if (log.length) api("/api/srs/report", { src: PAIR.src, dst: PAIR.dst, items: log }).catch(() => {});
    const pct = answered ? Math.round(correct / answered * 100) : 0;
    const xpGain = correct * 10 + bestCombo * 2 + (pct === 100 && answered >= 5 ? 20 : 0);
    const lvBefore = levelOf(G.xp), fracBefore = (G.xp % XP_LEVEL) / XP_LEVEL;
    G.xp += xpGain; const lvAfter = levelOf(G.xp), leveled = lvAfter > lvBefore, newBest = score > G.best;
    if (newBest) G.best = score; G.bestCombo = Math.max(G.bestCombo || 0, bestCombo);
    const td = todayStr(); if (G.day !== td) { G.day = td; G.n = 0; } G.n += answered;
    if (G.last !== td) { G.streak = G.last === yesterdayStr() ? G.streak + 1 : 1; G.last = td; }
    saveG(); mountGameChip();

    const card = el("div", "card result in"), stars = el("div", "stars"), big = el("div", "big", "0");
    const title = reason === "lives" ? t("outOfLives") : pct === 100 ? t("rPerfect") : pct >= 80 ? t("rGreat") : pct >= 50 ? t("rGood") : t("rKeep");
    const n = pct >= 90 ? 3 : pct >= 65 ? 2 : pct >= 35 ? 1 : 0;
    for (let k = 0; k < 3; k++) stars.append(svg(ICO.star));
    const info = el("div", "chips"); info.style.justifyContent = "center";
    info.append(chip(ICO.star, t("accuracyN", pct)), chip(ICO.flame, t("bestCombo", bestCombo), bestCombo >= 3 ? "fire" : ""), chip(null, t("result", correct, answered)));
    const xpb = el("div", "xpbar"), xpi = el("i"); xpb.append(xpi); xpi.style.width = (fracBefore * 100) + "%";
    const xpl = el("p", "dim small", t("xpGain", xpGain) + " · " + t("lvl", lvAfter));
    const banners = el("div");

    const r = el("div", "row"); r.style.marginTop = "16px";
    if (wrongs.length) { const b = el("button", "primary", t("retryWrong", wrongs.length)); b.onclick = () => runQuiz(area, intro, shuf(wrongs).map((w) => mkQ(w, engs, mode)), mode); r.append(b); }
    const again = el("button", wrongs.length ? "" : "primary", t("again")); again.onclick = () => { area.replaceChildren(); render(); }; r.append(again);
    card.append(el("h2", "", title), stars, big, el("p", "dim small", t("ptsN", "")), info, xpb, xpl, banners, r);
    if (wrongs.length) {
      const l = el("div", "list"); l.style.cssText = "margin-top:16px;text-align:left";
      wrongs.forEach((w) => { const li = el("div", "li"); li.append(el("span", "t", w.tr), el("span", "grow dim", w.eng)); l.append(li); });
      card.append(l);
    }
    area.replaceChildren(card);
    FX.count(big, score, 1000);
    requestAnimationFrame(() => requestAnimationFrame(() => { xpi.style.width = (leveled ? 100 : (G.xp % XP_LEVEL) / XP_LEVEL * 100) + "%"; }));
    [...stars.children].forEach((sv, k) => { if (k < n) setTimeout(() => { sv.classList.add("on"); FX.play("correct", k * 2 + 1); }, 500 + k * 380); });
    setTimeout(() => {
      if (leveled) { FX.play("level"); FX.confetti(1.2); } else if (pct >= 80) { FX.play("win"); FX.confetti(0.9); } else if (n === 0) FX.play("lose");
    }, 500 + n * 380);
  }
  step();
}

// Üç eski yol (hızlı oda, kodla katıl, özel oda) iki net yola indi:

let DUEL_EP = "";
const DU = { n: "10", s: "12", pw: "", mode: "choice", ep: "", open: false };
function tDuel() {
  const box = el("div"), f = (l, x) => { const w = el("label", "f"); w.append(el("span", "", l), x); return w; };
  box.append(head(t("nav_duel"), t("duelSub")));

  const gExt = group("ext", "plug", t("extension"), t("gExtSub"), [extRow]);

  // ---- Paylaşım ve davet
  const ivb = ibtn("copy", t("inviteCopy"), "primary"), ivn = el("span", "dim small"), ivr = el("div", "chips");
  api("/api/invite").then((d) => {
    ivn.textContent = t("inviteCount", d.count);
    d.badges.forEach((b) => ivr.append(chip(ICO.star, t("bdg_" + b))));
    ivb.onclick = async () => { try { await navigator.clipboard.writeText(d.link); toast(t("inviteCopied")); } catch (e) { toast(d.link); } };
  }).catch(() => {});
  const inv = row(t("inviteTitle"), t("inviteSub"), ivb); inv.querySelector(".lab").append(ivn, ivr); ivr.style.marginTop = "8px";
  const pubT = toggleBtn(t("publicTitle"), false, async (b) => { try { paintPub(await api("/api/profile-public", { on: b.getAttribute("aria-checked") !== "true" })); } catch (e) { toast(e.message); } });
  const pubL = el("a", "btn hide"); pubL.append(svg(ICONS.external), document.createTextNode(t("publicView")));
  const paintPub = (d) => { pubT.setAttribute("aria-checked", String(!!d.on)); pubL.href = d.url; pubL.target = "_blank"; pubL.rel = "noopener"; pubL.classList.toggle("hide", !d.on); };
  api("/api/profile-public").then(paintPub).catch(() => {});
  const pubRow = row(t("publicTitle"), t("publicSub"), pubL, pubT);
  const gShare = group("share", "share", t("gShare"), t("gShareSub"), [inv, pubRow]);

  // ---- Güvenlik
  const cur = pwField(t("currentPw"), "current-password"), n1 = pwField(t("newPassword"), "new-password"), n2 = pwField(t("password2"), "new-password");
  const sb = el("button", "primary", t("changePassword")), serr = el("p", "err"), sf = el("div", "form");
  sb.onclick = async () => {
    serr.textContent = "";
    if (n1.inp.value !== n2.inp.value) { serr.textContent = t("pwMismatch"); return; }
    try { await api("/api/change-password", { current: cur.inp.value, password: n1.inp.value }); [cur, n1, n2].forEach((f) => (f.inp.value = "")); toast(t("pwChanged")); }
    catch (e) { serr.textContent = e.message; }
  };
  if (me.has_password === false) cur.wrap.style.display = "none"; // Google ile açılan hesap: ilk parolayı belirler
  const sw = el("div", "row"); sw.append(sb);
  sf.append(cur.wrap, n1.wrap, meterFor(n1.inp), n2.wrap, sw, serr);
  const rb = ibtn("shield", t("newRecovery"), "");
  rb.onclick = async () => {
    const pw = await askPassword(t("newRecovery"));
    if (pw === null) return;
    try { const r = await api("/api/new-recovery", { password: pw }); me.has_recovery = true; recoveryModal(r.recovery); } catch (e) { toast(e.message); }
  };
  const gSec = group("security", "shield", t("security"), t("gSecuritySub"), [
    stack(t("changePassword"), "", sf),
    row(t("recoveryCode"), me.has_recovery ? t("recoveryHas") : t("recoveryNone"), rb),
  ]);

  // ---- Tehlikeli bölge
  const del = ibtn("trash", t("deleteAccount"), "danger");
  del.onclick = () => {
    const m = el("div", "modal"), c = el("div", "card"), pw = el("input"), e = el("p", "err"), ok = el("button", "danger", t("deleteAccount")), no = el("button", "", t("cancel"));
    pw.type = "password"; pw.placeholder = t("password"); pw.setAttribute("aria-label", t("password"));
    if (me.has_password === false) { pw.type = "text"; pw.placeholder = me.username; pw.autocomplete = "off"; }
    ok.onclick = async () => { try { await api("/api/delete-account", { password: pw.value }); m.remove(); me = null; toast(t("accountDeleted")); authView(); } catch (er) { e.textContent = er.message; } };
    no.onclick = () => m.remove(); m.onclick = (ev) => { if (ev.target === m) m.remove(); }; const rr = el("div", "row"); rr.append(ok, no);
    pw.style.marginTop = "14px"; c.append(el("h2", "", t("deleteAccount")), el("p", "dim", t("deleteAccountSub") + (me.has_password === false ? " " + t("typeName") : "")), pw, e, rr); m.append(c); document.body.append(m); pw.focus();
  };
  const gDanger = group("danger", "danger", t("gDanger"), t("gDangerSub"), [row(t("deleteAccount"), t("deleteAccountShort"), del)], "danger");

  // ---- bölüm dizini: her ayar grubuna tek dokunuşla git
  const jump = el("nav", "jump"); jump.setAttribute("aria-label", t("jumpTo"));
  GROUPS_S.forEach(([id, title, cls]) => {
    const a = el("a", cls || "", title); a.href = "#sg-" + id;
    a.onclick = (e) => { e.preventDefault(); const s = document.getElementById("sg-" + id); if (s) { s.scrollIntoView({ behavior: FX.reduce ? "auto" : "smooth", block: "start" }); } };
    jump.append(a);
  });
  const eb = el("p", "eyebrow", t("settingsLabel")); eb.style.margin = "28px 0 0";
  box.append(hero, eb, jump, gAccount, gLang, gStudy, gExt, gShare, gSec, gDanger);
  return box;
}

I18N.onChange(() => { mountTools(document.getElementById("tools")); me ? render() : authView(); });
mountTools(document.getElementById("tools"));
boot();
</script>
</body>
</html>
