<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineVocab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/i18n.js"></script>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="/"><i></i>CineVocab</a>
  <div id="pairbox" class="row" style="gap:6px;margin-left:10px"></div>
  <div class="grow"></div>
  <div id="tools" class="row" style="gap:6px"></div>
</div></header>
<main class="wrap" id="app"></main>
<script src="/static/common.js"></script>
<script>
const app = document.getElementById("app");
let me = null, pairs = [], PAIR = loadPair(), V = { words: [], known: [] }, VIDS = [];
let tab = "words", Q = "", EP = "", SHOW = 240, LBP = "all", LBS = "people";
const SELW = new Set(), SELV = new Set(), SELK = new Set();

function loadPair() {
  try { const [s, d] = (localStorage.getItem("cv-pair") || "").split(":"); if (s && d && s !== d) return { src: s, dst: d }; } catch (e) {}
  return { src: "tr", dst: "en" };
}
function setPair(src, dst) {
  if (src === dst) dst = PAIR_LANGS.find((l) => l !== src);
  PAIR = { src, dst };
  try { localStorage.setItem("cv-pair", src + ":" + dst); } catch (e) {}
  EP = ""; Q = ""; SHOW = 240; clearSel();
  reload();
}
function clearSel() { SELW.clear(); SELV.clear(); SELK.clear(); }
const pairKey = () => PAIR.src + ">" + PAIR.dst;

/* ---------- giriş ---------- */
function authView() {
  document.getElementById("pairbox").replaceChildren();
  document.querySelectorAll(".tabbar,.bulk").forEach((n) => n.remove());
  let mode = "login";
  const card = el("div", "card"), seg = el("div", "seg");
  const bl = el("button", "on", t("login")), br = el("button", "", t("register"));
  const user = el("input"), pass = el("input"), err = el("p", "err"), go = el("button", "primary", t("login"));
  user.placeholder = t("username"); user.autocomplete = "username"; user.maxLength = 16;
  pass.type = "password"; pass.placeholder = t("pwHint"); pass.autocomplete = "current-password";
  const set = (m) => { mode = m; bl.className = m === "login" ? "on" : ""; br.className = m === "login" ? "" : "on";
    go.textContent = m === "login" ? t("login") : t("createAccount"); pass.autocomplete = m === "login" ? "current-password" : "new-password"; err.textContent = ""; };
  bl.onclick = () => set("login"); br.onclick = () => set("register");
  go.onclick = async () => {
    go.disabled = true;
    try { await api(mode === "login" ? "/api/login" : "/api/register", { username: user.value.trim(), password: pass.value }); await boot(); }
    catch (e) { err.textContent = e.message; } finally { go.disabled = false; }
  };
  pass.onkeydown = (e) => { if (e.key === "Enter") go.click(); };
  seg.append(bl, br);
  const form = el("div"); form.style.cssText = "display:grid;gap:10px;margin-top:16px";
  form.append(user, pass, go, err);
  card.append(el("h1", "", t("authTitle")), el("p", "dim", t("authSub")), seg, form);
  seg.style.marginTop = "18px";
  const demo = el("div", "subs"), ws = el("div", "ws");
  [["Je", "I"], ["ne", "—"], ["sais", "know"], ["pas", "not"], ["pourquoi", "why"]].forEach(([a, b], i) => {
    const s = el("span", i === 1 ? "k" : ""); s.append(el("b", "", a), el("small", "", b)); ws.append(s);
  });
  demo.append(ws); demo.style.marginTop = "22px";
  const wrap = el("div"); wrap.style.cssText = "max-width:440px;margin:6vh auto 0";
  const cap = el("p", "dim small", t("authDemo")); cap.style.cssText = "text-align:center;margin-top:10px";
  wrap.append(card, demo, cap);
  app.replaceChildren(wrap);
}

/* ---------- ana akış ---------- */
async function boot() {
  try { me = await api("/api/me"); } catch (e) { me = null; return authView(); }
  try { pairs = await api("/api/pairs"); } catch (e) { pairs = []; }
  let saved = false; try { saved = !!localStorage.getItem("cv-pair"); } catch (e) {}
  if (!saved && pairs.length) PAIR = { src: pairs[0].src, dst: pairs[0].dst };
  await reload();
}
async function reload() {
  const qs = "?src=" + PAIR.src + "&dst=" + PAIR.dst;
  try { [V, VIDS] = await Promise.all([api("/api/vocab" + qs), api("/api/videos" + qs)]); }
  catch (e) { if (e.status === 401) return authView(); toast(e.message); V = { words: [], known: [] }; VIDS = []; }
  try { pairs = await api("/api/pairs"); } catch (e) {}
  render();
}

function renderPair() {
  const box = document.getElementById("pairbox");
  const mk = (cur, onch) => { const s = el("select"); PAIR_LANGS.forEach((l) => s.append(new Option(langName(l), l))); s.value = cur; s.onchange = () => onch(s.value); return s; };
  const a = mk(PAIR.src, (v) => setPair(v, PAIR.dst)), b = mk(PAIR.dst, (v) => setPair(PAIR.src, v));
  a.title = t("learning"); b.title = t("translateTo"); a.setAttribute("aria-label", t("learning")); b.setAttribute("aria-label", t("translateTo"));
  box.replaceChildren(a, el("span", "dim", "→"), b);
}

const TABS = [["words", "words"], ["videos", "videos"], ["known", "known"], ["practice", "practice"], ["duel", "duel"], ["settings", "settings"]];
const uniqWords = () => { const m = new Map(); V.words.forEach((w) => { if (!m.has(w.tr)) m.set(w.tr, w); }); return [...m.values()]; };
const counts = () => ({ words: uniqWords().length, videos: VIDS.length, known: V.known.length });

function render() {
  document.querySelectorAll(".tabbar,.bulk").forEach((n) => n.remove());
  mountTools(document.getElementById("tools"));
  renderPair();
  const c = counts(), nav = el("nav", "nav"), bar = el("nav", "tabbar");
  TABS.forEach(([k, ic]) => {
    const mkb = (cls) => { const b = el("button", tab === k ? "on" : ""); b.append(svg(ICONS[ic]), el("span", "", t("nav_" + k))); if (cls && c[k] !== undefined) b.append(el("span", "n", c[k])); b.onclick = () => { tab = k; render(); window.scrollTo(0, 0); }; return b; };
    nav.append(mkb(true)); bar.append(mkb(false));
  });
  const main = el("div");
  main.append({ words: tWords, videos: tVideos, known: tKnown, practice: tPractice, duel: tDuel, settings: tSettings }[tab]());
  const lay = el("div", "layout"); lay.append(nav, main);
  app.replaceChildren(lay);
  document.body.append(bar);
}

function head(title, sub, extra) {
  const h = el("div", "head"), l = el("div"); l.append(el("h1", "", title)); if (sub) l.append(el("p", "", sub));
  h.append(l); if (extra) h.append(extra); return h;
}
function bulkBar(set, buttons) {
  document.querySelectorAll(".bulk").forEach((n) => n.remove());
  if (!set.size) return;
  const b = el("div", "bulk"); b.append(el("b", "", t("selected", set.size)));
  buttons.forEach(([label, cls, fn]) => { const x = el("button", cls, label); x.onclick = fn; b.append(x); });
  const cl = el("button", "ghost", t("clear")); cl.onclick = () => { set.clear(); render(); }; b.append(cl);
  document.body.append(b);
}
function empty(title, text, extra) { const e = el("div", "empty"); e.append(el("b", "", title), el("span", "", text)); if (extra) e.append(extra); return e; }
function otherPairs() {
  const list = pairs.filter((p) => p.src + ">" + p.dst !== pairKey());
  if (!list.length) return null;
  const r = el("div", "row"); r.style.cssText = "justify-content:center;margin-top:16px";
  list.forEach((p) => { const b = el("button", "", langName(p.src) + " → " + langName(p.dst) + " · " + p.count); b.onclick = () => setPair(p.src, p.dst); r.append(b); });
  return r;
}

/* ---------- Kelimeler ---------- */
function tWords() {
  const box = el("div"), c = counts();
  box.append(head(t("nav_words"), t("wordsSub", c.words, langName(PAIR.src))));
  const st = el("div", "stats");
  [[c.words, t("statWords")], [c.videos, t("statVideos")], [c.known, t("statKnown")], [me.wins || 0, t("statWins")]].forEach(([n, l]) => {
    const s = el("div", "stat"); s.append(el("b", "", n), el("span", "", l)); st.append(s); });
  box.append(st);
  if (!V.words.length) { box.append(empty(t("emptyWords"), t("emptyWordsText", langName(PAIR.src), langName(PAIR.dst)), otherPairs())); return box; }

  const q = el("input"), ep = el("select"), all = el("button", "", t("selectShown"));
  q.type = "search"; q.placeholder = t("search"); q.value = Q;
  ep.append(new Option(t("allVideos"), ""));
  VIDS.forEach((v) => ep.append(new Option((v.episode || t("noVideo")) + " · " + v.count, v.episode || "\u0000")));
  ep.value = EP;
  const grid = el("div", "words"), more = el("button", "");
  const rows = () => {
    const ql = Q.trim().toLowerCase(), seen = new Set(), out = [];
    V.words.forEach((w) => {
      if (EP !== "" && (w.episode || "\u0000") !== EP) return;
      if (ql && !w.tr.toLowerCase().includes(ql) && !w.eng.toLowerCase().includes(ql)) return;
      if (seen.has(w.tr)) return; seen.add(w.tr); out.push(w);
    });
    return out;
  };
  const paint = () => {
    const list = rows(); grid.replaceChildren();
    list.slice(0, SHOW).forEach((w) => {
      const b = el("button", "w" + (SELW.has(w.tr) ? " sel" : ""));
      b.setAttribute("aria-pressed", SELW.has(w.tr));
      b.append(el("span", "src", w.tr), el("span", "dst", w.eng), el("span", "ep", w.episode || t("noVideo")), el("span", "ck"));
      b.onclick = () => { SELW.has(w.tr) ? SELW.delete(w.tr) : SELW.add(w.tr); b.classList.toggle("sel"); b.setAttribute("aria-pressed", SELW.has(w.tr)); wbar(); };
      grid.append(b);
    });
    if (!list.length) grid.replaceChildren(empty(t("noMatch"), ""));
    more.className = list.length > SHOW ? "" : "hide"; more.textContent = t("showMore", list.length - SHOW);
    all.onclick = () => { list.slice(0, SHOW).forEach((w) => SELW.add(w.tr)); paint(); wbar(); };
  };
  const wbar = () => bulkBar(SELW, [
    [t("iKnow"), "primary", async () => { const ws = [...SELW]; await api("/api/known", { src: PAIR.src, words: ws, known: true }); toast(t("markedKnown", ws.length)); SELW.clear(); reload(); }],
    [t("del"), "danger", async () => { const ws = [...SELW]; if (!(await ask(t("confirmDelWords", ws.length), t("confirmDelWordsText")))) return;
      const r = await api("/api/delete-words", { src: PAIR.src, dst: PAIR.dst, words: ws }); toast(t("deleted", r.deleted)); SELW.clear(); reload(); }],
  ]);
  q.oninput = () => { Q = q.value; SHOW = 240; paint(); };
  ep.onchange = () => { EP = ep.value; SHOW = 240; paint(); };
  more.onclick = () => { SHOW += 240; paint(); };
  const bar = el("div", "row"); q.style.cssText = "flex:1 1 200px"; ep.style.cssText = "flex:0 1 260px;width:auto"; bar.append(q, ep, all);
  bar.style.marginBottom = "14px";
  box.append(bar, grid, more); more.style.cssText = "display:block;margin:16px auto 0";
  paint(); wbar();
  return box;
}

/* ---------- Videolar ---------- */
function tVideos() {
  const box = el("div");
  box.append(head(t("nav_videos"), t("videosSub")));
  if (!VIDS.length) { box.append(empty(t("emptyVideos"), t("emptyVideosText"), otherPairs())); return box; }
  const list = el("div", "list");
  VIDS.forEach((v) => {
    const key = v.episode || "", li = el("div", "li"), cb = el("input", "chk");
    cb.type = "checkbox"; cb.checked = SELV.has(key); cb.setAttribute("aria-label", v.episode || t("noVideo"));
    cb.onchange = () => { cb.checked ? SELV.add(key) : SELV.delete(key); vbar(); };
    const mid = el("div", "grow"); mid.style.minWidth = "0";
    mid.append(el("div", "t", v.episode || t("noVideo")), el("div", "m", t("wordsN", v.count) + (v.last ? " · " + fmtDate(v.last) : "")));
    const view = el("button", "ghost", t("viewWords")); view.onclick = () => { EP = v.episode || "\u0000"; tab = "words"; render(); };
    const duel = el("button", "ghost", t("nav_duel")); duel.onclick = () => { DUEL_EP = v.episode || ""; tab = "duel"; render(); };
    li.append(cb, mid, view, duel); list.append(li);
  });
  const vbar = () => bulkBar(SELV, [[t("del"), "danger", async () => {
    const eps = [...SELV]; if (!(await ask(t("confirmDelVideos", eps.length), t("confirmDelVideosText")))) return;
    const r = await api("/api/delete-videos", { src: PAIR.src, dst: PAIR.dst, episodes: eps }); toast(t("deleted", r.deleted)); SELV.clear(); reload(); }]]);
  const all = el("button", "", t("selectAll")); all.onclick = () => { VIDS.forEach((v) => SELV.add(v.episode || "")); render(); };
  const note = el("p", "dim small grow", t("autoNote"));
  const top = el("div", "row"); top.append(note, all); top.style.marginBottom = "12px";
  box.append(top, list); vbar();
  return box;
}

/* ---------- Bildiklerim ---------- */
function tKnown() {
  const box = el("div");
  box.append(head(t("nav_known"), t("knownSub")));
  const card = el("div", "card"), ta = el("textarea"), add = el("button", "primary", t("add"));
  ta.rows = 2; ta.placeholder = t("addKnownPh"); ta.setAttribute("aria-label", t("addKnown"));
  add.onclick = async () => {
    const ws = ta.value.split(/[\n,;]+/).map((x) => x.trim()).filter(Boolean); if (!ws.length) return;
    await api("/api/known", { src: PAIR.src, words: ws, known: true }); toast(t("markedKnown", ws.length)); ta.value = ""; reload();
  };
  ta.style.margin = "10px 0"; card.append(el("h3", "", t("addKnown")), ta, add); box.append(card);
  card.style.marginBottom = "18px";
  if (!V.known.length) { box.append(empty(t("emptyKnown"), t("emptyKnownText"))); return box; }
  const grid = el("div", "words");
  V.known.forEach((w) => {
    const b = el("button", "w" + (SELK.has(w.tr) ? " sel" : ""));
    b.append(el("span", "src", w.tr), el("span", "dst", w.eng || "—"), el("span", "ck"));
    b.onclick = () => { SELK.has(w.tr) ? SELK.delete(w.tr) : SELK.add(w.tr); b.classList.toggle("sel"); kbar(); };
    grid.append(b);
  });
  const kbar = () => bulkBar(SELK, [[t("moveBack"), "primary", async () => { const ws = [...SELK];
    await api("/api/known", { src: PAIR.src, words: ws, known: false }); toast(t("movedBack", ws.length)); SELK.clear(); reload(); }]]);
  box.append(grid); kbar();
  return box;
}

/* ---------- Pratik ---------- */
let PR = { scope: "", n: 10 };
const mkQ = (w, engs) => ({ w, opts: shuf([w.eng, ...shuf(engs.filter((e) => e !== w.eng)).slice(0, 3)]) });
function tPractice() {
  const box = el("div");
  box.append(head(t("nav_practice"), t("practiceSub")));
  const words = uniqWords(), engs = [...new Set(V.words.map((w) => w.eng))];
  if (words.length < 4 || engs.length < 4) { box.append(empty(t("needWords"), t("needWordsText"), otherPairs())); return box; }
  const card = el("div", "card"), area = el("div");
  const sc = el("select"), nn = el("select"), go = el("button", "primary", t("start"));
  sc.append(new Option(t("allWords"), ""));
  VIDS.filter((v) => v.count >= 4).forEach((v) => sc.append(new Option((v.episode || t("noVideo")) + " · " + v.count, v.episode || "\u0000")));
  [5, 10, 20, 30].forEach((n) => nn.append(new Option(t("nQuestions", n), n)));
  sc.value = PR.scope; nn.value = PR.n;
  const f1 = el("label", "f"), f2 = el("label", "f");
  f1.append(el("span", "", t("source")), sc); f2.append(el("span", "", t("questions")), nn);
  const row = el("div", "row"); f1.style.flex = "1 1 220px"; f2.style.flex = "0 0 150px"; f1.style.margin = f2.style.margin = "0";
  go.style.alignSelf = "flex-end"; row.append(f1, f2, go); card.append(row);
  go.onclick = () => {
    PR = { scope: sc.value, n: +nn.value };
    const pool = shuf(words.filter((w) => !PR.scope || (w.episode || "\u0000") === PR.scope));
    runQuiz(area, card, (pool.length >= 4 ? pool : shuf(words)).slice(0, PR.n).map((w) => mkQ(w, engs)));
  };
  box.append(card, area); area.style.marginTop = "16px";
  return box;
}
function runQuiz(area, setup, qs) {
  setup.classList.add("hide");
  let i = 0, score = 0; const wrongs = [];
  const step = () => {
    if (i >= qs.length) return end();
    const { w, opts } = qs[i], card = el("div", "card"), bar = el("div", "bar"), fill = el("i");
    fill.style.width = (i / qs.length * 100) + "%"; bar.append(fill);
    const top = el("div", "row"); top.append(el("span", "dim small grow", t("qOf", i + 1, qs.length)), el("span", "pill", score));
    const og = el("div", "opts"); let locked = false;
    opts.forEach((o) => {
      const b = el("button", "", o);
      b.onclick = () => {
        if (locked) return; locked = true;
        const ok = o === w.eng; if (ok) score++; else wrongs.push(w);
        [...og.children].forEach((x) => { if (x.textContent === w.eng) x.classList.add("ok"); else if (x === b) x.classList.add("no"); });
        setTimeout(() => { i++; step(); }, ok ? 700 : 1500);
      };
      og.append(b);
    });
    top.style.marginBottom = "8px";
    card.append(top, bar, el("div", "qword", w.tr), og);
    area.replaceChildren(card);
  };
  const end = () => {
    const card = el("div", "card"), pct = Math.round(score / qs.length * 100), r = el("div", "row");
    card.append(el("h2", "", t("result", score, qs.length)), el("p", "dim", pct + "%")); r.style.marginTop = "16px";
    const engs = [...new Set(V.words.map((x) => x.eng))];
    if (wrongs.length) {
      const b = el("button", "primary", t("retryWrong", wrongs.length));
      b.onclick = () => runQuiz(area, setup, shuf(wrongs).map((w) => mkQ(w, engs))); r.append(b);
    }
    const again = el("button", "", t("again")); again.onclick = () => { area.replaceChildren(); setup.classList.remove("hide"); }; r.append(again);
    card.append(r);
    if (wrongs.length) {
      const l = el("div", "list"); l.style.marginTop = "16px";
      wrongs.forEach((w) => { const li = el("div", "li"); li.append(el("span", "t", w.tr), el("span", "grow dim", w.eng)); l.append(li); });
      card.append(l);
    }
    area.replaceChildren(card);
  };
  step();
}

/* ---------- Düello ---------- */
let DUEL_EP = "";
function tDuel() {
  const box = el("div");
  box.append(head(t("nav_duel"), t("duelSub")));
  const g = el("div", "grid2"), f = (l, x) => { const w = el("label", "f"); w.append(el("span", "", l), x); return w; };
  // odaya gir
  const j = el("div", "card"), code = el("input"), pw = el("input"), jb = el("button", "primary", t("join"));
  code.placeholder = "0000"; code.inputMode = "numeric"; code.maxLength = 4; code.style.cssText = "font:800 28px var(--display);letter-spacing:.3em;text-align:center";
  pw.placeholder = t("roomPwJoin"); pw.maxLength = 30;
  jb.onclick = () => { if (!/^\d{4}$/.test(code.value.trim())) return toast(t("codeHint")); goDuel({ t: "join", code: code.value.trim(), password: pw.value }); };
  code.onkeydown = (e) => { if (e.key === "Enter") jb.click(); };
  const jf = el("div"); jf.style.cssText = "display:grid;gap:10px;margin-top:14px"; jf.append(code, pw, jb);
  j.append(el("h2", "", t("joinRoom")), el("p", "dim", t("joinSub")), jf);
  // oda kur
  const c = el("div", "card"), src = el("select"), n = el("input"), s = el("input"), cpw = el("input"), cb = el("button", "primary", t("createRoom"));
  src.append(new Option(t("allWords") + " · " + uniqWords().length, ""));
  VIDS.filter((v) => v.count >= 4).forEach((v) => src.append(new Option((v.episode || t("noVideo")) + " · " + v.count, v.episode || "\u0000")));
  src.value = VIDS.some((v) => (v.episode || "") === DUEL_EP && v.count >= 4) ? (DUEL_EP || "\u0000") : "";
  n.type = s.type = "number"; n.min = 4; n.max = 30; n.value = 10; s.min = 5; s.max = 60; s.value = 12; cpw.placeholder = t("roomPwCreate"); cpw.maxLength = 30;
  const r2 = el("div", "row"), fn = f(t("questions"), n), fs = f(t("seconds"), s); fn.style.flex = fs.style.flex = "1"; r2.append(fn, fs); r2.style.alignItems = "flex-start";
  cb.disabled = uniqWords().length < 4;
  cb.onclick = () => goDuel({ t: "create", src: PAIR.src, dst: PAIR.dst, episode: src.value === "\u0000" ? "" : src.value, n: +n.value, seconds: +s.value, password: cpw.value });
  const cf = el("div"); cf.style.marginTop = "14px"; cf.append(f(t("source"), src), r2, f(t("roomPwCreateLabel"), cpw), cb);
  c.append(el("h2", "", t("createRoom")), el("p", "dim", cb.disabled ? t("needWordsText") : t("createSub", langName(PAIR.src), langName(PAIR.dst))), cf);
  g.append(j, c); box.append(g, leaderboard());
  return box;
}
function goDuel(msg) { try { sessionStorage.setItem("cv-duel", JSON.stringify(msg)); } catch (e) {} location.href = "/game"; }

function leaderboard() {
  const card = el("div", "card"), ctrl = el("div", "row"), list = el("div");
  card.style.marginTop = "16px";
  const seg = (items, cur, set) => { const s = el("div", "seg"); items.forEach(([l, v]) => { const b = el("button", cur === v ? "on" : "", l); b.onclick = () => { set(v); render(); }; s.append(b); }); return s; };
  ctrl.append(el("h2", "grow", t("leaderboard")),
    seg([[t("week"), "week"], [t("month"), "month"], [t("year"), "year"], [t("all"), "all"]], LBP, (v) => (LBP = v)),
    seg([[t("people"), "people"], [t("countries"), "country"]], LBS, (v) => (LBS = v)));
  card.append(ctrl, list); list.style.marginTop = "10px";
  api("/api/leaderboard?period=" + LBP + "&by=" + LBS).then((rows) => {
    if (!rows.length) return list.replaceChildren(el("p", "dim", t("noScores")));
    const ul = el("ul", "players");
    rows.forEach((r, i) => {
      const li = el("li"), nm = el("span", "nm", LBS === "country" ? flag(r.country) + countryName(r.country) : flag(r.country) + r.username);
      if (LBS !== "country" && r.username === me.username) nm.append(el("span", "tag", t("you")));
      li.append(el("span", "rk", i + 1), nm, el("span", "dim small", LBS === "country" ? t("playersN", r.players) : t("winsN", r.wins)), el("b", "", r.score));
      ul.append(li);
    });
    list.replaceChildren(ul);
  }).catch(() => {});
  return card;
}

/* ---------- Ayarlar ---------- */
function tSettings() {
  const box = el("div");
  box.append(head(t("nav_settings"), me.username));
  const g = el("div", "grid2"), f = (l, x) => { const w = el("label", "f"); w.append(el("span", "", l), x); return w; };
  // profil
  const p = el("div", "card"), name = el("input"), cc = el("select"), save = el("button", "primary", t("save")), err = el("p", "err");
  name.value = me.username; name.maxLength = 16;
  cc.append(new Option("—", ""));
  COUNTRY_CODES.map((c) => [c, countryName(c)]).sort((a, b) => a[1].localeCompare(b[1], I18N.lang)).forEach(([c, n]) => cc.append(new Option(flag(c) + n, c)));
  cc.value = me.country || "";
  save.onclick = async () => { try { await api("/api/settings", { username: name.value.trim(), country: cc.value, avatar: "" }); me = await api("/api/me"); toast(t("saved")); render(); } catch (e) { err.textContent = e.message; } };
  const h = el("h2", "", t("profile")); h.style.marginBottom = "14px";
  p.append(h, f(t("username"), name), f(t("country"), cc), save, err);
  // eklenti
  const x = el("div", "card"), key = el("code"), gen = el("button", "primary", t("genKey")), cp = el("button", "hide", t("copy"));
  key.style.cssText = "display:block;word-break:break-all;padding:10px;background:var(--bg2);border-radius:8px;margin:12px 0;font-size:13px";
  key.textContent = t("keyHint");
  gen.onclick = async () => { const k = (await api("/api/ext-key", {})).key; key.textContent = k; cp.classList.remove("hide"); cp.onclick = () => { navigator.clipboard.writeText(k).then(() => toast(t("copied"))); }; };
  const steps = el("ol", "dim small"); steps.style.cssText = "margin:14px 0 0;padding-left:18px;line-height:1.7";
  ["ext1", "ext2", "ext3"].forEach((k) => steps.append(el("li", "", t(k))));
  const r = el("div", "row"); r.append(gen, cp);
  x.append(el("h2", "", t("extension")), el("p", "dim", t("extSub")), key, r, steps);
  // hesap
  const a = el("div", "card"), out = el("button", "", t("logout")), del = el("button", "danger", t("deleteAccount"));
  out.onclick = async () => { await api("/api/logout", {}); me = null; authView(); };
  del.onclick = () => {
    const m = el("div", "modal"), c = el("div", "card"), pw = el("input"), e = el("p", "err"), ok = el("button", "danger", t("deleteAccount")), no = el("button", "", t("cancel"));
    pw.type = "password"; pw.placeholder = t("password");
    ok.onclick = async () => { try { await api("/api/delete-account", { password: pw.value }); m.remove(); me = null; toast(t("accountDeleted")); authView(); } catch (er) { e.textContent = er.message; } };
    no.onclick = () => m.remove(); const rr = el("div", "row"); rr.append(ok, no);
    pw.style.marginTop = "14px"; c.append(el("h2", "", t("deleteAccount")), el("p", "dim", t("deleteAccountSub")), pw, e, rr); m.append(c); document.body.append(m); pw.focus();
  };
  const rr = el("div", "row"); rr.style.marginTop = "14px"; rr.append(out, del);
  a.append(el("h2", "", t("account")), el("p", "dim", t("accountSub")), rr); a.style.marginTop = "16px";
  g.append(p, x); box.append(g, a);
  return box;
}

I18N.onChange(() => { mountTools(document.getElementById("tools")); me ? render() : authView(); });
mountTools(document.getElementById("tools"));
boot();
