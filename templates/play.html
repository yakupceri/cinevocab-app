<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineVocab Düello</title>
<style>
  :root { --bg:#07080b; --panel:#14161c; --line:#262a33; --ink:#f4f3ee; --dim:#8b909c; --ok:#5fd1b0; --bad:#e5736b; }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Helvetica Neue", Arial, sans-serif;
         display: flex; justify-content: center; align-items: center; padding: 24px; }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 28px; margin: 0 0 24px; }
  h2 { font-size: clamp(38px, 9vw, 64px); text-align: center; margin: 32px 0 40px; word-break: break-word; }
  label { display: block; color: var(--dim); font-size: 14px; margin: 18px 0 6px; }
  input, select, button { font: inherit; font-size: 17px; color: var(--ink); background: var(--panel);
         border: 1px solid var(--line); border-radius: 6px; padding: 14px; width: 100%; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--dim); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button.go { background: var(--ink); color: var(--bg); font-weight: 700; margin-top: 18px; }
  button.ok { border-color: var(--ok); color: var(--ok); }
  button.bad { border-color: var(--bad); color: var(--bad); }
  button.pick { border-color: var(--ink); }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .top { display: flex; justify-content: space-between; color: var(--dim); font-size: 15px; margin-bottom: 8px; }
  .bar { height: 3px; background: var(--line); } .bar i { display: block; height: 100%; width: 100%; background: var(--ink); }
  .code { font-size: 72px; font-weight: 700; letter-spacing: .12em; text-align: center; margin: 8px 0; }
  .msg { color: var(--dim); text-align: center; line-height: 1.6; }
  .err { color: var(--bad); text-align: center; min-height: 24px; margin-top: 14px; }
  ul { list-style: none; padding: 0; margin: 20px 0; border-top: 1px solid var(--line); }
  li { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
  li b { font-variant-numeric: tabular-nums; } li .d { color: var(--ok); margin-left: 8px; }
  @media (max-width: 480px) { .opts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
const app = document.getElementById("app");
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const field = (label, node) => { const w = el("div"); w.append(el("label", "", label), node); return w; };

let ws, myId = "", room = null, chosen = null, errBox = el("div", "err");
let name = localStorage.getItem("cv-name") || "";

function connect(first) {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => ws.send(JSON.stringify(first));
  ws.onmessage = (e) => handle(JSON.parse(e.data));
  ws.onclose = () => { if (room) { room = null; home("Bağlantı koptu."); } };
}
const send = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

async function home(error) {
  room = null;
  const nameIn = el("input"); nameIn.placeholder = "Adın"; nameIn.value = name; nameIn.maxLength = 16;
  const sel = el("select");
  let eps = [];
  try { eps = await (await fetch("/episodes")).json(); } catch (e) {}
  if (!eps.length) sel.append(new Option("Henüz bölüm yok", ""));
  eps.forEach((x) => sel.append(new Option(`${x.episode} (${x.word_count} kelime)`, x.episode)));
  const create = el("button", "go", "Oda kur");
  create.onclick = () => { name = nameIn.value.trim() || "Oyuncu"; localStorage.setItem("cv-name", name);
    if (sel.value) connect({ t: "create", name, episode: sel.value }); };
  const codeIn = el("input"); codeIn.placeholder = "4 haneli kod"; codeIn.inputMode = "numeric"; codeIn.maxLength = 4;
  const join = el("button", "", "Katıl");
  join.onclick = () => { name = nameIn.value.trim() || "Oyuncu"; localStorage.setItem("cv-name", name);
    connect({ t: "join", name, code: codeIn.value.trim() }); };
  errBox.textContent = error || "";
  const jr = el("div", "row"); jr.append(codeIn, join);
  app.replaceChildren(el("h1", "", "CineVocab Düello"), field("Adın", nameIn),
    field("Bölüm", sel), create, field("Ya da bir odaya katıl", jr), errBox);
}

const board = (rows, delta) => { const ul = el("ul");
  rows.forEach((p) => { const li = el("li"); li.append(el("span", "", p.name + (p.id === myId ? " (sen)" : "")));
    const r = el("span"); const b = el("b", "", String(p.score)); r.append(b);
    if (delta && p.delta !== undefined) r.append(el("span", "d", p.ok ? `+${p.delta}` : "✗"));
    li.append(r); ul.append(li); }); return ul; };

function lobby(info) {
  const start = el("button", "go", "Başlat");
  start.onclick = () => send({ t: "start" });
  const nodes = [el("p", "msg", info.episode), el("div", "code", info.code),
    el("p", "msg", "Bu kodu diğer oyuncuya ver."), board(info.players)];
  nodes.push(info.host === myId ? start : el("p", "msg", "Oda sahibinin başlatması bekleniyor…"));
  errBox.textContent = ""; nodes.push(errBox);
  app.replaceChildren(...nodes);
}

function handle(m) {
  if (m.t === "me") myId = m.id;
  else if (m.t === "room") { room = m; lobby(m); }
  else if (m.t === "error") { if (room) errBox.textContent = m.msg; else { ws.close(); home(m.msg); } }
  else if (m.t === "question") question(m);
  else if (m.t === "reveal") reveal(m);
  else if (m.t === "end") finish(m);
}

function question(m) {
  chosen = null;
  const top = el("div", "top"); top.append(el("span", "", `${m.idx + 1} / ${m.total}`), el("span", "", "Hızlı cevap = bonus puan"));
  const bar = el("div", "bar"), fill = el("i"); bar.append(fill);
  const grid = el("div", "opts");
  m.options.forEach((o, i) => { const b = el("button", "", `${i + 1}  ${o}`);
    b.onclick = () => pick(b, o, grid); grid.append(b); });
  app.replaceChildren(top, bar, el("h2", "", m.tr), grid);
  fill.style.transition = `width ${m.seconds}s linear`;
  requestAnimationFrame(() => requestAnimationFrame(() => (fill.style.width = "0%")));
}

function pick(btn, opt, grid) {
  if (chosen !== null) return;
  chosen = opt; btn.classList.add("pick");
  grid.querySelectorAll("button").forEach((b) => (b.disabled = true));
  send({ t: "answer", choice: opt });
}

function reveal(m) {
  app.querySelectorAll(".opts button").forEach((b) => {
    b.disabled = true; const t = b.textContent.slice(3);
    if (t === m.correct) b.classList.add("ok"); else if (t === chosen) b.classList.add("bad");
  });
  app.append(board(m.results, true));
}

function finish(m) {
  const top = m.scores[0], tie = m.scores.length > 1 && m.scores[1].score === top.score;
  const again = el("button", "go", "Tekrar oyna");
  again.onclick = () => { if (room && room.host === myId) send({ t: "start" }); };
  const leave = el("button", "", "Çık"); leave.onclick = () => { room = null; ws.close(); home(); };
  app.replaceChildren(el("h1", "", tie ? "Berabere!" : `${top.name} kazandı!`), board(m.scores),
    room && room.host === myId ? again : el("p", "msg", "Oda sahibi yeni oyun başlatabilir."), leave);
}

document.addEventListener("keydown", (e) => {
  const n = parseInt(e.key, 10), btns = app.querySelectorAll(".opts button");
  if (n >= 1 && n <= btns.length && !btns[n - 1].disabled) btns[n - 1].click();
});

home();
</script>
</body>
</html>
