<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<title>CineVocab · Yönetim</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0d0d0c; --bg2:#121210; --panel:#171715; --panel2:#1f1f1c; --ink:#f3efe6; --dim:#a8a296; --faint:#8f897d;
    --line:rgba(243,239,230,.10); --line2:rgba(243,239,230,.20);
    --accent:#ffd42b; --accent-ink:#171400;
    --c-site:#5cc8e8; --c-ext:#62d394; --c-click:#ff7a45; --c-reg:#ffd42b; --c-anon:#a99cff; --c-mute:#6f6a60;
    --ok:#62d394; --bad:#ff6b5b; --warn:#ffd42b;
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: #3a3833 transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { margin:0; font-weight:700; letter-spacing:-.01em; }
  h3 { font-size:15px; }
  button, input, select { font:inherit; color:inherit; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
  input::placeholder { color:var(--faint); }
  button { cursor:pointer; transition:border-color .15s, background .15s, color .15s; }
  button:hover { border-color:var(--line2); }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700; }
  button.danger { border-color:rgba(255,107,91,.5); color:var(--bad); } button.danger:hover { background:var(--bad); border-color:var(--bad); color:#1a0502; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .hide { display:none !important; }
  .dim { color:var(--dim); } .faint { color:var(--faint); }
  .err { color:var(--bad); min-height:18px; margin-top:8px; }
  a { color:var(--accent); }

  /* ---- giriş ---- */
  #login { max-width:360px; margin:13vh auto; padding:28px; background:var(--panel); border:1px solid var(--line); border-radius:18px; }
  #login .logo { margin-bottom:14px; }
  #login input { width:100%; margin-top:10px; } #login button { width:100%; margin-top:14px; padding:10px; }

  /* ---- iskelet: solda menü, sağda içerik ---- */
  #app { display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh; }
  #side { position:sticky; top:0; height:100vh; overflow:auto; background:var(--bg2); border-right:1px solid var(--line); padding:18px 12px; }
  .brand { display:flex; align-items:center; gap:10px; padding:2px 10px 12px; }
  .logo { width:32px; height:32px; border-radius:10px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:900; font-size:16px; flex:none; }
  .brand b { display:block; font-size:15px; line-height:1.2; } .brand small { color:var(--dim); font-size:11px; }
  .grp { font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); padding:16px 10px 5px; }
  #nav button { display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; background:transparent; border-radius:10px; padding:9px 10px; color:var(--dim); }
  #nav button:hover { background:rgba(255,255,255,.05); color:var(--ink); }
  #nav button.on { background:rgba(255,212,43,.13); color:var(--accent); font-weight:700; }
  #nav svg { width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #content { min-width:0; }
  .top { display:flex; align-items:center; gap:14px; padding:18px 28px 6px; flex-wrap:wrap; }
  .top h1 { font-size:24px; } .top p { margin:2px 0 0; color:var(--dim); }
  .top .grow { flex:1; min-width:200px; }
  #clock { font-size:12px; color:var(--dim); border:1px solid var(--line); border-radius:99px; padding:5px 11px; white-space:nowrap; }
  main { padding:12px 28px 48px; max-width:1240px; }

  /* ---- ortak parçalar ---- */
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px; }
  .panel > h3:first-child { margin-bottom:2px; }
  .hint { color:var(--dim); font-size:12px; margin:10px 0 0; }
  .sub { color:var(--dim); font-size:12px; margin:2px 0 0; }
  .grid2 > * { min-width:0; }
  .grid2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; } .grid2 > .panel { margin-bottom:0; } .grid2 { margin-bottom:16px; }
  @media (max-width:980px){ .grid2 { grid-template-columns:minmax(0,1fr); } .grid2 > .panel { margin-bottom:0; } }
  .bar { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; } .bar input { flex:1; min-width:180px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .seg { display:inline-flex; background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:3px; gap:2px; }
  .seg button { border:0; border-radius:8px; background:transparent; padding:6px 14px; color:var(--dim); }
  .seg button.on { background:var(--accent); color:var(--accent-ink); font-weight:700; }
  .tag { display:inline-block; padding:1px 9px; border-radius:99px; font-size:12px; border:1px solid var(--line); white-space:nowrap; }
  .tag.bad { color:var(--bad); border-color:rgba(255,107,91,.5); } .tag.warn { color:var(--warn); border-color:rgba(255,212,43,.5); } .tag.ok { color:var(--ok); border-color:rgba(98,211,148,.5); }
  .note { padding:11px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel); margin-bottom:8px; }
  .note.bad { border-color:rgba(255,107,91,.6); } .note.warn { border-color:rgba(255,212,43,.6); } .note.ok { border-color:rgba(98,211,148,.6); }
  .empty { color:var(--dim); padding:14px 0; }
  .dev { white-space:nowrap; }

  /* ---- tablolar ---- */
  .wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .panel table { background:transparent; border:0; border-radius:0; }
  th,td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td { border-bottom:0; }
  th { color:var(--dim); font-weight:600; font-size:12px; background:rgba(255,255,255,.02); }
  tr.click { cursor:pointer; } tr.click:hover td { background:rgba(255,255,255,.04); } tr.click:focus-visible { outline-offset:-2px; }
  .panel td { overflow-wrap:anywhere; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }

  /* ---- sayı kartları ---- */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:16px; }
  .kpi { position:relative; overflow:hidden; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px 16px 0; min-height:132px; display:flex; flex-direction:column; }
  .kpi::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c, var(--accent)); }
  .k-lab { color:var(--dim); font-size:12.5px; }
  .k-val { font-size:34px; line-height:1.15; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin-top:4px; }
  .k-sub { color:var(--dim); font-size:12px; margin-top:2px; } .k-sub b { color:var(--ink); font-weight:600; }
  .k-spark { display:block; width:calc(100% + 32px); height:34px; margin:auto -16px 0; }
  .k-spark path.a { fill:var(--c, var(--accent)); fill-opacity:.14; } .k-spark path.l { fill:none; stroke:var(--c, var(--accent)); stroke-width:1.6; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .kpi.nospark { padding-bottom:14px; min-height:0; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .card b { display:block; font-size:28px; font-weight:800; letter-spacing:-.02em; } .card span { color:var(--dim); font-size:12px; }

  /* ---- grafikler ---- */
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 4px; }
  .chip { display:inline-flex; align-items:center; gap:8px; border-radius:99px; padding:5px 12px 5px 10px; font-size:12.5px; background:transparent; color:var(--dim); }
  .chip i { width:10px; height:10px; border-radius:3px; background:var(--c); border:2px solid var(--c); flex:none; }
  .chip b { color:var(--ink); font-variant-numeric:tabular-nums; font-weight:600; }
  .chip.on { background:rgba(255,255,255,.05); border-color:var(--line2); color:var(--ink); }
  .chip:not(.on) i { background:transparent; } .chip:not(.on) b { color:var(--faint); }
  .chart { position:relative; width:100%; min-width:0; margin-top:6px; }
  .chart svg { display:block; overflow:visible; }
  .chart .grid { stroke:var(--line); stroke-width:1; shape-rendering:crispEdges; }
  .chart .grid.zero { stroke:var(--line2); }
  .chart text { fill:var(--dim); font-size:11px; }
  .chart .ln { fill:none; stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round; }
  .chart .area { fill-opacity:.09; stroke:none; }
  .chart .guide { stroke:var(--line2); stroke-width:1; stroke-dasharray:3 3; }
  .chart .dot { stroke:var(--panel); stroke-width:2; }
  .chart .nodata { fill:var(--dim); font-size:13px; text-anchor:middle; }
  .tip { position:absolute; top:6px; z-index:3; pointer-events:none; min-width:150px; background:#0a0a09; border:1px solid var(--line2); border-radius:11px; padding:9px 11px; font-size:12px; box-shadow:0 8px 24px rgba(0,0,0,.45); }
  .tip > b { display:block; margin-bottom:5px; }
  .tip div { display:flex; align-items:center; gap:7px; padding:1px 0; } .tip div i { width:9px; height:9px; border-radius:3px; flex:none; } .tip div b { margin-left:auto; padding-left:14px; font-variant-numeric:tabular-nums; }
  .donut { display:flex; align-items:center; gap:22px; flex-wrap:wrap; margin-top:12px; }
  .donut svg { width:140px; height:140px; flex:none; } .donut .t1 { fill:var(--ink); font:800 24px ui-sans-serif,system-ui,sans-serif; text-anchor:middle; } .donut .t2 { fill:var(--dim); font:11px ui-sans-serif,system-ui,sans-serif; text-anchor:middle; }
  .donut ul { list-style:none; margin:0; padding:0; flex:1; min-width:170px; } .donut li { display:flex; gap:9px; align-items:center; padding:5px 0; border-bottom:1px solid var(--line); } .donut li:last-child { border-bottom:0; }
  .donut li i { width:11px; height:11px; border-radius:3px; flex:none; } .donut li b { margin-left:auto; font-variant-numeric:tabular-nums; } .donut li small { color:var(--dim); width:42px; text-align:right; }
  .hb { margin-top:12px; }
  .hbr { display:grid; grid-template-columns:minmax(100px,190px) 1fr 92px; gap:4px 12px; align-items:center; padding:7px 0; }
  .hbr .lab { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .hbr .lab small { display:block; color:var(--dim); font-size:11px; white-space:normal; line-height:1.35; }
  .hbr .track { height:14px; background:rgba(255,255,255,.05); border-radius:99px; overflow:hidden; display:flex; } .hbr .track i { display:block; height:100%; }
  .hbr .track i:first-child { border-radius:99px 0 0 99px; }
  .hbr b { text-align:right; font-variant-numeric:tabular-nums; min-width:34px; } .hbr b small { color:var(--dim); font-weight:400; margin-left:6px; }
  .meter { display:flex; height:10px; border-radius:99px; overflow:hidden; background:rgba(255,255,255,.05); margin-top:12px; } .meter i { display:block; height:100%; }
  .keys { display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; font-size:12px; color:var(--dim); }
  .key i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:6px; vertical-align:-1px; background:var(--c); }
  .tag.s-click { color:var(--c-click); border-color:rgba(255,122,69,.5); } .tag.s-site { color:var(--c-site); border-color:rgba(92,200,232,.5); } .tag.s-ext { color:var(--c-ext); border-color:rgba(98,211,148,.5); }
  .today { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 26px; background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:16px; padding:14px 18px; margin-bottom:12px; }
  .today > b { font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); }
  .today span { color:var(--dim); } .today span b { color:var(--ink); font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; margin-right:5px; letter-spacing:-.01em; }
  .dt { margin-top:10px; color:var(--dim); } .dt summary { cursor:pointer; padding:4px 0; } .dt summary:hover { color:var(--ink); } .dt table { margin-top:8px; }
  .meter-l { display:flex; justify-content:space-between; gap:10px; font-size:12px; color:var(--dim); margin-top:6px; flex-wrap:wrap; } .meter-l b { color:var(--ink); }
  .fun { display:grid; grid-template-columns:minmax(120px,200px) 1fr 96px; gap:8px 12px; align-items:center; margin-top:12px; }
  .fun i { display:block; height:16px; border-radius:99px; background:var(--accent); min-width:3px; }
  .fun b { text-align:right; font-variant-numeric:tabular-nums; } .fun small { color:var(--dim); font-weight:400; }

  #toast { max-width:calc(100vw - 28px); position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#000; border:1px solid var(--accent); padding:10px 18px; border-radius:12px; z-index:9; }

  /* ---- telefon ---- */
  @media (max-width:860px){
    #app { grid-template-columns:1fr; }
    #side { position:sticky; z-index:6; height:auto; padding:8px 10px; border-right:0; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
    .brand { padding:0; } .brand small, .grp { display:none; }
    #nav { display:flex; gap:4px; overflow-x:auto; flex:1; padding:4px; } #nav button { width:auto; white-space:nowrap; flex:none; padding:8px 11px; }
    .top { padding:14px 14px 4px; } .top h1 { font-size:21px; } main { padding:10px 14px 40px; }
    .panel { padding:14px; } th,td { padding:8px 8px; font-size:13px; }
    .k-val { font-size:30px; } .kpis { grid-template-columns:repeat(2,1fr); gap:10px; }
    .kpi:last-child:nth-child(odd) { grid-column:1 / -1; }
    .today span b { font-size:19px; }
    .hbr { grid-template-columns:1fr 92px; } .hbr .track { grid-column:1 / -1; grid-row:2; }
    .wrap td { white-space:nowrap; }
  }
  @media (prefers-reduced-motion: reduce){ * { transition:none !important; } }
</style>
</head>
<body>

<div id="login" class="hide">
  <div class="logo">C</div>
  <h2>Yönetim girişi</h2>
  <form id="lf" autocomplete="on">
    <input id="lu" name="username" aria-label="Kullanıcı adı" placeholder="Kullanıcı adı" autocomplete="username" required>
    <input id="lp" name="password" type="password" aria-label="Parola" placeholder="Parola" autocomplete="current-password" required>
    <button class="primary" type="submit">Giriş</button>
  </form>
  <div class="err" id="lerr" role="alert"></div>
</div>

<div id="app" class="hide">
  <aside id="side">
    <div class="brand"><div class="logo">C</div><div><b>CineVocab</b><small>Yönetim paneli</small></div></div>
    <nav id="nav" aria-label="Bölümler"></nav>
  </aside>
  <div id="content">
    <header class="top">
      <div class="grow"><h1 id="title"></h1><p id="subtitle"></p></div>
      <span id="clock" title="Panelde tüm saatler İstanbul saatidir"></span>
      <button id="out">Çıkış</button>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="toast" class="hide" role="status"></div>

<script>
"use strict";
// ---------- yardımcılar (veriler textContent ile basılır: XSS yok) ----------
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  put(e, kids);
  return e;
}
// İç içe diziler ve boş (null) değerler güvenle eklenir
function put(e, ...kids) { for (const c of kids.flat(Infinity)) if (c != null && c !== "") e.append(c.nodeType ? c : document.createTextNode(String(c))); }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.remove("hide"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hide"), 2800); }
async function api(path, method = "GET", body) {
  const seq = openTab.seq;
  const r = await fetch("/admin/api" + path, { method, credentials: "same-origin",
    headers: { "Content-Type": "application/json", "X-Admin": "1" }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (method === "GET" && seq !== openTab.seq) { const e = new Error("eski sekme"); e.stale = true; throw e; }
  if (r.status === 401 && path !== "/login") { showLogin(); throw new Error("Oturum bitti"); }
  if (!r.ok) throw new Error(d.detail || "HTTP " + r.status);
  return d;
}
async function act(fn, okMsg) { try { await fn(); toast(okMsg || "Tamam"); } catch (e) { toast("⚠ " + e.message); } }
const showUser = (id) => userDetail(id).catch((e) => toast("⚠ " + e.message));
const rowLink = (fn) => ({ class: "click", tabindex: "0", role: "link", onclick: fn, onkeydown: (e) => { if (e.key === "Enter") { e.preventDefault(); fn(); } } });
const status = (u) => u.ban ? h("span", { class: "tag bad" }, "BANLI · " + u.ban)
  : u.game_ban ? h("span", { class: "tag warn" }, "oyun yasağı · " + u.game_ban) : h("span", { class: "tag ok" }, "normal");
const store = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* özel pencere */ } } };

// ---------- giriş ----------
function showLogin() { $("app").classList.add("hide"); $("login").classList.remove("hide"); }
$("lf").addEventListener("submit", async (e) => {
  e.preventDefault(); $("lerr").textContent = "";
  try { await api("/login", "POST", { username: $("lu").value, password: $("lp").value }); $("lp").value = ""; start(); }
  catch (er) { $("lerr").textContent = er.message; }
});
$("out").onclick = async () => { await api("/logout", "POST").catch(() => {}); showLogin(); };

// ---------- sekmeler (soldaki menü) ----------
openTab.seq = 0; api.seq = 0;
const TABS = { "Ziyaretçiler": viewTraffic, "Özet": viewStats, "Huni": viewFunnel, "Kullanıcılar": viewUsers, "Davetler": viewRefs, "Odalar": viewRooms,
  "Sağlık": viewHealth, "Kelimeler": viewWords, "Veri talepleri": viewData, "Sistem": viewSystem, "Günlük": viewLog };
const NAV = [["Trafik ve büyüme", ["Ziyaretçiler", "Özet", "Huni"]], ["İnsanlar", ["Kullanıcılar", "Davetler", "Odalar"]],
  ["Ürün", ["Sağlık", "Kelimeler"]], ["Yönetim", ["Veri talepleri", "Sistem", "Günlük"]]];
const SUB = { "Ziyaretçiler": "Siteye ve eklentiye kimler, nereden, hangi cihazla, saat kaçta giriyor.", "Özet": "Hesaplar, çeviri istekleri ve en çok kullanılan içerikler.",
  "Huni": "Kayıt olanların ne kadarı kelime kaydedip geri geliyor.", "Kullanıcılar": "Hesap ara, ayrıntıya gir, gerekirse işlem yap.", "Davetler": "Arkadaş davetiyle kayıt olanlar.",
  "Odalar": "Şu an açık düello odaları.", "Sağlık": "Eklenti düzgün çalışıyor mu: toplu sayılar, kimsenin kelimesi görünmez.", "Kelimeler": "Yanlış çevirileri düzelt ya da sil.",
  "Veri talepleri": "\"Verimi ver\" ve \"verimi sil\" istekleri.", "Sistem": "Çeviri servislerinin durumu.", "Günlük": "Yönetim işlemleri kaydı." };
const ICON = { "Ziyaretçiler": "M3 3v18h18M7 15l4-5 3 3 5-6", "Özet": "M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z", "Huni": "M3 4h18l-7 8v7l-4 2v-9z",
  "Kullanıcılar": "M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0", "Davetler": "M4 6h16v12H4zM4 7l8 6 8-6", "Odalar": "M5 21V4h10v17M15 8h4v13M11 12h.01",
  "Sağlık": "M3 12h4l2-5 4 10 2-5h6", "Kelimeler": "M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3zM5 17a3 3 0 013-3h11", "Veri talepleri": "M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z",
  "Sistem": "M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6", "Günlük": "M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" };

function niceMax(v) {

  return Math.ceil(need) * 4;
}

// ---------- Ziyaretçiler: kimler, nereden, hangi cihazdan, saat kaçta ----------
// Ülke satırları: "dil:xx" ve "?" tek "Ülke bilinmiyor" satırında toplanır (ilk 10 satırı boşa harcamasın)
function countryRows(list) {
  const known = [], unk = { site: 0, ext: 0, clicks: 0, langs: Object.create(null) };
  for (const r of list) {
    if (isCountry(r.country)) { known.push(r); continue; }
    unk.site += r.site; unk.ext += r.ext; unk.clicks += r.clicks;
    const k = r.country && r.country.startsWith("dil:") ? langName(r.country.slice(4)) : "dil bilgisi yok";
    unk.langs[k] = (unk.langs[k] || 0) + r.site + r.ext + r.clicks;
  }
  const tot = (r) => r.site + r.ext + r.clicks, all = known.reduce((a, r) => a + tot(r), 0) + tot(unk);
  const mk = (label, r, sub) => ({ label, total: tot(r), pct: pct(tot(r), all), sub,
    parts: [[r.clicks, C.click, "Tıklama: " + r.clicks], [r.site, C.site, "Site: " + r.site], [r.ext, C.ext, "Eklenti: " + r.ext]] });
  const detail = (r) => [r.clicks ? r.clicks + " tıklama" : "", r.site ? r.site + " site" : "", r.ext ? r.ext + " eklenti" : ""].filter(Boolean).join(" · ");
  const rows = known.sort((a, b) => tot(b) - tot(a)).map((r) => mk(countryLabel(r.country), r, detail(r)));
  const unkTot = tot(unk);
  if (unkTot) rows.push(mk("🌐 Ülke bilinmiyor", unk, Object.entries(unk.langs).sort((a, b) => b[1] - a[1]).map(([k, n]) => k + " " + n).join(" · ")));
  return { rows, known: all - unkTot, unknown: unkTot, all };

function period(name, value, options) {
  const sel = h("select", { "aria-label": "Zaman aralığı" }, options.map((d) => h("option", { value: d }, "Son " + d + " gün")));
  sel.value = value;
  sel.addEventListener("change", () => { period[name] = Number(sel.value); go(name); });
  return sel;
}

  const dayLabel = (x) => (/^\d{4}-\d\d-\d\d/.test(String(x)) ? String(x).slice(8, 10) + "." + String(x).slice(5, 7) : String(x));

      h("p", { class: "hint" }, "Tıklamalar mağazaya gider; tıklayanla kayıt olan aynı kişi olarak eşleştirilemez, o yüzden ilk iki satır yalnızca yan yana durur."),
      h("p", {}, "7 gün sonra hâlâ aktif: ", h("b", {}, (s.kept7 || 0) + " / " + (s.old7 || 0)), h("span", { class: "dim" }, " (en az 7 gün önce kayıt olanlar içinde)"))),
    h("div", { class: "grid2" },
      h("div", { class: "panel" }, h("h3", {}, "Günlük aktif hesap"), h("p", { class: "sub" }, "Son 14 gün · kelime kaydeden ya da pratik yapan hesaplar"),
        trendChart(d.dau.map((x) => ({ day: dayLabel(x.day), n: x.n })), [{ key: "n", label: "Aktif hesap", color: C.ext }], { type: "cols", height: 200, legend: false, label: "Günlük aktif hesap" }),
        h("p", { class: "hint" }, "Hesapsız kullanım Özet'teki istek sayacında.")),
      small("Giriş yöntemi", d.methods),
      small("Hesap nerede açıldı", d.via),
      h("div", { class: "panel" }, h("h3", {}, "Arkadaş davetiyle gelen"), h("div", { class: "cards", style: "margin-top:10px" }, h("div", { class: "card" }, h("b", {}, d.invited), h("span", {}, "kişi (bu dönem)"))),
        h("p", { class: "hint" }, "Hangi linkten geldiği kişi bazında bilinemez: mağaza bu bilgiyi aktarmaz. Link sayıları Ziyaretçiler sekmesinde.")),
      small("Ülke (kullanıcının profilde seçtiği, tüm hesaplar)", d.countries)),
    h("div", { class: "panel" }, h("h3", {}, "Hafta hafta"),
      tbl(["Kayıt haftası", "Kayıt", "İlk kelime", "20+ kelime", "Pratik", "Geri geldi", "7 gün sonra aktif"],
        d.cohorts.map((c) => [c.week, c.signups, c.word1, c.word20, c.practiced, c.returned, c.old7 ? c.kept7 + " / " + c.old7 : "—"]))));
}

// ---------- Veri talepleri: "verimi ver" / "verimi sil" ----------
function download(name, obj) {
  const a = h("a", { href: URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" })), download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function viewData() {
  const v = $("view"), inp = h("input", { "aria-label": "Kullanıcı adı ya da e-posta", placeholder: "Talep sahibinin kullanıcı adı ya da e-posta adresi (tam)", autocomplete: "off" }), res = h("div"), fp = h("div");
  const footprint = async (id) => {
    const f = await api("/users/" + id + "/footprint");
    fp.textContent = "";
    fp.append(h("h3", {}, "#" + id + (f.exists ? " için elimizdeki kayıtlar" : ": hesap yok")),
      tbl(["Tablo", "Satır"], f.tables.filter((t) => t.n).map((t) => [t.table, t.n])),
      h("p", {}, f.total ? "Toplam " + f.total + " kayıt." : "Bu kimlik için hiçbir tabloda kayıt kalmamış."));
  };
  const find = async () => {
    res.textContent = ""; fp.textContent = "";
    let list;
    try { list = await api("/data/find", "POST", { query: inp.value }); } catch (e) { res.append(h("p", { class: "err" }, e.message)); return; }
    if (!list.length) { res.append(h("p", { class: "dim" }, "Tam eşleşen hesap yok.")); return; }
    list.forEach((u) => res.append(h("div", { class: "row" }, h("b", {}, u.username), h("span", { class: "dim" }, "#" + u.id + " · kayıt " + u.created + (u.google ? " · Google" : "") + (u.has_email ? " · e-posta kayıtlı" : "")),
      h("button", { type: "button", onclick: () => footprint(u.id).catch((e) => toast("⚠ " + e.message)) }, "Elimizde ne var"),
      h("button", { type: "button", onclick: () => act(async () => download("cinevocab-veri-" + u.username + ".json", await api("/users/" + u.id + "/export")), "Dosya indirildi") }, "Verisini indir"),
      h("button", { type: "button", onclick: () => showUser(u.id) }, "Hesap sayfası (silme orada)"))));
  };
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") find(); });
  const hy = h("div"), loadHy = async () => {
    const x = await api("/hygiene"); hy.textContent = "";
    hy.append(tbl(["Kayıt", "Adet"], [["Doğrulanmamış kayıt denemesi (1 günden eski)", x.signups_old ?? "—"], ["Süresi geçmiş tek kullanımlık giriş bileti", x.tickets_old ?? "—"],
        ["180 günden eski yönetim kaydı (IP içerir)", x.log_old ?? "—"], ...x.orphans.map((o) => ["Silinmiş hesaptan kalan: " + o.table, o.n])]),
      h("p", { class: "hint" }, "12 aydır girmeyen hesap: " + (x.inactive_12m ?? "—") + " (bunlara dokunulmaz; silmek istersen tek tek karar ver)."),
      h("div", { class: "row" }, h("button", { type: "button", onclick: async () => { if (!confirm("Listedeki süresi geçmiş ve sahipsiz kayıtlar silinsin mi? Hesaplara dokunulmaz.")) return; await act(() => api("/hygiene/clean", "POST"), "Temizlendi"); loadHy(); } }, "Bunları temizle")));
  };
  put(v,
    h("div", { class: "panel" }, h("h3", {}, "Hesabı bul"),
      h("p", { class: "sub" }, "Biri \"verimi gönder\" ya da \"sil\" derse yazdığı kullanıcı adını ya da e-postayı buraya gir. Yalnızca tam eşleşme bulunur; e-posta adresleri panelde gösterilmez ve aranıp listelenemez."),
      h("div", { class: "bar", style: "margin-top:12px" }, inp, h("button", { type: "button", class: "primary", onclick: find }, "Bul")), res, fp),
    h("div", { class: "panel" }, h("h3", {}, "Gereksiz kalan kayıtlar"), hy),
    h("div", { class: "panel" }, h("h3", {}, "Talep gelince"),
      h("p", {}, "1. Talebin hesabın sahibinden geldiğinden emin ol (kayıtlı e-postasından yazmış olmalı ya da hesabına girebiliyor olmalı)."),
      h("p", {}, "2. \"Verisini indir\" dosyasını yalnızca o kişiye gönder. Dosyada parola ve oturum bilgisi yoktur."),
      h("p", {}, "3. Silme isteğinde hesap sayfasından \"Hesabı kalıcı sil\"; sonra burada \"Elimizde ne var\" ile sıfır kaldığını doğrula."),
      h("p", { class: "hint" }, "İndirme, arama ve temizlik işlemleri Günlük sekmesine yazılır.")));
  await loadHy();
}

// ---------- Kelimeler ----------
async function viewWords() {
  const box = h("div"), search = h("input", { placeholder: "Kelime ara (kaynak ya da çeviri)…", "aria-label": "Kelime ara" }), sel = h("select", { "aria-label": "Dil çifti" });
  const pairs = await api("/word-pairs");
  pairs.forEach((p) => sel.append(h("option", { value: p.pair }, p.pair.replace(">", " → ") + " (" + p.n + ")")));
  const load = async () => {
    const pair = sel.value, legacy = pair === "tr>en";
    const list = await api("/words?pair=" + encodeURIComponent(pair) + "&q_=" + encodeURIComponent(search.value));
    box.textContent = "";
    box.append(h("div", { class: "wrap" }, h("table", {}, list.map((w) => {
      const inp = h("input", { value: w.eng, style: "width:100%" });
      const save = legacy ? () => api("/words/" + w.id + "/edit", "POST", { eng: inp.value }) : () => api("/words-ml/edit", "POST", { pair, word: w.tr, eng: inp.value });
      const del = legacy ? () => api("/words/" + w.id + "/delete", "POST") : () => api("/words-ml/delete", "POST", { pair, word: w.tr });
      return h("tr", {}, h("td", {}, w.tr), h("td", {}, inp), h("td", { class: "dim" }, w.at),
        h("td", {}, h("button", { type: "button", onclick: () => act(save, "Kaydedildi") }, "Kaydet"), " ",
          h("button", { type: "button", class: "danger", onclick: async () => { await act(del, "Silindi"); load(); } }, "Sil")));
    }))));
  };
  search.addEventListener("input", () => { clearTimeout(load.t); load.t = setTimeout(() => load().catch(() => {}), 300); });
  sel.addEventListener("change", () => load().catch(() => {}));
  $("view").append(h("p", { class: "dim" }, "Yanlış çevirileri burada düzeltebilir ya da silebilirsin. Dil çiftini listeden seç. (main.py'deki DICTIONARY her zaman önceliklidir; tr → en dışındaki eski kayıtların tarihi yoktur.)"), h("div", { class: "bar" }, sel, search), box);
  await load();
}
