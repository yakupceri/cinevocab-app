<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CineVocab · Yönetim</title>
<style>
  :root { --bg:#0c0b0a; --panel:#161412; --ink:#efe6d6; --dim:#a39b8d; --line:rgba(239,230,214,.14);
          --ember:#e8613c; --gold:#e9b44c; --ok:#86c79a; --bad:#e0604f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 "Segoe UI", system-ui, Arial, sans-serif; }
  h1,h2,h3 { margin:0; font-family: Georgia, serif; }
  button, input, select { font:inherit; color:inherit; background:#1d1a17; border:1px solid var(--line);
          border-radius:8px; padding:8px 11px; }
  button { cursor:pointer; } button:hover { border-color:var(--gold); }
  button.primary { background:var(--ember); border:0; color:#fff; font-weight:700; }
  button.danger { border-color:var(--bad); color:var(--bad); } button.danger:hover { background:var(--bad); color:#fff; }
  :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .hide { display:none !important; }
  #login { max-width:340px; margin:14vh auto; padding:26px; background:var(--panel); border:1px solid var(--line); border-radius:14px; }
  #login input { width:100%; margin-top:10px; } #login button { width:100%; margin-top:14px; }
  .err { color:var(--bad); min-height:18px; margin-top:8px; }
  header { display:flex; align-items:center; gap:14px; padding:12px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:20px; } nav { display:flex; gap:6px; flex-wrap:wrap; flex:1; }
  nav button.on { background:var(--ember); border-color:var(--ember); color:#fff; }
  main { padding:20px; max-width:1100px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card b { display:block; font-size:26px; font-family:Georgia,serif; } .card span { color:var(--dim); font-size:12px; }
  .bar { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; } .bar input { flex:1; min-width:180px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th,td { padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:600; font-size:12px; } tr.click { cursor:pointer; } tr.click:hover td { background:rgba(255,255,255,.03); }
  .wrap { overflow-x:auto; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
  .tag.bad { color:var(--bad); border-color:var(--bad); } .tag.warn { color:var(--gold); border-color:var(--gold); } .tag.ok { color:var(--ok); border-color:var(--ok); }
  .dim { color:var(--dim); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; } @media (max-width:760px){ .grid2{grid-template-columns:1fr;} }
  .spark { display:flex; align-items:flex-end; gap:4px; height:60px; margin-top:8px; }
  .spark i { flex:1; max-width:28px; background:var(--ember); border-radius:3px 3px 0 0; min-height:2px; }
  .fun { display:grid; grid-template-columns:minmax(120px,190px) 1fr 90px; gap:6px 12px; align-items:center; margin-top:10px; }
  .fun i { display:block; height:18px; border-radius:4px; background:var(--ember); min-width:2px; }
  .fun b { text-align:right; font-variant-numeric:tabular-nums; } .fun small { color:var(--dim); font-weight:400; }
  .note { padding:10px 12px; border-radius:10px; border:1px solid var(--line); margin-bottom:8px; }
  .note.bad { border-color:var(--bad); } .note.warn { border-color:var(--gold); } .note.ok { border-color:var(--ok); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  a { color:var(--gold); }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#000; border:1px solid var(--gold); padding:10px 16px; border-radius:10px; z-index:9; }
</style>
</head>
<body>

<div id="login" class="hide">
  <h2>Yönetim girişi</h2>
  <form id="lf" autocomplete="on">
    <input id="lu" name="username" placeholder="Kullanıcı adı" autocomplete="username" required>
    <input id="lp" name="password" type="password" placeholder="Parola" autocomplete="current-password" required>
    <button class="primary" type="submit">Giriş</button>
  </form>
  <div class="err" id="lerr"></div>
</div>

<div id="app" class="hide">
  <header>
    <h1>CineVocab · Yönetim</h1>
    <nav id="nav"></nav>
    <button id="out">Çıkış</button>
  </header>
  <main id="view"></main>
</div>
<div id="toast" class="hide"></div>

<script>
"use strict";
// ---------- yardımcılar (veriler textContent ile basılır: XSS yok) ----------
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  put(e, kids);
  return e;
}
// İç içe diziler ve boş (null) değerler güvenle eklenir
function put(e, ...kids) { for (const c of kids.flat(Infinity)) if (c != null && c !== "") e.append(c.nodeType ? c : document.createTextNode(String(c))); }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.remove("hide"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hide"), 2800); }
async function api(path, method = "GET", body) {
  const r = await fetch("/admin/api" + path, { method, credentials: "same-origin",
    headers: { "Content-Type": "application/json", "X-Admin": "1" }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "/login") { showLogin(); throw new Error("Oturum bitti"); }
  if (!r.ok) throw new Error(d.detail || "HTTP " + r.status);
  return d;
}
async function act(fn, okMsg) { try { await fn(); toast(okMsg || "Tamam"); } catch (e) { toast("⚠ " + e.message); } }
const status = (u) => u.ban ? h("span", { class: "tag bad" }, "BANLI · " + u.ban)
  : u.game_ban ? h("span", { class: "tag warn" }, "oyun yasağı · " + u.game_ban) : h("span", { class: "tag ok" }, "normal");

// ---------- giriş ----------
function showLogin() { $("app").classList.add("hide"); $("login").classList.remove("hide"); }
$("lf").addEventListener("submit", async (e) => {
  e.preventDefault(); $("lerr").textContent = "";
  try { await api("/login", "POST", { username: $("lu").value, password: $("lp").value }); $("lp").value = ""; start(); }
  catch (er) { $("lerr").textContent = er.message; }
});
$("out").onclick = async () => { await api("/logout", "POST").catch(() => {}); showLogin(); };

// ---------- sekmeler ----------
const TABS = { "Özet": viewStats, "Sağlık": viewHealth, "Huni": viewFunnel, "Davetler": viewRefs, "Kullanıcılar": viewUsers, "Odalar": viewRooms, "Kelimeler": viewWords, "Veri talepleri": viewData, "Sistem": viewSystem, "Günlük": viewLog };
const go = (name) => open(name, [...document.querySelectorAll("#nav button")].find((b) => b.textContent === name));
function start() {
  $("login").classList.add("hide"); $("app").classList.remove("hide");
  const nav = $("nav"); nav.textContent = "";
  Object.keys(TABS).forEach((name, i) => {
    const b = h("button", { onclick: () => open(name, b) }, name); nav.append(b); if (i === 0) open(name, b);
  });
}
function open(name, btn) {
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b === btn));
  $("view").textContent = ""; TABS[name]().catch((e) => $("view").append(h("p", { class: "err" }, e.message)));
}

// ---------- Özet ----------
async function viewStats() {
  const s = await api("/stats");
  const cards = [["Toplam kullanıcı", s.users], ["Bugün kayıt", s.users_today], ["7 günde kayıt", s.users_week],
    ["Şu an çevrimiçi (5 dk)", s.online_now], ["24 saatte aktif", s.active_24h], ["Banlı", s.banned],
    ["Çevrilmiş kelime", s.words], ["Kullanıcı kelime kaydı", s.user_words], ["Oynanan oyun", s.games], ["Açık oda", s.rooms]];
  const max = Math.max(1, ...s.signups.map((x) => x.n));
  $("view").append(
    h("div", { class: "cards" }, cards.map(([k, v]) => h("div", { class: "card" }, h("b", {}, v), h("span", {}, k)))),
    h("div", { class: "grid2" },
      h("div", { class: "panel" }, h("h3", {}, "Son 14 gün kayıtlar"),
        h("div", { class: "spark" }, s.signups.map((x) => h("i", { title: x.day + ": " + x.n, style: "height:" + (x.n / max) * 100 + "%" })))),
      h("div", { class: "panel" }, h("h3", {}, "Eklenti çeviri istekleri (günlük)"),
        s.usage.length ? h("table", {}, h("tr", {}, h("th", {}, "Gün"), h("th", {}, "İstek"), h("th", {}, "Hesapsız"), h("th", {}, "Kelime")),
          s.usage.map((x) => h("tr", {}, h("td", {}, x.day), h("td", {}, x.calls), h("td", {}, x.anon), h("td", {}, x.words))))
          : h("p", {}, "Henüz kayıt yok. Sayaç bu sürümden itibaren çalışır."),
        s.pairs.length ? h("table", {}, h("tr", {}, h("th", {}, "Dil çifti (14 gün)"), h("th", {}, "İstek")),
          s.pairs.map((x) => h("tr", {}, h("td", {}, x.pair), h("td", {}, x.calls)))) : ""),
      h("div", { class: "panel" }, h("h3", {}, "Link tıklamaları (/get?src=...)"),
        s.clicks.length ? h("table", {}, h("tr", {}, h("th", {}, "Kaynak"), h("th", {}, "Bugün"), h("th", {}, "7 gün"), h("th", {}, "30 gün")),
          s.clicks.map((x) => h("tr", {}, h("td", {}, x.src), h("td", {}, x.d1), h("td", {}, x.d7), h("td", {}, x.d30))))
          : h("p", {}, "Henüz tıklama yok. Linki şöyle kullan: /get?src=reddit")),
      botPanel(),
      h("div", { class: "panel" }, h("h3", {}, "En çok kelime toplanan içerikler"),
        h("table", {}, s.top_sources.map((x) => h("tr", {}, h("td", {}, x.episode), h("td", {}, x.n)))))));
}

// ---------- Bot testi: mağaza yüklemesi ↔ gerçek çeviri isteği ----------
function botPanel() {
  const box = h("div", { class: "panel" }, h("h3", {}, "Bot testi (yükleme ↔ kullanım)"));
  const day = h("input", { type: "date", value: new Date(Date.now() - 864e5).toISOString().slice(0, 10) });
  const ins = h("input", { type: "number", min: 0, placeholder: "Yükleme", style: "width:90px" });
  const usr = h("input", { type: "number", min: 0, placeholder: "Aktif kullanıcı", style: "width:110px" });
  const load = async () => {
    const r = await api("/bot-check");
    box.textContent = "";
    box.append(h("h3", {}, "Bot testi (yükleme ↔ kullanım)"),
      h("p", { class: "dim" }, "Chrome Web Store panelindeki günlük Yükleme ve Kullanıcı sayısını gir. Sunucudaki gerçek çeviri istekleriyle karşılaştırırım."),
      h("div", { class: "bar" }, day, ins, usr, h("button", { onclick: () => act(() => api("/store-stats", "POST", { day: day.value, installs: Number(ins.value) || 0, users: Number(usr.value) || 0 }), "Kaydedildi").then(load) }, "Kaydet")),
      h("p", {}, h("b", {}, r.verdict)),
      h("table", {}, h("tr", {}, ["Gün", "Yükleme", "Kullanıcı", "Çeviri isteği", "Hesapsız"].map((t) => h("th", {}, t))),
        r.days.map((d) => h("tr", {}, h("td", {}, d.day), h("td", {}, d.entered ? d.installs : "—"), h("td", {}, d.entered ? d.users : "—"), h("td", {}, d.calls), h("td", {}, d.anon)))),
      h("p", { class: "dim" }, "Bu bir ipucudur, kanıt değildir. Sayaç kimseyi tanımaz; sadece \"yüklenenler gerçekten kullanıyor mu\" sorusuna yaklaşık cevap verir."));
  };
  load().catch(() => {});
  return box;
}

// ---------- Kullanıcılar ----------
async function viewUsers() {
  const box = h("div"), search = h("input", { placeholder: "Kullanıcı ara…" });
  const load = async () => {
    const list = await api("/users?q_=" + encodeURIComponent(search.value));
    box.textContent = "";
    box.append(h("div", { class: "wrap" }, h("table", {},
      h("tr", {}, ["#", "Kullanıcı", "Giriş", "Nereden", "Kayıt", "Son görülme", "Kelime", "Oyun", "Puan", "Durum"].map((t) => h("th", {}, t))),
      list.map((u) => h("tr", { class: "click", onclick: () => userDetail(u.id) },
        h("td", {}, u.id), h("td", {}, u.username), h("td", {}, u.method || "—"), h("td", {}, origin(u)),
        h("td", { class: "dim" }, u.created), h("td", { class: "dim" }, u.last_seen || "—"),
        h("td", {}, u.words), h("td", {}, u.games), h("td", {}, u.score), h("td", {}, status(u)))))));
  };
  search.addEventListener("input", () => { clearTimeout(load.t); load.t = setTimeout(() => load().catch(() => {}), 300); });
  $("view").append(h("div", { class: "bar" }, search), box); await load();
}

// Hesap nereden açıldı: arkadaş daveti varsa o, yoksa kayıt yeri (web / eklenti / mobil). Eski hesaplarda bilinmez.
const origin = (u) => u.invited_by ? "davet: " + u.invited_by : (u.via || "—");

async function userDetail(id) {
  const u = await api("/users/" + id);
  const invited = u.origin && u.origin.invited ? await api("/users/" + id + "/invited").catch(() => []) : [];
  const v = $("view"); v.textContent = "";
  const dur = h("select", {}, [["1", "1 saat"], ["24", "1 gün"], ["168", "7 gün"], ["720", "30 gün"], ["", "Süresiz"]].map(([a, b]) => h("option", { value: a }, b)));
  dur.value = "24";
  const reason = h("input", { placeholder: "Sebep (kullanıcı giriş yaparken görür)", style: "flex:1;min-width:200px" });
  const hours = () => (dur.value === "" ? null : parseInt(dur.value, 10));
  const reload = () => userDetail(id);
  const run = (path, body, msg, confirmText) => async () => {
    if (confirmText && !confirm(confirmText)) return;
    await act(() => api("/users/" + id + path, "POST", body), msg); reload();
  };
  const pw = h("input", { placeholder: "Yeni parola (en az 6)", type: "text" });
  const nn = h("input", { placeholder: "Yeni kullanıcı adı (3-16, harf/rakam/_)", type: "text", maxlength: 16 });

  v.append(
    h("button", { onclick: () => go("Kullanıcılar") }, "← Listeye dön"),
    h("div", { class: "panel", style: "margin-top:12px" },
      h("h2", {}, u.username, " ", status(u)),
      h("p", { class: "dim" }, `#${u.id} · kayıt ${u.created} · son görülme ${u.last_seen || "—"} · açık oturum/anahtar: ${u.sessions}`),
      u.origin ? h("p", {}, "Giriş: ", h("b", {}, u.origin.method || "—"), " · kayıt yeri: ", h("b", {}, u.origin.via || "bilinmiyor"),
        u.origin.invited_by ? " · davet eden: " + u.origin.invited_by : "", " · davet ettiği kişi: " + u.origin.invited,
        " · e-posta kayıtlı: " + (u.origin.has_email ? "evet" : "hayır")) : null,
      u.ban_reason ? h("p", {}, "Ban sebebi: ", u.ban_reason) : null,
      u.game_ban_reason ? h("p", {}, "Oyun yasağı sebebi: ", u.game_ban_reason) : null),

    invited.length ? h("div", { class: "panel" }, h("h3", {}, "Davetiyle kayıt olanlar (" + invited.length + ")"),
      h("table", {}, invited.map((x) => h("tr", { class: "click", onclick: () => userDetail(x.id) }, h("td", {}, x.username), h("td", { class: "dim" }, x.at))))) : null,

    h("div", { class: "panel" }, h("h3", {}, "Ceza"),
      h("div", { class: "row" }, dur, reason),
      h("div", { class: "row" },
        h("button", { class: "danger", onclick: () => run("/ban", { hours: hours(), reason: reason.value }, "Banlandı", "Bu kullanıcı banlansın mı? Açık oturumları da kapanır.")() }, "Hesabı banla"),
        h("button", { onclick: () => run("/gameban", { hours: hours(), reason: reason.value }, "Oyun yasağı verildi")() }, "Oyun yasağı ver"),
        u.ban ? h("button", { onclick: run("/unban", null, "Ban kaldırıldı") }, "Banı kaldır") : null,
        u.game_ban ? h("button", { onclick: run("/ungameban", null, "Oyun yasağı kaldırıldı") }, "Oyun yasağını kaldır") : null)),

    h("div", { class: "panel" }, h("h3", {}, "Diğer işlemler"),
      h("div", { class: "row" },
        h("button", { onclick: run("/logout", null, "Oturumlar kapatıldı") }, "Tüm oturumları kapat"),
        h("button", { onclick: run("/reset-score", null, "Puanlar sıfırlandı", "Bu kullanıcının tüm oyun puanları silinsin mi?") }, "Puanları sıfırla"),
        h("button", { onclick: run("/clear-words", null, "Kelimeler silindi", "Kullanıcının kelime listesi silinsin mi?") }, "Kelime listesini temizle")),
      h("div", { class: "row" }, nn,
        h("button", { onclick: () => run("/rename", { username: nn.value }, "Kullanıcı adı değişti", "Kullanıcı adı değişsin mi?")() }, "Adı değiştir")),
      h("div", { class: "row" }, pw,
        h("button", { onclick: () => run("/reset-password", { password: pw.value }, "Parola değişti")() }, "Parolayı sıfırla")),
      h("div", { class: "row" },
        h("button", { class: "danger", onclick: async () => {
          const n = prompt("Hesabı KALICI silmek için kullanıcı adını yaz: " + u.username);
          if (n == null) return;
          await act(() => api("/users/" + id + "/delete", "POST", { username: n }), "Hesap silindi");
          go("Kullanıcılar");
        } }, "Hesabı kalıcı sil"))),

    h("div", { class: "grid2" },
      h("div", { class: "panel" }, h("h3", {}, "Son oyunlar"),
        h("table", {}, u.games.map((g) => h("tr", {}, h("td", {}, g.episode), h("td", {}, g.score + " puan"), h("td", {}, g.place + "/" + g.players), h("td", { class: "dim" }, g.at))))),
      h("div", { class: "panel" }, h("h3", {}, "İzlediği içerikler"),
        h("table", {}, u.episodes.map((e) => h("tr", {}, h("td", {}, e.episode), h("td", {}, e.n + " kelime"), h("td", { class: "dim" }, e.at)))))),
    h("div", { class: "panel" }, h("h3", {}, "Son kelimeleri"),
      h("div", { class: "wrap" }, h("table", {}, u.words.map((w) => h("tr", {}, h("td", {}, w.tr), h("td", {}, w.eng), h("td", { class: "dim" }, w.pair || ""), h("td", { class: "dim" }, w.episode), h("td", { class: "dim" }, w.at)))))));
}

// ---------- ortak: tablo, dönem seçici ----------
const pct = (a, b) => (b ? Math.round((100 * a) / b) : 0);
function tbl(heads, rows) {
  return h("div", { class: "wrap" }, h("table", {},
    h("tr", {}, heads.map((t, i) => h("th", i ? { class: "num" } : {}, t))),
    rows.map((r) => h("tr", {}, r.map((c, i) => h("td", i ? { class: "num" } : {}, c))))));
}
function period(name, value, options) {
  const sel = h("select", {}, options.map((d) => h("option", { value: d }, "Son " + d + " gün")));
  sel.value = value;
  sel.addEventListener("change", () => { period[name] = Number(sel.value); go(name); });
  return sel;
}
const errBox = (list) => (list && list.length ? h("div", { class: "note bad" }, "Bazı sayılar okunamadı: ", list.join(" | ")) : null);

// ---------- Sağlık: eklenti düzgün çalışıyor mu (toplu sayılar; kimsenin kelimesi gösterilmez) ----------
async function viewHealth() {
  const d = await api("/health?days=" + (period["Sağlık"] || 14)), t = d.total, v = $("view");
  put(v,
    h("div", { class: "bar" }, period("Sağlık", d.days, [7, 14, 30, 90]),
      h("span", { class: "dim" }, "Kaydedilen kelimelerin toplu sayıları. Bu sayfa kimsenin kelimesini ya da izlediğini göstermez.")),
    errBox(d.errors),
    d.notes.map((n) => h("div", { class: "note " + n.level }, n.text)),
    h("div", { class: "cards" }, [["Kelime kaydı", t.rows], ["Çevirisi boş", "%" + t.no_trans_pct], ["Bölüm adı yok", "%" + t.untagged_pct], ["Çeviri = kelime", "%" + t.same_pct]]
      .map(([k, n]) => h("div", { class: "card" }, h("b", {}, n), h("span", {}, k)))),
    h("div", { class: "grid2" },
      h("div", { class: "panel" }, h("h3", {}, "Dil çiftine göre"),
        tbl(["Çift", "Kayıt", "Kişi", "Çevirisiz", "Çeviri = kelime"], d.pairs.map((p) => [p.pair, p.rows, p.users, p.no_trans + " (%" + pct(p.no_trans, p.rows) + ")", p.same + " (%" + pct(p.same, p.rows) + ")"])),
        h("p", { class: "dim" }, "\"Çeviri = kelime\" yüksekse altyazı büyük ihtimalle seçilen dilde değildir.")),
      h("div", { class: "panel" }, h("h3", {}, "Platforma göre"),
        tbl(["Platform", "Kayıt", "Kişi", "Çevirisiz"], d.platforms.map((p) => [p.platform, p.rows, p.users, p.no_trans + " (%" + pct(p.no_trans, p.rows) + ")"])),

// ---------- Huni: tıklama → kayıt → kelime → geri gelme (kişi adı yok) ----------
async function viewFunnel() {
  const d = await api("/funnel?days=" + (period["Huni"] || 30)), s = d.steps || {}, v = $("view");
  const steps = [["Link tıklaması", d.clicks, null], ["Kayıt olan", s.signups, null], ["İlk kelimesini kaydeden", s.word1, s.signups],
    ["20+ kelime kaydeden", s.word20, s.signups], ["Pratik yapan", s.practiced, s.signups], ["Başka bir gün geri gelen", s.returned, s.signups]];
  const max = Math.max(1, ...steps.map((x) => x[1] || 0));
  const small = (name, list) => h("div", { class: "panel" }, h("h3", {}, name), tbl(["", "Kişi"], list.map((x) => [x.name, x.n])));
  const dmax = Math.max(1, ...d.dau.map((x) => x.n));
  put(v,
    h("div", { class: "bar" }, period("Huni", d.days, [7, 30, 90, 365]),
      h("span", { class: "dim" }, "Bu dönemde kayıt olanların ne kadar ilerlediği. Yalnızca sayılar.")),
    errBox(d.errors),
    h("div", { class: "panel" }, h("h3", {}, "Huni"),
      h("div", { class: "fun" }, steps.map(([k, n, base]) => [h("span", {}, k), h("i", { style: "width:" + ((n || 0) / max) * 100 + "%" }),
        h("b", {}, n || 0, base ? h("small", {}, " %" + pct(n, base)) : "")])),
      h("p", { class: "dim" }, "Tıklamalar mağazaya gider; tıklayanla kayıt olan aynı kişi olarak eşleştirilemez, o yüzden ilk iki satır yalnızca yan yana durur."),
      h("p", {}, "7 gün sonra hâlâ aktif: ", h("b", {}, (s.kept7 || 0) + " / " + (s.old7 || 0)), h("span", { class: "dim" }, " (en az 7 gün önce kayıt olanlar içinde)"))),
    h("div", { class: "grid2" },
      h("div", { class: "panel" }, h("h3", {}, "Günlük aktif hesap (14 gün)"),
        h("div", { class: "spark" }, d.dau.map((x) => h("i", { title: x.day + ": " + x.n, style: "height:" + (x.n / dmax) * 100 + "%" }))),
        h("p", { class: "dim" }, "Kelime kaydeden ya da pratik yapan hesaplar. Hesapsız kullanım Özet'teki istek sayacında.")),
      small("Giriş yöntemi", d.methods),
      small("Hesap nerede açıldı", d.via),
      h("div", { class: "panel" }, h("h3", {}, "Arkadaş davetiyle gelen"), h("div", { class: "cards" }, h("div", { class: "card" }, h("b", {}, d.invited), h("span", {}, "kişi (bu dönem)"))),
        h("p", { class: "dim" }, "Hangi linkten geldiği kişi bazında bilinemez: mağaza bu bilgiyi aktarmaz. Link sayıları Özet sekmesinde.")),
      small("Ülke (kullanıcının profilde seçtiği, tüm hesaplar)", d.countries)),
    h("div", { class: "panel" }, h("h3", {}, "Hafta hafta"),
      tbl(["Kayıt haftası", "Kayıt", "İlk kelime", "20+ kelime", "Pratik", "Geri geldi", "7 gün sonra aktif"],
        d.cohorts.map((c) => [c.week, c.signups, c.word1, c.word20, c.practiced, c.returned, c.old7 ? c.kept7 + " / " + c.old7 : "—"]))));
}

// ---------- Veri talepleri: "verimi ver" / "verimi sil" ----------
function download(name, obj) {
  const a = h("a", { href: URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" })), download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function viewData() {
  const v = $("view"), inp = h("input", { placeholder: "Talep sahibinin kullanıcı adı ya da e-posta adresi (tam)", autocomplete: "off" }), res = h("div"), fp = h("div");
  const footprint = async (id) => {
    const f = await api("/users/" + id + "/footprint");
    fp.textContent = "";
    fp.append(h("h3", {}, "#" + id + (f.exists ? " için elimizdeki kayıtlar" : ": hesap yok")),
      tbl(["Tablo", "Satır"], f.tables.filter((t) => t.n).map((t) => [t.table, t.n])),
      h("p", {}, f.total ? "Toplam " + f.total + " kayıt." : "Bu kimlik için hiçbir tabloda kayıt kalmamış."));
  };
  const find = async () => {
    res.textContent = ""; fp.textContent = "";
    let list;
    try { list = await api("/data/find", "POST", { query: inp.value }); } catch (e) { res.append(h("p", { class: "err" }, e.message)); return; }
    if (!list.length) { res.append(h("p", { class: "dim" }, "Tam eşleşen hesap yok.")); return; }
    list.forEach((u) => res.append(h("div", { class: "row" }, h("b", {}, u.username), h("span", { class: "dim" }, "#" + u.id + " · kayıt " + u.created + (u.google ? " · Google" : "") + (u.has_email ? " · e-posta kayıtlı" : "")),
      h("button", { onclick: () => footprint(u.id).catch((e) => toast("⚠ " + e.message)) }, "Elimizde ne var"),
      h("button", { onclick: () => act(async () => download("cinevocab-veri-" + u.username + ".json", await api("/users/" + u.id + "/export")), "Dosya indirildi") }, "Verisini indir"),
      h("button", { onclick: () => userDetail(u.id) }, "Hesap sayfası (silme orada)"))));
  };
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") find(); });
  const hy = h("div"), loadHy = async () => {
    const x = await api("/hygiene"); hy.textContent = "";
    hy.append(tbl(["Kayıt", "Adet"], [["Doğrulanmamış kayıt denemesi (1 günden eski)", x.signups_old ?? "—"], ["Süresi geçmiş tek kullanımlık giriş bileti", x.tickets_old ?? "—"],
        ["180 günden eski yönetim kaydı (IP içerir)", x.log_old ?? "—"], ...x.orphans.map((o) => ["Silinmiş hesaptan kalan: " + o.table, o.n])]),
      h("p", { class: "dim" }, "12 aydır girmeyen hesap: " + (x.inactive_12m ?? "—") + " (bunlara dokunulmaz; silmek istersen tek tek karar ver)."),
      h("div", { class: "row" }, h("button", { onclick: async () => { if (!confirm("Listedeki süresi geçmiş ve sahipsiz kayıtlar silinsin mi? Hesaplara dokunulmaz.")) return; await act(() => api("/hygiene/clean", "POST"), "Temizlendi"); loadHy(); } }, "Bunları temizle")));
  };
  put(v,
    h("div", { class: "panel" }, h("h3", {}, "Hesabı bul"),
      h("p", { class: "dim" }, "Biri \"verimi gönder\" ya da \"sil\" derse yazdığı kullanıcı adını ya da e-postayı buraya gir. Yalnızca tam eşleşme bulunur; e-posta adresleri panelde gösterilmez ve aranıp listelenemez."),
      h("div", { class: "bar" }, inp, h("button", { class: "primary", onclick: find }, "Bul")), res, fp),
    h("div", { class: "panel" }, h("h3", {}, "Gereksiz kalan kayıtlar"), hy),
    h("div", { class: "panel" }, h("h3", {}, "Talep gelince"),
      h("p", {}, "1. Talebin hesabın sahibinden geldiğinden emin ol (kayıtlı e-postasından yazmış olmalı ya da hesabına girebiliyor olmalı)."),
      h("p", {}, "2. \"Verisini indir\" dosyasını yalnızca o kişiye gönder. Dosyada parola ve oturum bilgisi yoktur."),
      h("p", {}, "3. Silme isteğinde hesap sayfasından \"Hesabı kalıcı sil\"; sonra burada \"Elimizde ne var\" ile sıfır kaldığını doğrula."),
      h("p", { class: "dim" }, "İndirme, arama ve temizlik işlemleri Günlük sekmesine yazılır.")));
  await loadHy();
}

// ---------- Kelimeler ----------
async function viewWords() {
  const box = h("div"), search = h("input", { placeholder: "Kelime ara (kaynak ya da çeviri)…" }), sel = h("select");
  const pairs = await api("/word-pairs");
  pairs.forEach((p) => sel.append(h("option", { value: p.pair }, p.pair.replace(">", " → ") + " (" + p.n + ")")));
  const load = async () => {
    const pair = sel.value, legacy = pair === "tr>en";
    const list = await api("/words?pair=" + encodeURIComponent(pair) + "&q_=" + encodeURIComponent(search.value));
    box.textContent = "";
    box.append(h("div", { class: "wrap" }, h("table", {}, list.map((w) => {
      const inp = h("input", { value: w.eng, style: "width:100%" });
      const save = legacy ? () => api("/words/" + w.id + "/edit", "POST", { eng: inp.value }) : () => api("/words-ml/edit", "POST", { pair, word: w.tr, eng: inp.value });
      const del = legacy ? () => api("/words/" + w.id + "/delete", "POST") : () => api("/words-ml/delete", "POST", { pair, word: w.tr });
      return h("tr", {}, h("td", {}, w.tr), h("td", {}, inp), h("td", { class: "dim" }, w.at),
        h("td", {}, h("button", { onclick: () => act(save, "Kaydedildi") }, "Kaydet"), " ",
          h("button", { class: "danger", onclick: async () => { await act(del, "Silindi"); load(); } }, "Sil")));
    }))));
  };
  search.addEventListener("input", () => { clearTimeout(load.t); load.t = setTimeout(() => load().catch(() => {}), 300); });
  sel.addEventListener("change", () => load().catch(() => {}));
  $("view").append(h("p", { class: "dim" }, "Yanlış çevirileri burada düzeltebilir ya da silebilirsin. Dil çiftini listeden seç. (main.py'deki DICTIONARY her zaman önceliklidir; tr → en dışındaki eski kayıtların tarihi yoktur.)"), h("div", { class: "bar" }, sel, search), box);
  await load();
}
