<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CineVocab · Yönetim</title>
<style>
  :root { --bg:#0c0b0a; --panel:#161412; --ink:#efe6d6; --dim:#a39b8d; --line:rgba(239,230,214,.14);
          --ember:#e8613c; --gold:#e9b44c; --ok:#86c79a; --bad:#e0604f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 "Segoe UI", system-ui, Arial, sans-serif; }
  h1,h2,h3 { margin:0; font-family: Georgia, serif; }
  button, input, select { font:inherit; color:inherit; background:#1d1a17; border:1px solid var(--line);
          border-radius:8px; padding:8px 11px; }
  button { cursor:pointer; } button:hover { border-color:var(--gold); }
  button.primary { background:var(--ember); border:0; color:#fff; font-weight:700; }
  button.danger { border-color:var(--bad); color:var(--bad); } button.danger:hover { background:var(--bad); color:#fff; }
  :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .hide { display:none !important; }
  #login { max-width:340px; margin:14vh auto; padding:26px; background:var(--panel); border:1px solid var(--line); border-radius:14px; }
  #login input { width:100%; margin-top:10px; } #login button { width:100%; margin-top:14px; }
  .err { color:var(--bad); min-height:18px; margin-top:8px; }
  header { display:flex; align-items:center; gap:14px; padding:12px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:20px; } nav { display:flex; gap:6px; flex-wrap:wrap; flex:1; }
  nav button.on { background:var(--ember); border-color:var(--ember); color:#fff; }
  main { padding:20px; max-width:1100px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card b { display:block; font-size:26px; font-family:Georgia,serif; } .card span { color:var(--dim); font-size:12px; }
  .bar { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; } .bar input { flex:1; min-width:180px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th,td { padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:600; font-size:12px; } tr.click { cursor:pointer; } tr.click:hover td { background:rgba(255,255,255,.03); }
  .wrap { overflow-x:auto; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
  .tag.bad { color:var(--bad); border-color:var(--bad); } .tag.warn { color:var(--gold); border-color:var(--gold); } .tag.ok { color:var(--ok); border-color:var(--ok); }
  .dim { color:var(--dim); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; } @media (max-width:760px){ .grid2{grid-template-columns:1fr;} }
  .spark { display:flex; align-items:flex-end; gap:4px; height:60px; margin-top:8px; }
  .spark i { flex:1; max-width:28px; background:var(--ember); border-radius:3px 3px 0 0; min-height:2px; }
  .fun { display:grid; grid-template-columns:minmax(120px,190px) 1fr 90px; gap:6px 12px; align-items:center; margin-top:10px; }
  .fun i { display:block; height:18px; border-radius:4px; background:var(--ember); min-width:2px; }
  .fun b { text-align:right; font-variant-numeric:tabular-nums; } .fun small { color:var(--dim); font-weight:400; }
  .note { padding:10px 12px; border-radius:10px; border:1px solid var(--line); margin-bottom:8px; }
  .note.bad { border-color:var(--bad); } .note.warn { border-color:var(--gold); } .note.ok { border-color:var(--ok); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  a { color:var(--gold); }

  /* ---- grafikler ---- */
  header { position:sticky; top:0; z-index:5; background:rgba(12,11,10,.94); backdrop-filter:blur(6px); }
  #clock { font-size:12px; color:var(--dim); border:1px solid var(--line); border-radius:99px; padding:4px 10px; white-space:nowrap; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-top:3px solid var(--c,var(--ember)); border-radius:12px; padding:12px 14px; }
  .kpi b { display:block; font:700 30px/1.1 Georgia,serif; } .kpi span { color:var(--dim); font-size:12px; } .kpi small { display:block; color:var(--dim); font-size:11px; margin-top:2px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button { border:0; border-radius:0; background:transparent; padding:7px 14px; } .seg button.on { background:var(--ember); color:#fff; font-weight:700; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--dim); margin:6px 0 2px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .cols { display:flex; gap:3px; align-items:flex-end; height:150px; padding-top:18px; margin-top:6px; }
  .col { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; height:100%; }
  .stack { flex:1; width:100%; display:flex; gap:2px; align-items:flex-end; justify-content:center; }
  .stack .b { position:relative; flex:1; max-width:18px; min-height:2px; border-radius:3px 3px 0 0; }
  .stack .b em { position:absolute; left:50%; top:-15px; transform:translateX(-50%); font:normal 10px/1 system-ui; color:var(--dim); }
  .col small { color:var(--dim); font-size:10px; margin-top:4px; white-space:nowrap; }
  @media (max-width:640px){ .stack .b em { display:none; } .col small:not(:nth-last-child(1)) { font-size:9px; } .col:nth-child(even) small { visibility:hidden; } }
  .donut { display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-top:8px; }
  .donut svg { width:130px; height:130px; flex:none; } .donut text { fill:var(--ink); font:700 22px Georgia,serif; text-anchor:middle; }
  .donut ul { list-style:none; margin:0; padding:0; flex:1; min-width:150px; } .donut li { display:flex; gap:8px; align-items:center; padding:3px 0; }
  .donut li i { width:11px; height:11px; border-radius:3px; flex:none; } .donut li b { margin-left:auto; font-variant-numeric:tabular-nums; }
  .hb { display:grid; grid-template-columns:minmax(90px,170px) 1fr 52px; gap:6px 10px; align-items:center; margin-top:10px; }
  .hb .lab { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .hb .lab small { display:block; color:var(--dim); font-size:11px; }
  .hb .track { height:16px; background:rgba(255,255,255,.05); border-radius:5px; overflow:hidden; display:flex; } .hb .track i { display:block; height:100%; }
  .hb b { text-align:right; font-variant-numeric:tabular-nums; }
  .hours { display:flex; gap:2px; align-items:flex-end; height:110px; margin-top:8px; }
  .hours div { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; }
  .hours i { width:100%; background:var(--ember); border-radius:3px 3px 0 0; min-height:2px; opacity:.85; } .hours div.now i { background:var(--gold); opacity:1; }
  .hours small { font-size:9px; color:var(--dim); margin-top:3px; height:11px; }
  .big { font:700 15px Georgia,serif; }
  .empty { color:var(--dim); padding:10px 0; }
  .dev { white-space:nowrap; }
  .tag { white-space:nowrap; }
  @media (max-width:640px){
    nav { flex-wrap:nowrap; overflow-x:auto; flex-basis:100%; order:3; padding-bottom:4px; } nav button { white-space:nowrap; flex:none; }
    main { padding:12px; } th,td { padding:7px 6px; font-size:13px; } header { padding:10px 12px; }
  }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#000; border:1px solid var(--gold); padding:10px 16px; border-radius:10px; z-index:9; }
</style>
</head>
<body>

<div id="login" class="hide">
  <h2>Yönetim girişi</h2>
  <form id="lf" autocomplete="on">
    <input id="lu" name="username" placeholder="Kullanıcı adı" autocomplete="username" required>
    <input id="lp" name="password" type="password" placeholder="Parola" autocomplete="current-password" required>
    <button class="primary" type="submit">Giriş</button>
  </form>
  <div class="err" id="lerr"></div>
</div>

<div id="app" class="hide">
  <header>
    <h1>CineVocab · Yönetim</h1>
    <nav id="nav"></nav>
    <span id="clock" title="Panelde tüm saatler İstanbul saatidir"></span>
    <button id="out">Çıkış</button>
  </header>
  <main id="view"></main>
</div>
<div id="toast" class="hide"></div>

<script>
"use strict";
// ---------- yardımcılar (veriler textContent ile basılır: XSS yok) ----------
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  put(e, kids);
  return e;
}
// İç içe diziler ve boş (null) değerler güvenle eklenir
function put(e, ...kids) { for (const c of kids.flat(Infinity)) if (c != null && c !== "") e.append(c.nodeType ? c : document.createTextNode(String(c))); }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.remove("hide"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hide"), 2800); }
async function api(path, method = "GET", body) {
  const r = await fetch("/admin/api" + path, { method, credentials: "same-origin",
    headers: { "Content-Type": "application/json", "X-Admin": "1" }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "/login") { showLogin(); throw new Error("Oturum bitti"); }
  if (!r.ok) throw new Error(d.detail || "HTTP " + r.status);
  return d;
}
async function act(fn, okMsg) { try { await fn(); toast(okMsg || "Tamam"); } catch (e) { toast("⚠ " + e.message); } }
const status = (u) => u.ban ? h("span", { class: "tag bad" }, "BANLI · " + u.ban)
  : u.game_ban ? h("span", { class: "tag warn" }, "oyun yasağı · " + u.game_ban) : h("span", { class: "tag ok" }, "normal");

// ---------- giriş ----------
function showLogin() { $("app").classList.add("hide"); $("login").classList.remove("hide"); }
$("lf").addEventListener("submit", async (e) => {
  e.preventDefault(); $("lerr").textContent = "";
  try { await api("/login", "POST", { username: $("lu").value, password: $("lp").value }); $("lp").value = ""; start(); }
  catch (er) { $("lerr").textContent = er.message; }
});
$("out").onclick = async () => { await api("/logout", "POST").catch(() => {}); showLogin(); };

// ---------- sekmeler ----------
const TABS = { "Ziyaretçiler": viewTraffic, "Özet": viewStats, "Sağlık": viewHealth, "Huni": viewFunnel, "Davetler": viewRefs, "Kullanıcılar": viewUsers, "Odalar": viewRooms, "Kelimeler": viewWords, "Veri talepleri": viewData, "Sistem": viewSystem, "Günlük": viewLog };
const go = (name) => open(name, [...document.querySelectorAll("#nav button")].find((b) => b.textContent === name));
function start() {
  $("login").classList.add("hide"); $("app").classList.remove("hide"); tickClock();
  const nav = $("nav"); nav.textContent = "";
  Object.keys(TABS).forEach((name, i) => {
    const b = h("button", { onclick: () => open(name, b) }, name); nav.append(b); if (i === 0) open(name, b);
  });
}
function open(name, btn) {
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b === btn));
  $("view").textContent = ""; TABS[name]().catch((e) => $("view").append(h("p", { class: "err" }, e.message)));
}

// ---------- Grafik parçaları (bağımlılık yok; değerler textContent ile basılır) ----------
const sv = (tag, attrs, ...kids) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v); kids.flat().forEach((c) => c && e.append(c)); return e; };
const DEV = { telefon: ["Telefon", "#e8613c", "📱"], bilgisayar: ["Bilgisayar", "#5fb3c4", "💻"], tablet: ["Tablet", "#e9b44c", "▭"] };
const DEVS = ["telefon", "bilgisayar", "tablet"];
let regionNames = null; try { regionNames = new Intl.DisplayNames(["tr"], { type: "region" }); } catch (e) { /* eski tarayıcı */ }
function countryLabel(c) {
  if (/^[A-Z]{2}$/.test(c)) {
    const flag = String.fromCodePoint(...[...c].map((ch) => 127397 + ch.charCodeAt(0)));
    let n = c; try { n = (regionNames && regionNames.of(c)) || c; } catch (e) { /* bilinmeyen kod */ }
    return flag + " " + n;
  }
  return c.startsWith("dil:") ? "🌐 Bilinmiyor (dil: " + c.slice(4) + ")" : "🌐 Bilinmiyor";
}
// Günlük sütun grafiği: series = [{key, label, color}]
function colChart(days, series) {
  const max = Math.max(1, ...days.flatMap((d) => series.map((s) => d[s.key] || 0)));
  return h("div", {},
    h("div", { class: "legend" }, series.map((s) => h("span", {}, h("i", { style: "background:" + s.color }), s.label))),
    h("div", { class: "cols" }, days.map((d) => h("div", { class: "col" },
      h("div", { class: "stack" }, series.map((s) => { const v = d[s.key] || 0;
        return h("div", { class: "b", title: d.day + " · " + s.label + ": " + v, style: `height:${(v / max) * 100}%;background:${s.color}` }, v ? h("em", {}, v) : ""); })),
      h("small", {}, d.day)))));
}
// Halka grafik: items = [[etiket, sayı, renk], ...]
function donut(items, centerLabel) {
  const tot = items.reduce((a, x) => a + x[1], 0);
  if (!tot) return h("p", { class: "empty" }, "Henüz veri yok.");
  const R = 44, C = 2 * Math.PI * R; let off = 0;
  const segs = items.filter((x) => x[1]).map((x) => { const len = (x[1] / tot) * C;
    const c = sv("circle", { cx: 60, cy: 60, r: R, fill: "none", stroke: x[2], "stroke-width": 18, "stroke-dasharray": `${len} ${C - len}`, "stroke-dashoffset": -off, transform: "rotate(-90 60 60)" });
    off += len; return c; });
  const t = sv("text", { x: 60, y: 68 }); t.textContent = tot;
  return h("div", { class: "donut" }, sv("svg", { viewBox: "0 0 120 120", role: "img", "aria-label": centerLabel || "" }, sv("circle", { cx: 60, cy: 60, r: R, fill: "none", stroke: "#2a2622", "stroke-width": 18 }), segs, t),
    h("ul", {}, items.map((x) => h("li", {}, h("i", { style: "background:" + x[2] }), x[0], h("b", {}, x[1], h("small", { class: "dim" }, "  %" + pct(x[1], tot)))))));
}
// Yatay çubuklar: rows = [{label, sub, total, parts:[[sayı, renk]]}]
function hbars(rows, emptyMsg) {
  if (!rows.length) return h("p", { class: "empty" }, emptyMsg || "Henüz veri yok.");
  const max = Math.max(1, ...rows.map((r) => r.total));
  return h("div", { class: "hb" }, rows.map((r) => [
    h("div", { class: "lab", title: r.label }, r.label, r.sub ? h("small", {}, r.sub) : ""),
    h("div", { class: "track" }, r.parts.map((p) => p[0] ? h("i", { style: `width:${(p[0] / max) * 100}%;background:${p[1]}`, title: p[2] || "" }) : "")),
    h("b", {}, r.total)]));
}
const devParts = (o) => DEVS.map((k) => [o[k] || 0, DEV[k][1], DEV[k][0] + ": " + (o[k] || 0)]);
const hh = (x) => String(x).padStart(2, "0");
const trNow = () => new Date().toLocaleTimeString("tr-TR", { timeZone: "Europe/Istanbul", hour: "2-digit", minute: "2-digit" });
function tickClock() { const c = $("clock"); if (c) c.textContent = "🕐 İstanbul " + trNow(); }
setInterval(tickClock, 20000);

// ---------- Ziyaretçiler: kimler, nereden, hangi cihazdan, saat kaçta ----------
async function viewTraffic() {
  tickClock();
  const days = period["Ziyaretçiler"] || 7, d = await api("/traffic?days=" + days), v = $("view");
  const T = d.totals || {}, dv = d.devices || { site: {}, clicks: {}, os: {} };
  const when = days === 1 ? "bugün" : "son " + days + " gün";
  const phoneSite = dv.site.telefon || 0, siteDev = DEVS.reduce((a, k) => a + (dv.site[k] || 0), 0);
  const seg = h("div", { class: "seg" }, [[1, "Bugün"], [7, "7 gün"], [30, "30 gün"]].map(([n, t]) =>
    h("button", { class: n === days ? "on" : "", onclick: () => { period["Ziyaretçiler"] = n; go("Ziyaretçiler"); } }, t)));
  const hrs = d.hours || { site: [], clicks: [] }, nowH = Number((d.now || "").slice(11, 13));
  const hsum = Array.from({ length: 24 }, (_, i) => (hrs.site[i] || 0) + (hrs.clicks[i] || 0)), hmax = Math.max(1, ...hsum);
  const peak = hsum.indexOf(Math.max(...hsum));
  const srcRows = (d.sources || []).map((r) => ({ label: r.src, total: r.n,
    sub: (DEVS.map((k) => r[k] ? DEV[k][2] + " " + r[k] : "").filter(Boolean).join("  ")) || "",
    parts: [...devParts(r), [Math.max(0, r.n - DEVS.reduce((a, k) => a + r[k], 0)), "#6b645a", "Cihaz bilinmiyor"]] }));
  const refRows = (d.referrers || []).map((r) => ({ label: r.ref || "Doğrudan / bilinmiyor", total: r.n, parts: [[r.n, r.ref ? "#e9b44c" : "#6b645a"]] }));
  const ctyRows = (d.countries || []).map((r) => ({ label: countryLabel(r.country), total: r.site + r.ext + r.clicks,
    sub: [r.clicks ? r.clicks + " tıklama" : "", r.site ? r.site + " site" : "", r.ext ? r.ext + " eklenti" : ""].filter(Boolean).join(" · "),
    parts: [[r.clicks, "#e8613c", "Tıklama"], [r.site, "#5fb3c4", "Site"], [r.ext, "#86c79a", "Eklenti"]] }));
  put(v,
    h("div", { class: "bar" }, seg, h("button", { onclick: () => go("Ziyaretçiler") }, "↻ Yenile"),
      h("span", { class: "dim" }, "Şu an İstanbul: ", h("b", {}, d.now || "—"), " · tüm saatler İstanbul saati")),
    errBox(d.errors),
    h("div", { class: "kpis" },
      h("div", { class: "kpi", style: "--c:#e8613c" }, h("b", {}, T.clicks || 0), h("span", {}, "Mağaza linki tıklaması"), h("small", {}, when)),
      h("div", { class: "kpi", style: "--c:#5fb3c4" }, h("b", {}, T.site || 0), h("span", {}, "Siteye giren"), h("small", {}, siteDev ? "%" + pct(phoneSite, siteDev) + " telefondan" : when)),
      h("div", { class: "kpi", style: "--c:#86c79a" }, h("b", {}, T.ext || 0), h("span", {}, "Eklentiyi kullanan"), h("small", {}, when)),
      h("div", { class: "kpi", style: "--c:#e9b44c" }, h("b", {}, T.signups || 0), h("span", {}, "Yeni kayıt"), h("small", {}, when))),
    h("div", { class: "panel" }, h("h3", {}, "Son girenler ", h("span", { class: "dim" }, "(son 15 hareket)")),
      (d.recent || []).length ? h("div", { class: "wrap" }, h("table", {},
        h("tr", {}, ["Saat", "Ne", "Nereden", "Cihaz", "Ülke"].map((t) => h("th", {}, t))),
        d.recent.slice(0, 15).map((r) => h("tr", {}, h("td", { class: "dim dev" }, r.at),
          h("td", {}, h("span", { class: "tag " + (r.kind === "tıklama" ? "warn" : r.kind === "eklenti" ? "ok" : "") }, r.kind === "tıklama" ? "tıkladı" : r.kind === "eklenti" ? "eklenti" : "girdi")),
          h("td", {}, r.what || h("span", { class: "dim" }, r.kind === "eklenti" ? "—" : "doğrudan / bilinmiyor")),
          h("td", { class: "dev" }, r.device ? (DEV[r.device] ? DEV[r.device][2] + " " + DEV[r.device][0] : r.device) + (r.os ? " · " + r.os : "") : h("span", { class: "dim" }, "—")),
          h("td", {}, countryLabel(r.country || "?"))))))
        : h("p", { class: "empty" }, "Henüz kayıt yok. Bu sürümden sonraki ilk tıklama ve girişler burada görünür.")),
    h("div", { class: "grid2" },
      h("div", { class: "panel" }, h("h3", {}, "Telefon mu bilgisayar mı? (siteye girenler)"), donut(DEVS.map((k) => [DEV[k][0], dv.site[k] || 0, DEV[k][1]]), "Site cihaz dağılımı"),
        h("p", { class: "dim" }, "Cihaz bilgisi bu sürümden önceki girişlerde yok; o yüzden sayı kartlardan küçük olabilir.")),
      h("div", { class: "panel" }, h("h3", {}, "Telefon mu bilgisayar mı? (linke tıklayanlar)"), donut(DEVS.map((k) => [DEV[k][0], dv.clicks[k] || 0, DEV[k][1]]), "Tıklama cihaz dağılımı"),
        Object.keys(dv.os).length ? h("p", { class: "dim" }, "Sistem: " + Object.entries(dv.os).map(([k, n]) => k + " " + n).join(" · ")) : "")),

function period(name, value, options) {

}

}
async function viewData() {
  const v = $("view"), inp = h("input", { placeholder: "Talep sahibinin kullanıcı adı ya da e-posta adresi (tam)", autocomplete: "off" }), res = h("div"), fp = h("div");
  const footprint = async (id) => {
    const f = await api("/users/" + id + "/footprint");
    fp.textContent = "";
    fp.append(h("h3", {}, "#" + id + (f.exists ? " için elimizdeki kayıtlar" : ": hesap yok")),
      tbl(["Tablo", "Satır"], f.tables.filter((t) => t.n).map((t) => [t.table, t.n])),
      h("p", {}, f.total ? "Toplam " + f.total + " kayıt." : "Bu kimlik için hiçbir tabloda kayıt kalmamış."));
  };
  const find = async () => {
    res.textContent = ""; fp.textContent = "";
    let list;
    try { list = await api("/data/find", "POST", { query: inp.value }); } catch (e) { res.append(h("p", { class: "err" }, e.message)); return; }
    if (!list.length) { res.append(h("p", { class: "dim" }, "Tam eşleşen hesap yok.")); return; }
    list.forEach((u) => res.append(h("div", { class: "row" }, h("b", {}, u.username), h("span", { class: "dim" }, "#" + u.id + " · kayıt " + u.created + (u.google ? " · Google" : "") + (u.has_email ? " · e-posta kayıtlı" : "")),
      h("button", { onclick: () => footprint(u.id).catch((e) => toast("⚠ " + e.message)) }, "Elimizde ne var"),
      h("button", { onclick: () => act(async () => download("cinevocab-veri-" + u.username + ".json", await api("/users/" + u.id + "/export")), "Dosya indirildi") }, "Verisini indir"),
      h("button", { onclick: () => userDetail(u.id) }, "Hesap sayfası (silme orada)"))));
  };
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") find(); });
  const hy = h("div"), loadHy = async () => {
    const x = await api("/hygiene"); hy.textContent = "";
    hy.append(tbl(["Kayıt", "Adet"], [["Doğrulanmamış kayıt denemesi (1 günden eski)", x.signups_old ?? "—"], ["Süresi geçmiş tek kullanımlık giriş bileti", x.tickets_old ?? "—"],
        ["180 günden eski yönetim kaydı (IP içerir)", x.log_old ?? "—"], ...x.orphans.map((o) => ["Silinmiş hesaptan kalan: " + o.table, o.n])]),
      h("p", { class: "dim" }, "12 aydır girmeyen hesap: " + (x.inactive_12m ?? "—") + " (bunlara dokunulmaz; silmek istersen tek tek karar ver)."),
      h("div", { class: "row" }, h("button", { onclick: async () => { if (!confirm("Listedeki süresi geçmiş ve sahipsiz kayıtlar silinsin mi? Hesaplara dokunulmaz.")) return; await act(() => api("/hygiene/clean", "POST"), "Temizlendi"); loadHy(); } }, "Bunları temizle")));
  };
  put(v,
    h("div", { class: "panel" }, h("h3", {}, "Hesabı bul"),
      h("p", { class: "dim" }, "Biri \"verimi gönder\" ya da \"sil\" derse yazdığı kullanıcı adını ya da e-postayı buraya gir. Yalnızca tam eşleşme bulunur; e-posta adresleri panelde gösterilmez ve aranıp listelenemez."),
      h("div", { class: "bar" }, inp, h("button", { class: "primary", onclick: find }, "Bul")), res, fp),
    h("div", { class: "panel" }, h("h3", {}, "Gereksiz kalan kayıtlar"), hy),
    h("div", { class: "panel" }, h("h3", {}, "Talep gelince"),
      h("p", {}, "1. Talebin hesabın sahibinden geldiğinden emin ol (kayıtlı e-postasından yazmış olmalı ya da hesabına girebiliyor olmalı)."),
      h("p", {}, "2. \"Verisini indir\" dosyasını yalnızca o kişiye gönder. Dosyada parola ve oturum bilgisi yoktur."),
      h("p", {}, "3. Silme isteğinde hesap sayfasından \"Hesabı kalıcı sil\"; sonra burada \"Elimizde ne var\" ile sıfır kaldığını doğrula."),
      h("p", { class: "dim" }, "İndirme, arama ve temizlik işlemleri Günlük sekmesine yazılır.")));
  await loadHy();
}

// ---------- Odalar ----------
async function viewRooms() {
  const rooms = await api("/rooms");
  const v = $("view");
  if (!rooms.length) v.append(h("p", { class: "dim" }, "Şu an açık oda yok."));
  rooms.forEach((r) => v.append(h("div", { class: "panel" },
    h("h3", {}, "Oda " + r.code, " ", h("span", { class: "tag" }, r.state)), h("p", { class: "dim" }, r.episode),
    h("table", {}, r.players.map((p) => h("tr", {}, h("td", {}, p.name), h("td", {}, p.score + " puan"),
      h("td", {}, h("button", { onclick: () => userDetail(p.uid) }, "Kullanıcıya git"))))),
    h("div", { class: "row" }, h("button", { class: "danger", onclick: async () => { await act(() => api("/rooms/" + r.code + "/close", "POST"), "Oda kapatıldı"); go("Odalar"); } }, "Odayı kapat")))));
  v.append(h("button", { onclick: () => go("Odalar") }, "Yenile"));
}

// ---------- Kelimeler ----------
async function viewWords() {
  const box = h("div"), search = h("input", { placeholder: "Kelime ara (kaynak ya da çeviri)…" }), sel = h("select");
  const pairs = await api("/word-pairs");
  pairs.forEach((p) => sel.append(h("option", { value: p.pair }, p.pair.replace(">", " → ") + " (" + p.n + ")")));
  const load = async () => {
    const pair = sel.value, legacy = pair === "tr>en";
    const list = await api("/words?pair=" + encodeURIComponent(pair) + "&q_=" + encodeURIComponent(search.value));
    box.textContent = "";
    box.append(h("div", { class: "wrap" }, h("table", {}, list.map((w) => {
      const inp = h("input", { value: w.eng, style: "width:100%" });
      const save = legacy ? () => api("/words/" + w.id + "/edit", "POST", { eng: inp.value }) : () => api("/words-ml/edit", "POST", { pair, word: w.tr, eng: inp.value });
      const del = legacy ? () => api("/words/" + w.id + "/delete", "POST") : () => api("/words-ml/delete", "POST", { pair, word: w.tr });
      return h("tr", {}, h("td", {}, w.tr), h("td", {}, inp), h("td", { class: "dim" }, w.at),
        h("td", {}, h("button", { onclick: () => act(save, "Kaydedildi") }, "Kaydet"), " ",
          h("button", { class: "danger", onclick: async () => { await act(del, "Silindi"); load(); } }, "Sil")));
    }))));
  };
  search.addEventListener("input", () => { clearTimeout(load.t); load.t = setTimeout(() => load().catch(() => {}), 300); });
  sel.addEventListener("change", () => load().catch(() => {}));
  $("view").append(h("p", { class: "dim" }, "Yanlış çevirileri burada düzeltebilir ya da silebilirsin. Dil çiftini listeden seç. (main.py'deki DICTIONARY her zaman önceliklidir; tr → en dışındaki eski kayıtların tarihi yoktur.)"), h("div", { class: "bar" }, sel, search), box);
  await load();
}

// ---------- Sistem ----------
async function viewSystem() {
  const s = await api("/providers"), v = $("view");
  v.append(h("div", { class: "panel" }, h("h3", {}, "Çeviri servisleri"),
    h("p", { class: this_ok(s) }, s.gcloud_key ? "Resmi Google Cloud Translation anahtarı tanımlı ✔" : "⚠ GOOGLE_TRANSLATE_API_KEY tanımlı değil: ücretsiz uçlar Railway IP'sinde engellenebilir (YouTube'da '?' sorunu)."),
    h("table", {}, Object.entries(s.providers).map(([n, p]) => h("tr", {}, h("td", {}, n),
      h("td", {}, p.blocked_for_s > 0 ? h("span", { class: "tag bad" }, "engelli · " + Math.ceil(p.blocked_for_s / 60) + " dk") : h("span", { class: "tag ok" }, "açık")),
      h("td", { class: "dim" }, "ardışık hata: " + p.fails)))),
    h("p", { class: "dim" }, `Kök bulucu (zeyrek): ${s.lemma_ready ? "hazır" : "yok"} · çevrilemeyen önbellek: ${s.negative_cache} · bekleyen: ${s.deferred}`),
    h("div", { class: "row" }, h("button", { onclick: async () => { await act(() => api("/providers/reset", "POST"), "Engeller sıfırlandı"); go("Sistem"); } }, "Engelleri sıfırla"))));
}
const this_ok = (s) => (s.gcloud_key ? "tag ok" : "err");

// ---------- Günlük ----------
async function viewLog() {
  const rows = await api("/log");
  $("view").append(h("div", { class: "wrap" }, h("table", {},
    h("tr", {}, ["Zaman", "İşlem", "Hedef", "Ayrıntı", "IP"].map((t) => h("th", {}, t))),
    rows.map((r) => h("tr", {}, h("td", { class: "dim" }, r.at), h("td", {}, r.action), h("td", {}, r.target), h("td", {}, r.detail), h("td", { class: "dim" }, r.ip))))));
}
