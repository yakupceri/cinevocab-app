<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineVocab · Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<style>
  .stage { max-width:640px; margin:0 auto; }
  .code { font:800 clamp(56px,16vw,92px)/1 var(--display); letter-spacing:.14em; text-align:center; padding-left:.14em; margin:8px 0 4px; }
  .center { text-align:center; }
  .opts button { position:relative; text-align:left; display:flex; gap:12px; align-items:center; }
  .opts button .k { width:24px; height:24px; border-radius:6px; background:var(--bg2); border:1px solid var(--line2); display:grid; place-items:center; font-size:12px; color:var(--dim); flex:none; }
  .opts button.pick { border-color:var(--accent); background:var(--accent-soft); }
  .d { color:var(--ok); margin-left:10px; font-size:14px; font-weight:700; } .d.x { color:var(--bad); }
  .timer { height:5px; background:var(--line); border-radius:3px; overflow:hidden; } .timer i { display:block; height:100%; width:100%; background:var(--accent); }
</style>
<script src="/static/i18n.js"></script>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="/"><i></i>CineVocab</a>
  <div class="grow"></div>
  <a href="/account" id="back" class="dim small" style="text-decoration:none"></a>
  <div id="tools" class="row" style="gap:6px"></div>
</div></header>
<main class="wrap"><div class="stage" id="app"></div></main>
<script src="/static/common.js"></script>
<script>
const app = document.getElementById("app");
let ws, myId = "", room = null, chosen = null, me = { username: "" }, lastQ = null, mode = "home";
const errBox = el("div", "err");
const setBack = () => { document.getElementById("back").textContent = "← " + t("backToPanel"); };

function connect(first) {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => ws.send(JSON.stringify(first));
  ws.onmessage = (e) => handle(JSON.parse(e.data));
  ws.onclose = () => { if (room) { room = null; home(t("connLost")); } };
}
const send = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
const field = (label, node) => { const w = el("label", "f"); w.append(el("span", "", label), node); return w; };

async function home(error, auto) {
  room = null; mode = "home";
  try {
    const r = await fetch("/api/me");
    if (r.status === 401) { location = "/account"; return; }
    me = await r.json();
  } catch (e) {}
  let saved = null;
  if (auto) { try { saved = JSON.parse(sessionStorage.getItem("cv-duel") || "null"); sessionStorage.removeItem("cv-duel"); } catch (e) {} }
  if (saved && saved.t) { connect(saved); return; }

  const code = el("input"), pw = el("input"), join = el("button", "primary", t("join"));
  code.placeholder = "0000"; code.inputMode = "numeric"; code.maxLength = 4; code.style.cssText = "font:800 28px var(--display);letter-spacing:.3em;text-align:center";
  pw.placeholder = t("roomPwJoin"); pw.maxLength = 30;
  join.onclick = () => { if (!/^\d{4}$/.test(code.value.trim())) { errBox.textContent = t("codeHint"); return; } connect({ t: "join", code: code.value.trim(), password: pw.value }); };
  code.onkeydown = (e) => { if (e.key === "Enter") join.click(); };
  const card = el("div", "card"), form = el("div"); form.style.cssText = "display:grid;gap:10px;margin-top:14px";
  errBox.textContent = error || "";
  form.append(code, pw, join, errBox);
  const mk = el("a"); mk.href = "/account"; mk.className = "dim small"; mk.textContent = t("createInPanel"); mk.style.cssText = "display:block;text-align:center;margin-top:14px";
  card.append(el("h2", "", t("joinRoom")), el("p", "dim", t("joinSub")), form, mk);
  const h = el("div", "head"); const l = el("div"); l.append(el("h1", "", t("gameTitle")), el("p", "", t("gameSub"))); h.append(l);
  app.replaceChildren(h, card);
}

function playerList(rows, opts = {}) {
  const ul = el("ul", "players");
  rows.forEach((p, i) => {
    const li = el("li");
    li.append(opts.rank ? el("span", "rk", i + 1) : el("span", "av", (p.name || "?").slice(0, 1).toUpperCase()));
    const nm = el("span", "nm", p.name + (p.id === myId ? "" : ""));
    if (p.id === myId) nm.append(el("span", "tag", t("you")));
    if (opts.host && p.id === opts.host) nm.append(el("span", "tag", t("host")));
    li.append(nm);
    if (p.score !== undefined) {
      const r = el("span"); r.append(el("b", "", p.score));
      if (opts.delta && p.delta !== undefined) r.append(el("span", "d" + (p.ok ? "" : " x"), p.ok ? "+" + p.delta : "✗"));
      li.append(r);
    }
    ul.append(li);
  });
  return ul;
}

function lobby(info) {
  mode = "lobby";
  const card = el("div", "card center"), start = el("button", "primary", t("startGame")), copy = el("button", "", t("copyCode")), leave = el("button", "ghost", t("leave"));
  start.onclick = () => send({ t: "start" });
  copy.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(info.code); copy.textContent = t("copied"); setTimeout(() => (copy.textContent = t("copyCode")), 1500); };
  leave.onclick = () => { room = null; ws.close(); home(); };
  const meta = [info.episode || t("allWords"), langName(info.src || "tr") + " → " + langName(info.dst || "en"), t("nQuestions", info.n || 10), (info.seconds || 12) + " " + t("secShort")];
  if (info.locked) meta.push(t("locked"));
  const m = el("p", "dim small", meta.join(" · "));
  const pl = el("div"); pl.style.cssText = "text-align:left;margin-top:18px"; pl.append(playerList(info.players, { host: info.host }));
  const act = el("div", "row"); act.style.cssText = "justify-content:center;margin-top:18px";
  act.append(copy, leave);
  card.append(el("p", "dim small", t("room")), el("div", "code", info.code), m, el("p", "dim", t("shareCode")), pl);
  if (info.host === myId) { start.disabled = info.players.length < 1; start.style.cssText = "width:100%;margin-top:16px"; card.append(start); }
  else { const w = el("p", "dim", t("waitHost")); w.style.marginTop = "16px"; card.append(w); }
  errBox.textContent = ""; card.append(act, errBox);
  app.replaceChildren(card);
}

function handle(m) {
  if (m.t === "me") myId = m.id;
  else if (m.t === "room") { room = m; if (mode !== "play") lobby(m); else room = m; }
  else if (m.t === "error") { const msg = I18N.err(m.msg); if (room) { errBox.textContent = msg; toast(msg); } else { ws.close(); home(msg); } }
  else if (m.t === "question") question(m);
  else if (m.t === "reveal") reveal(m);
  else if (m.t === "end") finish(m);
}

function question(m) {
  mode = "play"; chosen = null; lastQ = m;
  const card = el("div", "card"), top = el("div", "row");
  top.append(el("span", "dim small grow", t("qOf", m.idx + 1, m.total)), el("span", "dim small", t("fastBonus")));
  const bar = el("div", "timer"), fill = el("i"); bar.append(fill);
  const grid = el("div", "opts");
  m.options.forEach((o, i) => {
    const b = el("button"); b.dataset.opt = o; b.append(el("span", "k", i + 1), el("span", "", o));
    b.onclick = () => pick(b, o, grid); grid.append(b);
  });
  top.style.marginBottom = "8px";
  card.append(top, bar, el("div", "qword", m.tr), grid);
  app.replaceChildren(card);
  fill.style.transition = `width ${m.seconds}s linear`;
  requestAnimationFrame(() => requestAnimationFrame(() => (fill.style.width = "0%")));
}
function pick(btn, opt, grid) {
  if (chosen !== null) return;
  chosen = opt; btn.classList.add("pick");
  grid.querySelectorAll("button").forEach((b) => (b.disabled = true));
  send({ t: "answer", choice: opt });
}
function reveal(m) {
  app.querySelectorAll(".opts button").forEach((b) => {
    b.disabled = true; b.classList.remove("pick");
    if (b.dataset.opt === m.correct) b.classList.add("ok"); else if (b.dataset.opt === chosen) b.classList.add("no");
  });
  const rows = [...m.results].sort((a, b) => b.score - a.score), c = el("div", "card");
  c.style.marginTop = "14px"; c.append(playerList(rows, { delta: true, rank: true }));
  const old = app.querySelector(".rv"); if (old) old.remove(); c.classList.add("rv");
  app.append(c);
}
function finish(m) {
  mode = "lobby";
  const top = m.scores[0], tie = m.scores.length > 1 && m.scores[1].score === top.score;
  const card = el("div", "card center"), again = el("button", "primary", t("playAgain")), leave = el("button", "", t("leave"));
  again.onclick = () => { if (room && room.host === myId) send({ t: "start" }); };
  leave.onclick = () => { room = null; ws.close(); home(); };
  const pl = el("div"); pl.style.cssText = "text-align:left;margin-top:16px"; pl.append(playerList(m.scores, { rank: true }));
  const act = el("div", "row"); act.style.cssText = "justify-content:center;margin-top:16px";
  if (room && room.host === myId) act.append(again);
  act.append(leave);
  card.append(el("p", "dim small", t("gameOver")), el("h1", "", tie ? t("tie") : t("winner", top.name)), pl, act);
  if (!(room && room.host === myId)) { const w = el("p", "dim small", t("hostRestarts")); w.style.marginTop = "12px"; card.append(w); }
  app.replaceChildren(card);
}

document.addEventListener("keydown", (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const n = parseInt(e.key, 10), btns = app.querySelectorAll(".opts button");
  if (n >= 1 && n <= btns.length && !btns[n - 1].disabled) btns[n - 1].click();
});

I18N.onChange(() => { mountTools(document.getElementById("tools")); setBack(); document.title = "CineVocab · " + t("nav_duel"); if (mode === "home") home(); else if (mode === "lobby" && room) lobby(room); });
mountTools(document.getElementById("tools")); setBack(); document.title = "CineVocab · " + t("nav_duel");
home("", true);
</script>
</body>
</html>
