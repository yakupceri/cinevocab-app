<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineVocab</title>
<meta name="description" content="CineVocab turns subtitles on Prime Video, YouTube and Udemy into a word list you can practise: any language pair, one toggle in the extension.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<style>
  .hero { display:grid; grid-template-columns:1.1fr .9fr; gap:48px; align-items:center; padding:7vh 0 5vh; }
  @media (max-width:820px) { .hero { grid-template-columns:1fr; gap:30px; padding-top:3vh; } }
  .hero h1 { font-size:clamp(36px,6vw,64px); line-height:1.02; letter-spacing:-.03em; }
  .lead { font-size:18px; color:var(--dim); max-width:520px; margin:18px 0 26px; }
  .btn { display:inline-flex; align-items:center; min-height:46px; padding:0 22px; border-radius:11px; font-weight:700; text-decoration:none; border:1px solid var(--line2); background:var(--panel2); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .screen { background:linear-gradient(160deg,#1a2030,#0a0d13 70%); border-radius:16px; aspect-ratio:16/10; display:flex; align-items:flex-end; justify-content:center; padding:0 18px 7%; box-shadow:var(--shadow); border:1px solid var(--line); position:relative; overflow:hidden; }
  .screen::before { content:""; position:absolute; inset:0; background:radial-gradient(60% 70% at 70% 20%, rgba(255,212,71,.14), transparent 70%); }
  .screen .subs { position:relative; width:100%; background:rgba(0,0,0,.78); transition:opacity .35s; }
  .screen .tag2 { position:absolute; top:14px; left:16px; font-size:12px; font-weight:700; color:#cfd6e4; background:rgba(255,255,255,.08); padding:3px 10px; border-radius:99px; }
  .steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin:6vh 0 2vh; }
  .steps .card h2 { margin-bottom:8px; font-size:19px; } .steps .card + .card { margin-top:0; }
  .feat { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; margin:4vh 0; background:var(--panel); }
  .feat div { padding:20px; border-left:1px solid var(--line); } .feat div:first-child { border-left:0; }
  .feat h3 { margin-bottom:6px; } .feat p { color:var(--dim); font-size:14px; }
  footer { border-top:1px solid var(--line); padding:26px 0 10px; color:var(--dim); font-size:14px; } footer a { margin-right:18px; }
</style>
<script src="/static/i18n.js"></script>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="/"><i></i>CineVocab</a>
  <div class="grow"></div>
  <div id="tools" class="row" style="gap:6px"></div>
  <a class="btn" href="/account" data-i="login" style="min-height:38px;padding:0 16px"></a>
</div></header>
<main class="wrap" style="padding-bottom:40px">
  <section class="hero">
    <div>
      <h1 data-i="landH1"></h1>
      <p class="lead" data-i="landLead"></p>
      <div class="row"><a class="btn primary" href="/account" data-i="landCta"></a><a class="btn" href="#how" data-i="landHow"></a></div>
      <p class="dim small" style="margin-top:18px" data-i="landSites"></p>
    </div>
    <div class="screen" aria-hidden="true">
      <span class="tag2" id="pairTag"></span>
      <div class="subs" id="demo"><div class="ws" id="demoWs"></div></div>
    </div>
  </section>

  <section class="steps" id="how">
    <div class="card"><h2 data-i="landS1T"></h2><p class="dim" data-i="landS1"></p></div>
    <div class="card"><h2 data-i="landS2T"></h2><p class="dim" data-i="landS2"></p></div>
    <div class="card"><h2 data-i="landS3T"></h2><p class="dim" data-i="landS3"></p></div>
  </section>

  <section class="feat">
    <div><h3 data-i="nav_words"></h3><p data-i="landF1"></p></div>
    <div><h3 data-i="nav_videos"></h3><p data-i="landF2"></p></div>
    <div><h3 data-i="nav_known"></h3><p data-i="landF3"></p></div>
    <div><h3 data-i="nav_duel"></h3><p data-i="landF4"></p></div>
  </section>

  <footer>
    <a href="/account" data-i="landAccount"></a><a href="/privacy" data-i="landPrivacy"></a>
    <p style="margin-top:12px" data-i="landDisclaimer"></p>
  </footer>
</main>
<script src="/static/common.js"></script>
<script>
const DEMOS = [
  { pair: ["fr", "en"], w: [["Je", "I"], ["ne", ""], ["sais", "know"], ["pas", "not"], ["pourquoi", "why"]] },
  { pair: ["tr", "en"], w: [["Bunu", "this"], ["sana", "to you"], ["söylemeliydim", "I should have told"]] },
  { pair: ["it", "en"], w: [["Non", "not"], ["ti", "you"], ["preoccupare", "worry"], ["amico", "friend"]] },
  { pair: ["es", "tr"], w: [["Nunca", "asla"], ["es", ""], ["tarde", "geç"]] },
];
let di = 0;
function showDemo() {
  const d = DEMOS[di % DEMOS.length], ws = document.getElementById("demoWs");
  document.getElementById("pairTag").textContent = langName(d.pair[0]) + " → " + langName(d.pair[1]);
  ws.replaceChildren(...d.w.map(([a, b]) => { const s = el("span", b ? "" : "k"); s.append(el("b", "", a), el("small", "", b)); return s; }));
}
showDemo();
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  setInterval(() => { const s = document.getElementById("demo"); s.style.opacity = 0; setTimeout(() => { di++; showDemo(); s.style.opacity = 1; }, 350); }, 3600);
}
I18N.onChange(() => { mountTools(document.getElementById("tools")); showDemo(); });
mountTools(document.getElementById("tools"));
</script>
</body>
</html>
