<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineVocab</title>
<meta name="description" content="CineVocab turns subtitles on Prime Video, YouTube and Udemy into a word list you can practise: any language pair, one toggle in the extension.">
<link rel="stylesheet" href="/static/app.css?v={{ ASSET_V }}">
<style>
  .hero { min-height:76vh; display:grid; grid-template-columns:1.1fr .9fr; gap:48px; align-items:center; padding:7vh 0 5vh; }
  @media (max-width:820px) { .hero { grid-template-columns:1fr; gap:30px; padding-top:3vh; } }
  .hero h1 { font-size:clamp(40px,6.4vw,68px); line-height:1; letter-spacing:.01em; text-wrap:balance; }
  .lead { margin:18px 0 26px; }
  .logo-big { width:88px; height:88px; display:block; margin:0 0 22px; }
  /* Film karesi iki temada da koyu (mobildeki "Gece Seansı" kuralı) */
  .screen { background:#0A0507; border-radius:var(--r-card); aspect-ratio:16/10; display:flex; align-items:flex-end; justify-content:center; padding:0 18px 7%; border:1px solid #3D3035; position:relative; overflow:hidden; }
  .screen .subs { position:relative; width:100%; background:#000; border-color:transparent; color:#F3E9D2; transition:opacity .35s; }
  .screen .tag2 { position:absolute; top:14px; left:16px; font:600 12px/1 var(--mono); letter-spacing:.02em; color:#AC9C92; border:1px solid #3D3035; padding:6px 10px; border-radius:6px; }
  .screen .ws .w { all:unset; box-sizing:border-box; cursor:pointer; display:inline-flex; flex-direction:column; align-items:center; line-height:1.15; padding:3px 7px; border-radius:6px; min-width:44px; min-height:44px; justify-content:center; }   /* dokunma hedefi en az 44 px */
  .screen .ws .w:hover { background:#25161C; }
  .screen .ws .w:focus-visible { outline:2px solid #FFD21E; outline-offset:2px; }
  .screen .ws .w.star { background:#FFD21E; } .screen .ws .w.star b, .screen .ws .w.star small { color:#170E12; opacity:1; }
  .demo .dh { margin-top:12px; color:var(--dim); font-size:14px; min-height:1.55em; }
  #how { scroll-margin-top:76px; padding-top:4vh; }
  .steps .no { font:600 13px/1 var(--mono); letter-spacing:.06em; color:var(--accent); display:block; margin-bottom:14px; }
  .steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin:0 0 2vh; }
  .steps .card h2 { margin-bottom:8px; font-size:19px; } .steps .card + .card { margin-top:0; }
  .feat { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0; border:1px solid var(--line); border-radius:var(--r-card); overflow:hidden; margin:4vh 0; background:var(--panel); }
  .feat div { padding:20px; border-left:1px solid var(--line); } .feat div:first-child { border-left:0; }
  .feat h3 { margin-bottom:6px; } .feat p { color:var(--dim); font-size:14px; }
</style>
<script src="/static/i18n.js?v={{ ASSET_V }}"></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#170E12">
<link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})})</script>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="/"><i></i>CineVocab</a>
  <div class="grow"></div>
  <div id="tools"></div>
  <a class="btn" href="/account" data-i="login"></a>
</div></header>
<main class="wrap" style="padding-bottom:40px">
  <section class="hero">
    <div>
      <img class="logo-big" src="/static/icons/favicon.svg" alt="" width="88" height="88">
      <h1 data-i="landH1"></h1>
      <p class="lead" data-i="landLead"></p>
      <div class="row"><a class="btn primary" href="/account" data-i="landCta"></a><a class="btn" href="/match" data-i="mtTitle"></a><a class="btn" href="#how" data-i="landHow"></a><a class="btn" href="/explore" data-i="expNav"></a></div>
      <p class="dim small" style="margin-top:18px" data-i="landSites"></p>
    </div>
    <div class="demo">
      <div class="screen">
        <span class="tag2" id="pairTag"></span>
        <div class="subs" id="demo"><div class="ws" id="demoWs"></div></div>
      </div>
      <p class="dh" id="demoHint" data-i="landHint" aria-live="polite"></p>
    </div>
  </section>

  <section id="how">
    <div class="head"><div><h2 data-i="landHowT"></h2><p data-i="landHowSub"></p></div></div>
    <div class="steps">
      <div class="card"><span class="no">1</span><h2 data-i="landS1T"></h2><p class="dim" data-i="landS1"></p></div>
      <div class="card"><span class="no">2</span><h2 data-i="landS2T"></h2><p class="dim" data-i="landS2"></p></div>
      <div class="card"><span class="no">3</span><h2 data-i="landS3T"></h2><p class="dim" data-i="landS3"></p></div>
    </div>
  </section>

  <section class="feat">
    <div><h3 data-i="nav_words"></h3><p data-i="landF1"></p></div>
    <div><h3 data-i="nav_videos"></h3><p data-i="landF2"></p></div>
    <div><h3 data-i="nav_known"></h3><p data-i="landF3"></p></div>
    <div><h3 data-i="nav_duel"></h3><p data-i="landF4"></p></div>
  </section>

  <footer>
    <a href="/match" data-i="mtTitle"></a><a href="/explore" data-i="expNav"></a><a href="/account" data-i="landAccount"></a><a href="/privacy" data-i="landPrivacy"></a>
<p class="dim small" style="margin-top:12px"><a href="/learn/en" style="margin-right:0">English</a> · <a href="/learn/es" style="margin-right:0">Español</a> · <a href="/learn/fr" style="margin-right:0">Français</a> · <a href="/learn/de" style="margin-right:0">Deutsch</a> · <a href="/learn/it" style="margin-right:0">Italiano</a> · <a href="/learn/pt" style="margin-right:0">Português</a> · <a href="/learn/ru" style="margin-right:0">Русский</a> · <a href="/learn/ja" style="margin-right:0">日本語</a> · <a href="/learn/ko" style="margin-right:0">한국어</a></p>
    <p style="margin-top:12px" data-i="landDisclaimer"></p>
  </footer>
</main>
<script src="/static/common.js?v={{ ASSET_V }}"></script>
<script>
const DEMOS = [
  { pair: ["fr", "en"], w: [["Je", "I"], ["ne", ""], ["sais", "know"], ["pas", "not"], ["pourquoi", "why"]] },
  { pair: ["tr", "en"], w: [["Bunu", "this"], ["sana", "to you"], ["söylemeliydim", "I should have told"]] },
  { pair: ["it", "en"], w: [["Non", "not"], ["ti", "you"], ["preoccupare", "worry"], ["amico", "friend"]] },
  { pair: ["es", "tr"], w: [["Nunca", "asla"], ["es", ""], ["tarde", "geç"]] },
];
let di = 0;
function showDemo() {
  const d = DEMOS[di % DEMOS.length], ws = document.getElementById("demoWs");
  document.getElementById("pairTag").textContent = langName(d.pair[0]) + " → " + langName(d.pair[1]);
  ws.replaceChildren(...d.w.map(([a, b]) => {
    if (!b) { const s = el("span", "k"); s.append(el("b", "", a), el("small", "", "")); return s; }   // çevirisi olmayan sözcük: tıklanmaz
    const s = el("button", "w"); s.type = "button"; s.setAttribute("aria-pressed", "false");
    s.append(el("b", "", a), el("small", "", b));
    s.onclick = () => { const on = s.classList.toggle("star"); s.setAttribute("aria-pressed", on ? "true" : "false"); setHint(); };
    return s;
  }));
  setHint();
}
// Kaydedilen kelime varsa "kaydedildi" notu, yoksa yönlendirme (dil değişince de doğru metin)
function setHint() {
  const h = document.getElementById("demoHint"), key = document.querySelector("#demoWs .star") ? "landKept" : "landHint";
  h.setAttribute("data-i", key); h.textContent = I18N.t(key);
}
showDemo();
// Örnek cümle yedi saniyede bir değişir; üstüne gelince, klavye odağındayken ya da kelime kaydedilmişken durur
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const box = document.querySelector(".screen");
  setInterval(() => {
    if (box.matches(":hover") || box.querySelector(":focus-visible") || document.querySelector("#demoWs .star")) return;
    const s = document.getElementById("demo"); s.style.opacity = 0; setTimeout(() => { di++; showDemo(); s.style.opacity = 1; }, 350);
  }, 7000);
}
I18N.onChange(() => { mountTools(document.getElementById("tools")); showDemo(); });
mountTools(document.getElementById("tools"));
// Girişliysen sağ üstte "Giriş yap" yerine "Hesabım" yazsın
fetch("/api/me").then((r) => (r.ok ? r.json() : null)).then((me) => {
  if (!me) return;
  const b = document.querySelector("header .btn[href='/account']");
  if (b) { b.setAttribute("data-i", "landAccount"); b.textContent = I18N.t("landAccount"); }
}).catch(() => {});
</script>
</body>
</html>
