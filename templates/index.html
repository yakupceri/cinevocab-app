<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVocab - Kelime Arşivim</title>
    <!-- Tailwind CSS ile modern ve şık bir görünüm -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <!-- Başlık -->
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h1 class="text-3xl font-bold tracking-wider text-indigo-400">🎬 CineVocab</h1>
            <span class="text-sm bg-gray-800 text-gray-300 px-3 py-1 rounded-full border border-gray-700">Lost S1 E1</span>
        </header>

        <!-- İstatistik veya Bilgi Kartı -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg">
                <h2 class="text-gray-400 text-sm font-medium">Toplam Kaydedilen Kelime</h2>
                <p id="word-count" class="text-3xl font-bold text-white mt-1">0</p>
            </div>
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg">
                <h2 class="text-gray-400 text-sm font-medium">Sistem Durumu</h2>
                <p class="text-green-400 font-semibold mt-1 flex items-center gap-2">
                    <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span> Aktif & Dinleniyor
                </p>
            </div>
        </div>

        <!-- Kelimeler Tablosu -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-lg overflow-hidden">
            <div class="p-4 border-b border-gray-700 font-semibold text-gray-200">Son Yakalanan Kelimeler</div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-900/50 text-gray-400 text-xs uppercase tracking-wider">
                            <th class="p-4">#ID</th>
                            <th class="p-4">İngilizce (Orijinal)</th>
                            <th class="p-4">Türkçe Çeviri</th>
                            <th class="p-4">Zaman</th>
                        </tr>
                    </thead>
                    <tbody id="words-table-body" class="divide-y divide-gray-700 text-sm">
                        <!-- JavaScript ile dinamik doldurulacak -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchWords() {
            try {
                let response = await fetch('/words');
                let words = await response.json();
                
                let tbody = document.getElementById('words-table-body');
                let countElem = document.getElementById('word-count');
                tbody.innerHTML = '';
                
                countElem.innerText = words.length;

                if (words.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-gray-500">Henüz kelime yakalanmadı. Diziyi izlemeye başla!</td></tr>`;
                    return;
                }

                words.forEach(word => {
                    let tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-750 transition-colors";
                    
                    let dateStr = new Date(word.created_at).toLocaleTimeString('tr-TR');

                    tr.innerHTML = `
                        <td class="p-4 text-gray-400">${word.id}</td>
                        <td class="p-4 font-semibold text-indigo-300">${word.eng}</td>
                        <td class="p-4 text-emerald-300">${word.tr}</td>
                        <td class="p-4 text-gray-400 text-xs">${dateStr}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Kelimeler yüklenirken hata oluştu:", error);
            }
        }

        // Sayfa açıldığında yükle ve her 3 saniyede bir otomatik güncelle (Canlı Akış)
        fetchWords();
        setInterval(fetchWords, 3000);
    </script>
</body>
</html>
