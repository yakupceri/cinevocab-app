<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineVocab · Word Match</title>
<meta name="description" content="A free word matching game: pair each word with its translation before the time runs out. No account, nothing to install.">
<link rel="stylesheet" href="/static/app.css?v={{ ASSET_V }}">
<style>
  .stage { max-width:560px; margin:0 auto; }
  .hud { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:10px; }
  .hud div { background:var(--panel); border:1px solid var(--line); border-radius:var(--r-card); padding:8px 10px; text-align:center; }
  .hud small { display:block; font:500 11px/1.2 var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  .hud b { font:800 26px/1.1 var(--display); font-variant-numeric:tabular-nums; }
  .hud .hot b { color:var(--accent); }
  .tbar { margin-bottom:12px; } .tbar i { background:var(--fill); transition:width .25s linear; }
  /* Tahta: dört sütun, her sütunda taşlar yukarıdan düşer. Film karesi gibi iki temada da koyu. */
  .board { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; background:#0A0507; border:1px solid #3D3035; border-radius:var(--r-card); padding:8px; height:min(62vh,440px); }
  .col { display:flex; flex-direction:column; justify-content:flex-end; gap:6px; min-width:0; }
  .tile { all:unset; box-sizing:border-box; cursor:pointer; flex:0 0 calc((100% - 24px) / 5); min-height:44px; display:grid; place-items:center; text-align:center; padding:2px 4px; border-radius:6px;
    background:#25161C; border:1px solid #3D3035; color:#F3E9D2; font:600 14px/1.15 var(--sans); overflow-wrap:anywhere; hyphens:auto; animation:drop .28s ease-out; }
  .tile.src { background:#321E26; font:800 17px/1.1 var(--display); letter-spacing:.01em; }
  .tile.long { font-size:12.5px; } .tile.src.long { font-size:14px; }   /* uzun kelime taşta bölünmesin */
  .tile:hover { border-color:#6B5B52; }
  .tile:focus-visible { outline:2px solid #FFD21E; outline-offset:1px; }
  .tile.sel { background:#FFD21E; border-color:#FFD21E; color:#170E12; }
  .tile.pop { animation:pop .26s ease-in forwards; pointer-events:none; }
  .tile.bad { animation:bad .3s; border-color:#C2283A; }
  @keyframes drop { from { transform:translateY(-140%); opacity:.2; } to { transform:none; opacity:1; } }
  @keyframes pop { 40% { transform:scale(1.12); background:#7BD39A; color:#0D2416; } to { transform:scale(.2); opacity:0; } }
  @keyframes bad { 25% { transform:translateX(-5px); } 75% { transform:translateX(5px); } }
  @media (prefers-reduced-motion: reduce) { .tile, .tile.pop, .tile.bad { animation:none; } .tile.pop { opacity:0; } .tbar i { transition:none; } }
  .intro h1 { font-size:clamp(34px,7vw,52px); line-height:1; margin-bottom:10px; }
  .intro .btn.primary, .over .btn.primary { width:100%; min-height:52px; font-size:19px; margin-top:16px; }
  .how { margin:14px 0 0; padding:0; list-style:none; color:var(--dim); } .how li { padding:8px 0; border-top:1px solid var(--line); }
  .pairsel { display:flex; gap:8px; align-items:center; margin-top:14px; } .pairsel select { flex:1; }
  .over .big { font:800 72px/1 var(--display); color:var(--accent); font-variant-numeric:tabular-nums; margin:6px 0; }
  .miss { margin:14px 0 0; padding:0; list-style:none; text-align:left; } .miss li { display:flex; gap:10px; justify-content:space-between; padding:9px 0; border-top:1px solid var(--line); } .miss li span { color:var(--dim); }
  .getbox { margin-top:14px; text-align:left; } .getbox p { color:var(--dim); margin:4px 0 12px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
</style>
<script src="/static/i18n.js?v={{ ASSET_V }}"></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#170E12">
<link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="/"><i></i>CineVocab</a>
  <div class="grow"></div>
  <div id="tools"></div>
</div></header>
<main class="wrap"><div class="stage" id="app"></div></main>
<script src="/static/common.js?v={{ ASSET_V }}"></script>
<script src="/static/fx.js?v={{ ASSET_V }}"></script>
<script>
// Eşleştirme oyunu: kelimeyle çevirisini seç, ikisi patlar, üstten yenileri düşer. Hesap yok; skor yalnızca bu tarayıcıda durur.
const app = document.getElementById("app");
const ROUND = 75, COLS = 4, ROWS = 5, START_PAIRS = 8;      // 75 sn; tahtada en çok 20 taş, başlangıçta 8 çift
let P = null, PAIRS = [], G = null, timer = null, view = "intro";
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const bestKey = () => "cv-match-best:" + P.src + ":" + P.dst;
const best = () => Number(store.get(bestKey())) || 0;
const pairLabel = (p) => langName(p.src) + " → " + langName(p.dst);
const shell = (...n) => app.replaceChildren(...n);

async function choosePair() {
  const u = new URLSearchParams(location.search), s = u.get("src"), d = u.get("dst");
  let want = null;
  if (s && d && PAIR_LANGS.includes(s) && PAIR_LANGS.includes(d) && s !== d) want = { src: s, dst: d };
  if (!want) { const [a, b] = (store.get("cv-match-pair") || store.get("cv-pair") || "").split(":"); if (PAIR_LANGS.includes(a) && PAIR_LANGS.includes(b) && a !== b) want = { src: a, dst: b }; }
  try { PAIRS = (await api("/api/match/pairs")).pairs || []; } catch (e) { PAIRS = []; }
  const has = (p) => p && PAIRS.some((x) => x.src === p.src && x.dst === p.dst);
  if (has(want)) return want;
  const ui = I18N.lang;                                    // çevirisi arayüz dilinde olan en dolu çift, yoksa en dolu çift
  return PAIRS.find((x) => x.dst === ui) || PAIRS.find((x) => x.src === ui) || PAIRS[0] || want || { src: "en", dst: "tr" };
}

function intro(msg) {
  view = "intro"; clearInterval(timer);
  const c = el("div", "card intro");
  c.append(el("h1", "", t("mtTitle")), el("p", "dim", t("mtSub")));
  if (PAIRS.length) {
    const row = el("div", "pairsel"), sel = el("select");
    sel.setAttribute("aria-label", t("mtPick"));
    PAIRS.forEach((p) => { const o = new Option(pairLabel(p), p.src + ":" + p.dst); sel.append(o); });
    sel.value = P.src + ":" + P.dst;
    sel.onchange = () => { const [a, b] = sel.value.split(":"); P = { src: a, dst: b }; store.set("cv-match-pair", sel.value); intro(); };
    row.append(sel); c.append(row);
  }
  const go = ibtn("practice", t("mtStart"), "btn primary"); go.id = "start"; go.onclick = start;
  if (!PAIRS.length) { go.disabled = true; c.append(el("p", "dim", t("mtNoPair"))); }
  if (msg) c.append(el("p", "dim", msg));
  c.append(go);
  if (best()) c.append(el("p", "dim small center", t("mtBest", best())));
  const how = el("ul", "how"); [t("mtHow1"), t("mtHow2"), t("mtHow3")].forEach((x) => how.append(el("li", "", x)));
  c.append(how);
  shell(c);
}

async function start() {
  let d;
  try { d = await api("/api/match/words?src=" + P.src + "&dst=" + P.dst); } catch (e) { return intro(e.message); }
  if (!d.ready || d.words.length < START_PAIRS) return intro(t("mtNoPair"));
  G = { queue: shuf(d.words), left: ROUND, score: 0, combo: 0, maxCombo: 0, matched: 0, missed: new Map(), sel: null, cols: [], busy: false, uid: 0 };
  view = "play";
  const hud = el("div", "hud");
  const cell = (id, lab, cls) => { const x = el("div", cls || ""); const b = el("b", "", "0"); b.id = id; x.append(el("small", "", lab), b); return x; };
  hud.append(cell("hScore", t("mtScore")), cell("hCombo", t("mtCombo"), "hot"), cell("hTime", t("mtTime")));
  const tb = el("div", "tbar"), ti = el("i"); ti.id = "tfill"; ti.style.width = "100%"; tb.append(ti);
  const board = el("div", "board"); board.id = "board"; board.setAttribute("role", "group"); board.setAttribute("aria-label", t("mtTitle"));
  for (let i = 0; i < COLS; i++) { const c = el("div", "col"); G.cols.push(c); board.append(c); }
  const live = el("p", "sr"); live.id = "live"; live.setAttribute("aria-live", "polite");
  shell(hud, tb, board, live);
  for (let i = 0; i < START_PAIRS; i++) addPair();
  paint(); FX.play("go");
  clearInterval(timer);
  timer = setInterval(() => { G.left--; paint(); if (G.left <= 5 && G.left > 0) FX.play("tick"); if (G.left <= 0) finish(); }, 1000);
}

function paint() {
  document.getElementById("hScore").textContent = G.score;
  document.getElementById("hCombo").textContent = G.combo > 1 ? "x" + G.combo : "–";
  document.getElementById("hTime").textContent = Math.max(0, G.left);
  document.getElementById("tfill").style.width = Math.max(0, (G.left / ROUND) * 100) + "%";
}

// Yeni çift her zaman İKİ taşıyla birlikte gelir (tahta hep çözülebilir kalır). Taşlar en boş sütunların üstüne düşer.
function addPair() {
  if (!G.queue.length || G.cols.reduce((a, c) => a + c.children.length, 0) > COLS * ROWS - 2) return false;
  const p = G.queue.pop(), id = ++G.uid;
  for (const [text, side] of shuf([[p.w, "src"], [p.t, "dst"]])) {
    const free = G.cols.filter((c) => c.children.length < ROWS), min = Math.min(...free.map((c) => c.children.length));
    const col = shuf(free.filter((c) => c.children.length === min))[0];
    const b = el("button", "tile " + side + (text.length > 9 ? " long" : ""), text); b.type = "button"; b.dataset.pair = id; b.dataset.side = side; b.lang = side === "src" ? P.src : P.dst;
    b._p = p; b.setAttribute("aria-pressed", "false"); b.onclick = () => tap(b);
    col.prepend(b);
  }
  return true;
}

function tap(b) {
  if (view !== "play" || b.classList.contains("pop")) return;
  if (G.sel === b) { b.classList.remove("sel"); b.setAttribute("aria-pressed", "false"); G.sel = null; return; }
  if (!G.sel) { G.sel = b; b.classList.add("sel"); b.setAttribute("aria-pressed", "true"); return; }
  const a = G.sel; G.sel = null; a.classList.remove("sel"); a.setAttribute("aria-pressed", "false");
  if (a.dataset.pair === b.dataset.pair) {
    G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); G.matched++;
    const gain = 10 * Math.min(G.combo, 5); G.score += gain;
    a.classList.add("pop"); b.classList.add("pop");
    FX.float(b, "+" + gain); FX.play(G.combo > 2 ? "combo" : "correct"); FX.vibrate(15);
    document.getElementById("live").textContent = a._p.w + " = " + a._p.t;
    setTimeout(() => { a.remove(); b.remove(); if (view !== "play") return; addPair(); if (G.cols.every((c) => !c.children.length)) finish(); }, FX.reduce ? 0 : 240);
  } else {
    G.combo = 0;                                            // yanlış eşleşen iki kelime de tur sonunda "tekrar bak" listesine girer
    [a, b].forEach((x) => { G.missed.set(x._p.w, x._p.t); x.classList.remove("bad"); void x.offsetWidth; x.classList.add("bad"); });
    FX.play("wrong"); FX.vibrate([20, 40, 20]);
  }
  paint();
}

function finish() {
  if (view !== "play") return;
  view = "over"; clearInterval(timer);
  const isBest = G.score > best(); if (isBest) store.set(bestKey(), String(G.score));
  const c = el("div", "card center over");
  c.append(el("p", "eyebrow", pairLabel(P)), el("h2", "", t(isBest && G.score ? "mtNewBest" : "mtOver")));
  const big = el("div", "big", "0"); c.append(big); FX.count(big, G.score, 700);
  c.append(el("p", "dim", t("mtMatched", G.matched) + (G.maxCombo > 1 ? " · " + t("mtMaxCombo", G.maxCombo) : "")));
  if (G.missed.size) {
    const h = el("h3", "", t("mtMissed")); h.style.cssText = "margin-top:18px;text-align:left"; c.append(h);
    const ul = el("ul", "miss"); [...G.missed].slice(0, 8).forEach(([w, tr]) => { const li = el("li"); li.append(el("b", "", w), el("span", "", tr)); ul.append(li); }); c.append(ul);
  }
  const again = ibtn("practice", t("mtAgain"), "btn primary"); again.id = "again"; again.onclick = start; c.append(again);
  const row = el("div", "row2"), sh = ibtn("share", t("mtShare"), "btn"), home = el("a", "btn", t("mtChange")); home.href = "/match"; home.onclick = (e) => { e.preventDefault(); intro(); };
  sh.id = "share"; sh.onclick = share; row.append(sh, home); c.append(row);
  const g = el("div", "card getbox"); g.append(el("h3", "", t("mtGetT")), el("p", "", t("mtGetSub")));
  const a = el("a", "btn", t("mtGet")); a.href = "/get?src=match" + (I18N.lang === "tr" ? "&hl=tr" : ""); a.rel = "noopener"; g.append(a);
  shell(c, g);
  if (isBest && G.score) { FX.play("win"); FX.confetti(1); } else FX.play("level");
}

async function share() {
  const url = location.origin + "/match?src=" + P.src + "&dst=" + P.dst, text = t("mtShareTxt", G.score, pairLabel(P));
  try { if (navigator.share) { await navigator.share({ text, url }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text + " " + url); toast(t("mtCopied")); } catch (e) { toast(url); }
}

document.addEventListener("visibilitychange", () => { if (document.hidden && view === "play") finish(); });   // sekme gizlenince süre arkada akmasın
I18N.onChange(() => { mountTools(document.getElementById("tools")); if (view === "intro") intro(); });
mountTools(document.getElementById("tools"));
choosePair().then((p) => { P = p; intro(); });
</script>
</body>
</html>
