const WIDE = FMT === "wide", W = WIDE ? 1920 : 1080, H = WIDE ? 1080 : 1920;

  "Pick a color": "Renk seç", "for the translations": "çeviriler için", "Lock": "Kilitle", "keeps it in place": "yerinde sabit tutar",

  "1 day. 3 days.": "1 gün. 3 gün.", "*7 days.*": "*7 gün.*", "Each right answer pushes the next review out.": "Her doğru cevap sonraki tekrarı daha ileri atar.",
  "1 day": "1 gün", "3 days": "3 gün", "7 days": "7 gün", "3 right answers = learned": "3 doğru cevap = öğrenildi",

  "Quizzes with levels": "Seviyeli quiz'ler", "Streaks and daily goals": "Seri ve günlük hedefler", "Daily challenge": "Günlük meydan okuma", "Words from a whole YouTube video": "Bir YouTube videosunun tüm kelimeleri",
  "Learn from what you watch.": "İzlediğinden öğren.", "Free. No account to start.": "Ücretsiz. Başlamak için hesap yok.", "Add to Chrome": "Chrome'a ekle", "KEPT TODAY": "BUGÜN TUTULAN",
  "hours of series.": "saatlik dizi.", "How many new words did you learn?": "Kaç yeni kelime öğrendin?",
};
const L = (x) => (LANG === "tr" && typeof x === "string" && TRD[x] != null ? TRD[x] : x); // yalnızca metin çevirisi; sahne mantığı dile bağlı değildir
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

const P = (t, a, d, e = E.out) => e(clamp((t - a) / d));

const place = (el, b) => { el.style.position = "absolute"; el.style.left = b.x + "px"; el.style.top = b.y + "px"; if (b.w != null) el.style.width = b.w + "px"; if (b.h != null) el.style.height = b.h + "px"; };
const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = L(txt); return e; };
const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
let COORD = null;

// ---- logo ----
function logoEl(size) {
  const d = mk("div", "lg"); d.style.width = d.style.height = size + "px";
  if (LOGO === "ticket") d.innerHTML = '<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#FFD42B"/><g transform="rotate(-14 50 50)"><path d="M14 34h72a0 0 0 0 1 0 0v10a6 6 0 0 0 0 12v10H14V56a6 6 0 0 0 0-12z" fill="#111110"/></g><text x="50" y="59" text-anchor="middle" font-family="CV Display,sans-serif" font-weight="800" font-size="30" fill="#FFD42B" transform="rotate(-14 50 50)">Cv</text></svg>';
  else d.innerHTML = '<img src="../../../extension/icons/icon128.png" alt="">';

// ---- başlık / metin bloğu ----
function textBlock(sc, o) {

  else if (WIDE) { place(d, { x: o.side === "r" ? 1010 : 110, y: 0, w: 780, h: H }); d.style.justifyContent = "center"; }
  else { place(d, { x: 64, y: 150, w: 952, h: o.h || 500 }); d.style.justifyContent = "flex-end"; }
  const words = [], h = mk("div", "h");
  (o.head || []).map(L).forEach((ln) => { const l = mk("span", "l"); ln.split(/(\*[^*]+\*)/).filter(Boolean).forEach((part) => { const em = part.startsWith("*"); (em ? part.slice(1, -1) : part).split(" ").filter(Boolean).forEach((w) => { const s = mk("span", "w" + (em ? " em" : ""), w); l.append(s); words.push(s); }); }); h.append(l); });
  if (o.size) h.style.fontSize = (WIDE ? o.size : o.size * 1.08) + "px";

}
function slam(words, u, t0 = 0.15, step = 0.085) { words.forEach((w, k) => { const lt = u - t0 - k * step, p = clamp(lt / 0.34); tf(w, { o: clamp(lt / 0.1), y: (1 - E.back(p)) * 52, s: 0.86 + 0.14 * E.back(p) }); }); }
const fadeIn = (el, u, t0, d = 0.4, dy = 24) => { const p = P(u, t0, d); tf(el, { o: p, y: (1 - p) * dy }); };

// ---- dokunma, patlama, konfeti ----
function mkRip(parent) { const r = mk("div", "rip"); r.innerHTML = '<div class="r"></div><div class="d"></div>'; parent.append(r); return r; }
function rip(r, u, t0, x, y) { const d = u - t0, on = d > -0.4 && d < 0.7; r.style.display = on ? "" : "none"; if (!on) return; r.style.left = x + "px"; r.style.top = y + "px"; const a = P(d, -0.4, 0.25), press = d < 0 ? 1 : 1 - 0.2 * P(d, 0, 0.08) + 0.2 * P(d, 0.08, 0.18), dd = r.querySelector(".d"), rg = r.querySelector(".r"); dd.style.opacity = a * (1 - P(d, 0.3, 0.3, E.lin)); dd.style.transform = `scale(${(0.7 + 0.3 * a) * press})`; const rp = P(d, 0, 0.55); rg.style.opacity = d < 0 ? 0 : (1 - rp) * 0.95; rg.style.transform = `scale(${1 + rp * 1.9})`; }
function mkBurst(parent, n = 8) { const o = { ring: mk("div", "ring"), sp: [] }; parent.append(o.ring); for (let i = 0; i < n; i++) { const s = mk("div", "spark"); parent.append(s); o.sp.push(s); } return o; }
function burst(b, u, t0, x, y, R = 120) { const d = u - t0, on = d >= 0 && d < 0.8; b.ring.style.display = on ? "" : "none"; b.sp.forEach((s) => (s.style.display = on ? "" : "none")); if (!on) return; const p = E.out(d / 0.8); b.ring.style.left = x + "px"; b.ring.style.top = y + "px"; b.ring.style.opacity = 1 - p; b.ring.style.transform = `scale(${0.4 + p * 1.6})`; b.sp.forEach((s, i) => { const a = (i / b.sp.length) * Math.PI * 2 + 0.3, r = 40 + p * R; s.style.left = x + Math.cos(a) * r + "px"; s.style.top = y + Math.sin(a) * r + "px"; s.style.opacity = 1 - p; s.style.transform = `scale(${1 - p * 0.7})`; }); }
function mkConfetti(parent, n, seed, mode, ox, oy) {
  const R = rng(seed), cols = ["#111110", "#ffffff", "#27AE60", "#E5322D", "#111110"], list = [];
  for (let i = 0; i < n; i++) {
    const e = mk("div", "cf"), w = 10 + R() * 12, h = 6 + R() * 8; e.style.width = w + "px"; e.style.height = h + "px"; e.style.background = cols[Math.floor(R() * cols.length)]; e.style.borderRadius = "2px";
    parent.append(e);

function confetti(list, u) { list.forEach((c) => { const d = u - c.delay; if (d < 0) { c.e.style.display = "none"; return; } c.e.style.display = ""; const k = 1.8, x = c.x0 + c.vx * (1 - Math.exp(-k * d)) / k + Math.sin(d * 2 + c.ph) * 16, y = c.y0 + c.vy * (1 - Math.exp(-k * d)) / k + 0.5 * 900 * d * d * 0.55; c.e.style.transform = `translate(${x}px,${y}px) rotate(${c.rot + c.w * d}deg) scaleY(${Math.cos(d * c.fl + c.ph)})`; c.e.style.opacity = clamp(1 - (y - H) / 200); }); }

// ---- video üstü kutu çerçevesi ----
function buildFrame(sc, o) { // o: {scale, x, y, tray, tools}
  const fw = mk("div", "fw"); fw.style.left = o.x + "px"; fw.style.top = o.y + "px"; fw.style.transform = `scale(${o.scale})`;

  const ps = mk("div", "psub"); ps.textContent = KW.plain;

  sc.append(fw); return h;
}
function frameRender(h, u, c) { // c: {wipe:[a,d]|null, tap:t|null, plainFrom}
  const prop = COORD.chips[KW.w], cx = prop.x + prop.width / 2, cy = prop.y + 34;
  if (c.wipe) { const p = P(u, c.wipe[0], c.wipe[1], E.io); h.chips.style.display = u >= c.wipe[0] ? "" : "none"; h.chips.style.clipPath = `inset(0 ${(1 - p) * 100}% 0 0)`; h.sweep.style.display = p > 0 && p < 1 ? "" : "none"; h.sweep.style.left = p * 1000 + "px"; h.ps.style.display = ""; }
  else { h.chips.style.display = ""; h.chips.style.clipPath = "none"; h.sweep.style.display = "none"; h.ps.style.display = "none"; }

    const kp = u >= c.tap ? P(u, c.tap + 0.03, 0.14, E.lin) : 0; h.kept.style.display = kp > 0 ? "" : "none"; h.kept.style.opacity = kp;
    const pop = u >= c.tap ? 1 + 0.05 * Math.sin(clamp((u - c.tap) / 0.35) * Math.PI) : 1; h.kept.style.transformOrigin = `${cx}px ${cy}px`; h.kept.style.transform = `scale(${pop})`;

      const tin = P(u, c.tap + 0.02, 0.35), fp = P(u, c.tap + 0.18, 0.62, E.io), landed = fp >= 1;
