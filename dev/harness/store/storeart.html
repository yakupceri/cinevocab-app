<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>store art</title>
<!-- Chrome Web Store görselleri (sarı/siyah dil): ?k=shot&n=1..5 (1280x800) · ?k=tile (440x280) · ?k=marquee (1400x560)
     Arayüz görselleri GERÇEK eklenti/site ekran görüntüleridir (dev/harness/ad2-assets.mjs, dev/site-harness/shots.mjs). Sürücü: dev/harness/store-art.mjs -->
<style>
  @font-face { font-family:"CV Display"; font-weight:800; src:url("../../../extension/fonts/d800.woff") format("woff"); }
  @font-face { font-family:"CV Text"; font-weight:500; src:url("../../../extension/fonts/t500.woff") format("woff"); }
  @font-face { font-family:"CV Text"; font-weight:600 700; src:url("../../../extension/fonts/t600.woff") format("woff"); }
  :root { --Y:#FFD42B; --K:#111110; }
  * { box-sizing:border-box; }
  html, body { margin:0; overflow:hidden; font:500 24px/1.35 "CV Text",system-ui,sans-serif; }
  .cv { position:relative; overflow:hidden; }
  .y { background:var(--Y); color:#111110; } .k { background:var(--K); color:#fff; }
  .abs { position:absolute; }
  .h { margin:0; font:800 64px/1.04 "CV Display",sans-serif; letter-spacing:-.03em; }
  .k .h .em { color:var(--Y); }
  .y .h .em { background:#111110; color:var(--Y); padding:0 .16em; border-radius:.2em; }
  .sub { margin-top:18px; font:500 26px/1.35 "CV Text",sans-serif; opacity:.85; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; }
  .holes { position:absolute; left:0; right:0; height:10px; background:repeating-linear-gradient(90deg,var(--hole) 0 22px,transparent 22px 40px); }
  .y .holes { --hole:rgba(0,0,0,.11); } .k .holes { --hole:rgba(255,255,255,.09); }
  .brand { position:absolute; left:64px; bottom:34px; display:flex; align-items:center; gap:12px; font:800 26px/1 "CV Display",sans-serif; }
  .brand img { width:40px; height:40px; border-radius:10px; }
  .shot { position:absolute; border-radius:16px; overflow:hidden; background:#000; box-shadow:0 24px 60px rgba(0,0,0,.45); }
  .shot img { position:absolute; display:block; }
  .pbez { position:absolute; border-radius:24px; overflow:hidden; background:#0B0B0A; box-shadow:0 0 0 7px #0a0a09, 0 0 0 9px rgba(255,255,255,.16), 0 30px 60px rgba(0,0,0,.5); }
  .pbez img { display:block; width:100%; height:100%; }
  .step { display:inline-block; margin:0 10px 0 0; padding:10px 22px; border-radius:99px; background:#111110; color:var(--Y); font:800 28px/1 "CV Display",sans-serif; }
  .pill { display:inline-block; margin:0 10px 10px 0; padding:10px 22px; border-radius:99px; background:#111110; color:var(--Y); font:800 24px/1 "CV Display",sans-serif; }
  .btn { display:inline-block; padding:16px 36px; border-radius:16px; background:#111110; color:var(--Y); font:800 30px/1 "CV Display",sans-serif; }
</style></head>
<body>
<script>
const Q = new URLSearchParams(location.search), K = Q.get("k") || "shot", N = +Q.get("n") || 1;
const LANG = Q.get("l") === "tr" ? "tr" : "en";
const A = "../../out/ad2/assets" + (LANG === "tr" ? "-tr" : "") + "/", ICON = "../../../extension/icons/icon128.png";
const T = LANG === "tr" ? {
  s1: [["Her altyazı kelimesi,", "*canlı çevrilir.*"], "YouTube, Prime Video, Netflix ve Udemy'de."],
  s2: [["Bir kelimeye tıkla,", "*tutulsun.*"], "Hesap yok. Sahneyle birlikte kaydedilir."],
  s3: [["Duyduğun cümlenin", "*içinde çalış.*"], "Tuttuğun altyazılardan boşluk doldurma soruları."],
  s4: [["1 gün. 3 gün.", "*7 gün.*"], "Her doğru cevap sonraki tekrarı daha ileri atar.", ["1 gün", "3 gün", "7 gün"]],
  s5: [["Arkadaşlarınla düello.", "*Sıralamada yüksel.*"], "Canlı düello ve sıralama, ücretsiz hesapla."],
  tile: [["İzlediğinden", "*öğren.*"], "Her altyazı kelimesi canlı çevrilir. Ücretsiz."],
  mq: [["İzlediğinden", "*öğren.*"], "Her altyazı kelimesi canlı çevrilir. Ücretsiz, başlamak için hesap yok."],
  th: [["Dizi izleyerek", "*İngilizce öğren*"], "Ücretsiz Chrome eklentisi"],
} : {
  s1: [["Every subtitle word,", "*translated live.*"], "On YouTube, Prime Video, Netflix and Udemy."],
  s2: [["Click a word,", "*keep it.*"], "No account. Saved with the scene."],
  s3: [["Practise in the line", "*you heard it in.*"], "Fill-in-the-blank questions from the subtitles you kept."],
  s4: [["1 day. 3 days.", "*7 days.*"], "Each right answer pushes the next review out.", ["1 day", "3 days", "7 days"]],
  s5: [["Duel your friends.", "*Climb the board.*"], "Live duels and leaderboards with a free account."],
  tile: [["Learn from", "*what you watch.*"], "Every subtitle word, translated live. Free."],
  mq: [["Learn from", "*what you watch.*"], "Every subtitle word, translated live. Free, no account to start."],
  th: [["Learn a language", "*from what you watch*"], "Free Chrome extension"],
};
const H = (lines) => '<h1 class="h">' + lines.map((l) => l.replace(/\*([^*]+)\*/g, '<span class="em">$1</span>')).join("<br>") + "</h1>";
const brand = '<div class="brand"><img src="' + ICON + '" alt="">CineVocab</div>';
const holes = '<div class="holes" style="top:12px"></div><div class="holes" style="bottom:12px"></div>';
const frame = (src, x, y, w, h, ox = 0, oy = 0, iw = null) => `<div class="shot" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><img src="${A + src}" style="left:${-ox}px;top:${-oy}px;width:${iw || w}px"></div>`;
const pop = (src, x, y, h) => { const w = Math.round(h * 380 / 584); return `<div class="pbez" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><img src="${A + src}"></div>`; };
let W = 1280, Hh = 800, th = "k", html = "";
if (K === "shot") {
  const steps = (a) => "<div style='margin-top:26px'>" + a.map((x) => `<span class='step'>${x}</span>`).join("") + "</div>";
  const S = {
    1: ["k", T.s1[0], T.s1[1], frame("chips.png", 470, 262, 760, 532, 0, 0, 760)],
    2: ["y", T.s2[0], T.s2[1], frame("kept.png", 470, 262, 760, 532, 0, 0, 760)],
    3: ["k", T.s3[0], T.s3[1], pop("p-cloze.png", 770, 70, 700)],
    4: ["y", T.s4[0], T.s4[1] + steps(T.s4[2]), pop("p-learned.png", 770, 70, 700)],
    5: ["k", T.s5[0], T.s5[1], ""],
  }[N];
  th = S[0];
  const tw = (N === 1 || N === 2) ? 1100 : 560, tt = (N === 1 || N === 2) ? 52 : 70;
  html = `<div class="cv ${th}" style="width:1280px;height:800px">${holes}<div class="abs" style="left:64px;top:${tt}px;width:${tw}px">${H(S[1])}<div class="sub">${S[2]}</div></div>${S[3]}${brand}</div>`;
  if (N === 5) { // sağdaki iki pencere: oran 2:1 küçültülmüş ekran görüntüsü
    html = `<div class="cv ${th}" style="width:1280px;height:800px">${holes}<div class="abs" style="left:64px;top:70px;width:560px">${H(S[1])}<div class="sub">${S[2]}</div></div>
      <div class="shot" style="left:660px;top:80px;width:560px;height:330px"><img src="${A}site-game-question.png" style="left:-280px;top:-68px;width:1120px"></div>
      <div class="shot" style="left:660px;top:440px;width:560px;height:200px"><img src="${A}site-duel.png" style="left:-211px;top:-294px;width:822px"></div>${brand}</div>`;
  }
} else if (K === "tile") {
  W = 440; Hh = 280; th = "y";
  const t0 = T.tile[0];
  html = `<div class="cv y" style="width:440px;height:280px"><div class="holes" style="top:8px;height:7px;background-size:16px 7px"></div>
    <img src="${ICON}" class="abs" style="left:28px;top:34px;width:64px;height:64px;border-radius:15px;box-shadow:0 10px 24px rgba(0,0,0,.25)">
    <div class="abs h" style="left:28px;top:112px;font-size:34px;line-height:1.05;width:390px">${t0[0]}<br><span style="background:#111110;color:#FFD42B;padding:0 .14em;border-radius:.2em">${t0[1].replace(/\*/g, "")}</span></div>
    <div class="abs mono" style="left:28px;bottom:26px;font-size:15px;opacity:.75;width:390px">${T.tile[1]}</div></div>`;
} else if (K === "marquee") {
  W = 1400; Hh = 560; th = "k";
  html = `<div class="cv k" style="width:1400px;height:560px">${holes}
    <img src="${ICON}" class="abs" style="left:70px;top:70px;width:84px;height:84px;border-radius:20px">
    <div class="abs">${""}</div>
    <div class="abs" style="left:70px;top:190px;width:640px">${H(T.mq[0]).replace('class="h"', 'class="h" style="font-size:82px"')}</div>
    <div class="abs sub" style="left:70px;top:420px;width:600px;font-size:28px">${T.mq[1]}</div>
    ${frame("chips.png", 760, 70, 700, 490, 0, 0, 700)}</div>`;
} else if (K === "thumb") {
  W = 1280; Hh = 720; th = "k";
  // dikkat çekici kapak: iri üç satır büyük harf, sarı vurgu, büyütülmüş altyazı kutusu, kırmızı halka, ücretsiz etiketi
  const C = LANG === "tr"
    ? { lines: ["DİZİ İZLE", "İNGİLİZCE", "*ÖĞREN*"], free: "ÜCRETSİZ", crop: { x: 960, y: 872, w: 600, h: 380 }, ring: { x: 1322, y: 892, w: 172, h: 118 } }
    : { lines: ["EVERY WORD", "TRANSLATED", "*INSTANTLY*"], free: "FREE", crop: { x: 1020, y: 872, w: 760, h: 380 }, ring: { x: 1530, y: 892, w: 214, h: 118 } };
  const bw = 580, k = bw / C.crop.w, bh = Math.round(C.crop.h * k), bx = 672, by = 186;
  const hl = C.lines.map((l) => l.startsWith("*") ? `<span style="background:#FFD42B;color:#111110;padding:0 .12em;border-radius:.14em">${l.replace(/\*/g, "")}</span>` : l).join("<br>");
  const rg = C.ring;
  html = `<div class="cv k" style="width:1280px;height:720px">
    <div class="abs" style="left:56px;top:40px;display:flex;align-items:center;gap:14px;font:800 36px/1 'CV Display',sans-serif"><img src="${ICON}" style="width:64px;height:64px;border-radius:15px">CineVocab</div>
    <div class="abs" style="left:56px;top:${LANG === 'tr' ? 150 : 170}px;width:640px;font:800 ${LANG === 'tr' ? 112 : 92}px/1.02 'CV Display',sans-serif;letter-spacing:-.03em">${hl}</div>
    <div class="shot" style="left:${bx}px;top:${by}px;width:${bw}px;height:${bh}px;border-radius:20px;box-shadow:0 0 0 6px #FFD42B, 0 30px 60px rgba(0,0,0,.5)"><img src="${A}kept.png" style="left:${-C.crop.x * k}px;top:${-C.crop.y * k}px;width:${2000 * k}px"></div>
    <div class="abs" style="left:${bx + (rg.x - C.crop.x) * k - 10}px;top:${by + (rg.y - C.crop.y) * k - 10}px;width:${rg.w * k + 20}px;height:${rg.h * k + 20}px;border:9px solid #E5322D;border-radius:50%"></div>
    <div class="abs" style="left:56px;bottom:46px;padding:14px 34px;border-radius:99px;background:#FFD42B;color:#111110;font:800 44px/1 'CV Display',sans-serif;letter-spacing:.02em;transform:rotate(-3deg)">${C.free}</div></div>`;
}
document.body.innerHTML = html; document.documentElement.style.width = W + "px"; document.documentElement.style.height = Hh + "px";
document.title = "ready";
</script>
</body></html>
