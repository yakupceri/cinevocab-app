  @font-face { font-family:"Instrument Sans"; src:url(fonts/instrumentsans-latin.woff2) format("woff2"); font-weight:400 700;
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family:"Instrument Sans"; src:url(fonts/instrumentsans-latin-ext.woff2) format("woff2"); font-weight:400 700;
    unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  :root { --night:#170E12; --deep:#0F080B; --panel:#25161C; --panel2:#321E26; --line:#3D3035; --line2:#5A4A50; --ink:#F3E9D2; --dim:#AC9C92; --sun:#FFD21E; --on:#170E12; --mint:#7BD39A; --film:#0A0507;
    --display:"Big Shoulders","Arial Narrow",sans-serif; --text:"Instrument Sans",system-ui,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace; }

  .box { position:absolute; width:max-content; padding:.7em 1em; border-radius:.4em; font:400 32px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:#F3E9D2; background:rgba(23,14,18,.85); border:1px solid #3D3035; }
  .box .lg { display:flex; align-items:center; gap:.6em; margin-bottom:.4em; font-size:.74em; font-weight:600; color:#D9CDBF; }

  .pp .swap { width:36px; height:40px; border-radius:6px; border:1px solid var(--line); display:grid; place-items:center; color:var(--dim); } .pp .swap svg { width:16px; height:16px; }

  .pp .cl { margin:12px 0 8px; font:600 19px/1.6 var(--text); text-align:center; }

  .pp .ans { margin-top:8px; padding:12px 14px; border-radius:10px; border:1px solid var(--line2); background:var(--panel); font-weight:600; font-size:15px; }
  .pp .wt-top { padding-bottom:12px; border-bottom:1px solid var(--line); }

  .pp .wt-film { padding:9px 12px 11px; border-radius:10px; background:#0A0507; border:1px solid var(--line); }
  .pp .wt-tag { display:block; font:500 10.5px/1.2 var(--mono); letter-spacing:.08em; color:var(--dim); }
  .pp .wt-line { display:flex; flex-wrap:wrap; justify-content:center; gap:2px 14px; margin-top:6px; }
  .pp .wt-w { display:grid; justify-items:center; } .pp .wt-w b { font:600 17px/1.2 var(--text); color:var(--ink); } .pp .wt-w i { font:normal 600 12.5px/1.3 var(--text); color:var(--line2); }
  .pp .wt-status { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px; margin:9px 2px; }
  .pp .wt-status b { font:800 17px/1.2 var(--display); letter-spacing:.01em; color:var(--dim); } .pp .wt-status span { font-size:12px; line-height:1.35; color:var(--dim); }
  .pp .wt-main { min-height:48px; padding:8px 14px; border-radius:6px; background:var(--sun); color:var(--on); font:800 19px/32px var(--display); letter-spacing:.02em; text-align:center; }
  .pp .wt-lang { display:grid; grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr); gap:8px; align-items:end; } .pp .wt-lang .lbl { margin-bottom:4px; font-size:11.5px; } .pp .wt-lang .swap { width:40px; }

  .pp .mg-hud { display:grid; grid-template-columns:1fr 1fr 1fr 32px; gap:6px; align-items:center; margin:4px 0 8px; }
  .pp .mg-hud div { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:5px 6px; text-align:center; }
  .pp .mg-hud small { display:block; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--dim); } .pp .mg-hud b { font:800 20px/1.1 var(--display); font-variant-numeric:tabular-nums; }
  .pp .mg-hud .cb { color:var(--sun); }
  .pp .mg-hud .x { width:32px; height:32px; padding:0; border-radius:6px; border:1px solid var(--line2); background:transparent; color:var(--dim); font-size:18px; line-height:30px; }
  .pp .mg-board { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; height:316px; margin-top:8px; padding:6px; background:var(--deep); border:1px solid var(--line); border-radius:10px; }
  .pp .mg-col { display:flex; flex-direction:column; justify-content:flex-end; gap:5px; min-width:0; }

  .pp .mg-tile.mg-w { background:var(--panel2); font:800 16px/1.1 var(--display); letter-spacing:.01em; } .pp .mg-tile.long { font-size:11.5px; } .pp .mg-tile.mg-w.long { font-size:13px; }

<script>
const Q = new URLSearchParams(location.search), K = Q.get("k") || "shot", N = +Q.get("n") || 1;
const LANG = Q.get("l") === "tr" ? "tr" : "en";
const MARKA = "../../../docs/marka/", ICON = MARKA + "cinevocab-simge.svg", MARK = MARKA + "cinevocab-isaret.svg";

/* ============ BAŞLIKLAR: değiştirilecek tek yer. *yıldız arası* sarı vurgulanır. ============ */
const TITLES = {
  en: {
    s1: "Every subtitle word, *translated as you watch.*",
    s2: "Click a word to keep it. *Add your own note.*",
    s3: "Practise each word *in the line you heard it.*",
    s4: "Match your words *against the clock.*",
    s5: "Off until *you switch it on.*",
    promo: "Learn the words from *what you watch.*",

  tr: {
    s1: "Her altyazı kelimesi, *izlerken çevrilir.*",
    s2: "Kelimeye tıkla, kaydet. *Kendi notunu ekle.*",

    s5: "Sen açana kadar *kapalı.*",
    promo: "İzlediğin dizinin *kelimelerini öğren.*",

}[LANG];

/* Arayüz metinleri: eklentinin sözlüklerinden birebir (lang.js, popup-i18n.js). */
const UI = {
  en: { code: "EN", signIn: "Sign in", tabs: ["Watch", "Words", "Practice", "Me"], change: "Change", kept: "1 kept", noteSave: "Save",
    off: "Off", offHint: "No subtitle text is sent until you switch it on.", sample: "Example", start: "Start translating", subLang: "Subtitles", transLang: "Translation", boxT: "Box settings", wSrc: "Spanish", wDst: "English",
    cloze: "Fill in the blank", score: "Score", combo: "Combo", time: "Time" },
  tr: { code: "TR", signIn: "Giriş yap", tabs: ["İzle", "Kelimeler", "Pratik", "Ben"], change: "Değiştir", kept: "1 kaydedildi", noteSave: "Kaydet",
    off: "Kapalı", offHint: "Sen açana kadar altyazı metni gönderilmez.", sample: "Örnek", start: "Çeviriyi başlat", subLang: "Altyazı", transLang: "Çeviri", boxT: "Kutu ayarları", wSrc: "İspanyolca", wDst: "İngilizce",
    cloze: "Boşluğu doldur", score: "Puan", combo: "Kombo", time: "Süre" },

/* Örnek içerik (uydurma altyazı cümlesi; gerçek film/dizi değil). EN görselleri: İspanyolca > İngilizce. TR görselleri: İngilizce > Türkçe. */
const DEMO = {
  en: { src: "Spanish", dst: "English",
    chips: [["Lo", ""], ["más", "more"], ["importante", "important"], ["en", ""], ["la", ""], ["vida", "life"], ["es", ""], ["tener", "to have"], ["amor", "love"], ["propio", "own"]],
    keep: "amor", sent: "The most important thing in life is to have self-love.", note: "amor propio = self-love",
    cloze: ["Lo más importante en la ", " es tener amor propio"], clozeT: "life", opts: ["mundo", "vida", "pregunta", "feliz"],
    board: [[["world", 0], ["love", 0], ["happy", 0]], [["importante", 1], ["vida", 1], ["pregunta", 1]], [["important", 0], ["life", 0], ["question", 0]], [["mundo", 1], ["amor", 1], ["feliz", 1]]], sel: "amor" },
  tr: { src: "İngilizce", dst: "Türkçe",
    chips: [["The", ""], ["most", "en"], ["important", "önemli"], ["thing", "şey"], ["in", ""], ["life", "hayat"], ["is", ""], ["to", ""], ["love", "sevmek"], ["yourself", "kendin"]],
    keep: "life", sent: "Hayattaki en önemli şey kendini sevmektir.", note: "in life = hayatta",
    cloze: ["The most important thing in ", " is to love yourself"], clozeT: "hayat", opts: ["world", "life", "question", "happy"],
    board: [[["dünya", 0], ["sevmek", 0], ["mutlu", 0]], [["important", 1], ["life", 1], ["question", 1]], [["önemli", 0], ["hayat", 0], ["soru", 0]], [["world", 1], ["love", 1], ["happy", 1]]], sel: "love" },
}[LANG];

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const H = (t, style = "") => `<h1 class="h" style="${style}">` + esc(t).split("*").map((x, i) => x.trim() ? `<span class="${i % 2 ? "em" : "pl"}">${x.trim()}</span>` : "").join("") + "</h1>";
const brand = (style) => `<div class="brand abs" style="${style}"><img src="${MARK}" alt="">CineVocab</div>`;

// Sahne: düz renkli çizim (iki siluet, pencere, masa lambası). Marka, yüz, gerçek kare yok.
const scene = () => `<svg class="scene" viewBox="0 0 1152 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <rect x="760" y="50" width="250" height="210" rx="6" fill="#25161C"/><path d="M885 50v210M760 155h250" stroke="#0A0507" stroke-width="8"/>
  <rect x="0" y="400" width="1152" height="100" fill="#170E12"/>
  <circle cx="330" cy="210" r="62" fill="#25161C"/><path d="M190 500V410a140 120 0 0 1 280 0v90z" fill="#25161C"/>
  <circle cx="590" cy="250" r="50" fill="#321E26"/><path d="M480 500V420a110 100 0 0 1 220 0v80z" fill="#321E26"/>
  <rect x="24" y="478" width="1104" height="5" rx="2.500" fill="#3D3035"/><rect x="24" y="478" width="380" height="5" rx="2.500" fill="#AC9C92"/>
</svg>`;
const box = (o) => {
  const chips = DEMO.chips.map(([w, t]) => `<span class="chip${t ? "" : " dimw"}${o.kept && w === DEMO.keep ? " star" : ""}"><div class="w">${esc(w)}</div><div class="t">${esc(t)}</div></span>`).join("");
  return `<div class="box" style="${o.style}"><div class="lg"><span>${DEMO.src} → ${DEMO.dst}</span>${o.kept ? `<span class="kept">${UI.kept}</span>` : ""}<span class="bt">${UI.change}</span></div>
    <div>${chips}</div><div class="sent">${esc(DEMO.sent)}</div>
    ${o.kept ? `<div class="note"><div class="in">${esc(DEMO.note)}<i></i></div><div class="ok">${UI.noteSave}</div></div>` : ""}</div>`;
};
const NAVI = ['<rect x="3" y="4" width="18" height="13" rx="3"/><path d="M10 8.5v4l3.5-2zM8 21h8"/>', '<rect x="4" y="3" width="13" height="16" rx="2.500"/><path d="M8 8h5M8 12h5M20 7v12a2 2 0 0 1-2 2H8"/>', '<path d="M13 2 5 14h6l-1 8 8-12h-6z"/>', '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.500-4 4.500-6 8-6s6.500 2 8 6"/>'];
const popup = (tab, body, style) => `<div class="pp" style="${style}">
  <div class="top"><img class="mk" src="${MARK}" alt=""><b>CineVocab</b>
    <span class="pill lgp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.200 3 14.800 0 18M12 3c-3 3.200-3 14.800 0 18"/></svg>${UI.code}</span>
    <span class="pill si">${UI.signIn}</span></div>
  <main>${body}</main>
  <nav>${UI.tabs.map((t, i) => `<div class="${i === tab ? "on" : ""}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${NAVI[i]}</svg><span>${t}</span></div>`).join("")}</nav></div>`;
const BODY = {
  cloze: () => `<div class="row"><div class="grow"><div class="bar"><i style="width:25%"></i></div></div><div class="xb">✕</div></div>
    <div class="lp-lab">${UI.cloze}</div><div class="cl">${esc(DEMO.cloze[0])}<span class="cl-gap"></span>${esc(DEMO.cloze[1])}</div>
    <div class="cl-tr">${esc(DEMO.sent)}</div><div class="cl-tr mono">= ${esc(DEMO.clozeT)}</div>
    ${DEMO.opts.map((o) => `<div class="ans">${esc(o)}</div>`).join("")}`,
  // Oyun: 2 eşleşme yapılmış an (10 + 20 = 30 puan, kombo x2), 47 sn kaldı; kurallar popup.js mgTap/mgHud ile aynı.
  match: () => `<div class="mg-hud"><div><small>${UI.score}</small><b>30</b></div><div><small>${UI.combo}</small><b class="cb">x2</b></div><div><small>${UI.time}</small><b>47</b></div><div class="x">×</div></div>
    <div class="bar"><i style="width:78%"></i></div>
    <div class="mg-board">${DEMO.board.map((col) => `<div class="mg-col">${col.map(([t, w]) => `<div class="mg-tile ${w ? "mg-w" : "mg-t"}${t.length > 9 ? " long" : ""}${t === DEMO.sel ? " picked" : ""}">${esc(t)}</div>`).join("")}</div>`).join("")}</div>`,
  // İzle sekmesi, kapalı durum (popup.html .wt-*): örnek satır popup.js WT_S.es / WT_G.en ile aynı, iki dilde de ES → EN (gerçek ekran: dev/out/popup/izle-yeni.png).
  off: () => `<div class="wt-top"><div class="wt-film"><span class="wt-tag">${UI.sample} · ES → EN</span><div class="wt-line">${[["Nunca", "never"], ["es", "is"], ["tarde", "late"]].map(([w, t]) => `<span class="wt-w"><b>${w}</b><i>${t}</i></span>`).join("")}</div></div>
      <p class="wt-status"><b>${UI.off}</b><span>${UI.offHint}</span></p><div class="wt-main">${UI.start}</div></div>
    <div class="wt-scroll"><div class="wt-lang"><div><span class="lbl">${UI.subLang}</span><div class="sel">${UI.wSrc}</div></div>
      <div class="swap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13l-3-3M17 17H4l3 3"/></svg></div>
      <div><span class="lbl">${UI.transLang}</span><div class="sel">${UI.wDst}</div></div></div>
      <div class="wt-box">${UI.boxT}</div></div>`,
};

const SIDE_PX = { en4: 90 };   // yan başlık boyutu istisnaları (varsayılan 96): EN 4 bu boyutta iki satıra oturur
let W = 1280, Hh = 800, html = "";
if (K === "shot") {
  if (N === 1 || N === 2) {
    // üstte başlık, altta film karesi ve içinde kutu
    html = `<div class="cv" style="width:1280px;height:800px"><div class="abs" data-fit style="left:64px;top:44px;width:1152px;height:176px;display:flex;align-items:center">${H(TITLES["s" + N], "width:100%")}</div>
      <div class="film" style="left:64px;top:236px;width:1152px;height:516px">${scene()}${box({ kept: N === 2, style: "left:50%;bottom:44px;transform:translateX(-50%)" })}</div></div>`;
  } else {
    // solda başlık, sağda popup (380x584, 1.2 kat)
    const body = { 3: ["cloze", 2], 4: ["match", 2], 5: ["off", 0] }[N];
    html = `<div class="cv" style="width:1280px;height:800px"><div class="abs" data-fit style="left:64px;top:50px;width:620px;height:600px;display:flex;align-items:center">${H(TITLES["s" + N], `font-size:${SIDE_PX[LANG + N] || 96}px;width:100%`)}</div>
      <div class="abs dash" style="left:64px;top:672px;width:250px"></div>${brand("left:64px;bottom:50px")}
      ${popup(body[1], BODY[body[0]](), "zoom:1.2;left:633px;top:41px")}</div>`;
  }
} else if (K === "tile") {
  W = 440; Hh = 280;
  html = `<div class="cv" style="width:440px;height:280px"><img class="abs" src="${ICON}" alt="" style="left:24px;top:68px;width:144px;height:144px">
    <div class="abs" data-fit style="left:190px;top:20px;width:230px;height:240px;display:flex;align-items:center">${H(TITLES.promo, "font-size:44px;width:100%")}</div></div>`;
} else if (K === "marquee") {
  W = 1400; Hh = 560;
  html = `<div class="cv" style="width:1400px;height:560px">${brand("left:80px;top:64px")}
    <div class="abs" data-fit style="left:80px;top:130px;width:820px;height:320px;display:flex;align-items:center">${H(TITLES.promo, "font-size:104px;width:100%")}</div>
    <div class="abs dash" style="left:80px;top:486px;width:300px"></div>
    <img class="abs" src="${ICON}" alt="" style="left:960px;top:100px;width:360px;height:360px"></div>`;
} else if (K === "thumb") {
  W = 1280; Hh = 720;
  html = `<div class="cv" style="width:1280px;height:720px">${brand("left:72px;top:64px;font-size:44px").replace("<img ", '<img style="height:56px" ')}
    <div class="abs" data-fit style="left:72px;top:160px;width:720px;height:420px;display:flex;align-items:center">${H(TITLES.promo, "font-size:128px;width:100%")}</div>
    <div class="abs dash" style="left:72px;top:612px;width:340px;height:12px"></div>
    <img class="abs" src="${ICON}" alt="" style="left:830px;top:160px;width:400px;height:400px"></div>`;
}
document.body.innerHTML = html; document.documentElement.style.width = W + "px"; document.documentElement.style.height = Hh + "px";

// Başlık alanına sığmıyorsa yazı küçülür (uzun çeviriler için); alt sınırın altına inmez, o zaman CHECK uyarır.
const fitAll = () => document.querySelectorAll("[data-fit]").forEach((f) => { const h = f.firstElementChild; let fs = parseFloat(getComputedStyle(h).fontSize); const min = fs * .62;
  while (fs > min && (h.getBoundingClientRect().height > f.clientHeight || h.scrollWidth > f.clientWidth)) { fs -= 2; h.style.fontSize = fs + "px"; } });
// Taşma denetimi (sürücü okur): başlık kendi alanına sığıyor mu, kutu film karesinin içinde mi, popup içeriği kesiliyor mu.
window.CHECK = () => {
  const out = [], r = (e) => e.getBoundingClientRect();
  document.querySelectorAll("[data-fit]").forEach((f) => { const a = r(f), b = r(f.firstElementChild); if (b.height > a.height + 1 || f.firstElementChild.scrollWidth > f.clientWidth + 1) out.push("başlık alanına sığmıyor: " + Math.round(b.height) + " > " + Math.round(a.height)); });
  document.querySelectorAll(".film .box").forEach((b) => { const a = r(b.parentElement), c = r(b); if (c.left < a.left + 16 || c.right > a.right - 16 || c.top < a.top + 16) out.push("kutu film karesinden taşıyor"); });
  document.querySelectorAll(".pp main").forEach((m) => { if (m.scrollHeight > m.clientHeight + 1) out.push("popup içeriği kesiliyor"); });
  document.querySelectorAll(".mg-tile, .ans, .sel, .pill").forEach((t) => { if (t.scrollWidth > t.clientWidth + 1) out.push("taş/düğme metni taşıyor: " + t.textContent); });
  document.querySelectorAll("img").forEach((i) => { if (!i.naturalWidth) out.push("görsel yüklenmedi: " + i.getAttribute("src")); });
  for (const f of ["800 40px 'Big Shoulders'", "500 16px 'Instrument Sans'"]) if (!document.fonts.check(f)) out.push("yazı tipi yüklenmedi: " + f);
  return out;
};
Promise.all([document.fonts.load("800 40px 'Big Shoulders'", "Aİğşçöü"), document.fonts.load("500 16px 'Instrument Sans'", "Aİğşçöü"), document.fonts.load("700 16px 'Instrument Sans'", "Aİğşçöü")])
  .then(() => Promise.all([...document.images].map((i) => i.decode().catch(() => {})))).then(() => { fitAll(); document.title = "ready"; });
</script>
</body></html>
